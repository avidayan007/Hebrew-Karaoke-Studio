<!doctype html><meta charset="utf-8"><title>Renderer self-test</title><pre id="out">starting</pre><script type="module">
const out=document.getElementById('out'); const log=s=>{out.textContent+='\n'+s;console.log(s)};
window.__RESULT__={done:false,ok:false,error:null,mp4:0,wmv:0};
const timeout=(p,ms,msg)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error(msg)),ms))]);
try{
 log('import-local');
 const {FFmpeg}=await import('./vendor/ffmpeg/ffmpeg/index.js');
 const f=new FFmpeg(); f.on('log',({message})=>log(message));
 const base=new URL('./vendor/ffmpeg/core/',location.href).href;
 log('core-load-local');
 await timeout(f.load({coreURL:base+'ffmpeg-core.js',wasmURL:base+'ffmpeg-core.wasm'}),60000,'local core load timeout');
 log('render-mp4');
 let rc=await f.exec(['-f','lavfi','-i','color=c=black:s=640x360:r=25:d=1','-f','lavfi','-i','sine=frequency=1000:duration=1','-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p','-c:a','aac','-b:a','128k','-shortest','test.mp4']);
 if(rc!==0) throw new Error('mp4 rc '+rc);
 const mp4=await f.readFile('test.mp4'); window.__RESULT__.mp4=mp4.length; log('mp4 bytes '+mp4.length); if(mp4.length<1000)throw new Error('mp4 too small');
 log('render-wmv');
 rc=await f.exec(['-i','test.mp4','-c:v','wmv2','-b:v','2M','-c:a','wmav2','-b:a','128k','test.wmv']);
 if(rc!==0) throw new Error('wmv rc '+rc);
 const wmv=await f.readFile('test.wmv'); window.__RESULT__.wmv=wmv.length; log('wmv bytes '+wmv.length); if(wmv.length<1000)throw new Error('wmv too small');
 window.__RESULT__.ok=true;
}catch(e){window.__RESULT__.error=String(e?.message||e);log('ERROR '+window.__RESULT__.error)}finally{window.__RESULT__.done=true;log('done')}
</script>
