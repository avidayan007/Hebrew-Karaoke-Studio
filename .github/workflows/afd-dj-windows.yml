name: Build AFD DJ Windows
on:
  workflow_dispatch:
  push:
    branches: [afd-dj-mobile]
    paths:
      - 'afd-dj/**'
      - '.github/workflows/afd-dj-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: afd-dj/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: afd-dj/windows/package.json
      - name: Prepare local Spotify playback runtime
        shell: pwsh
        run: |
          Copy-Item ../spotify-playback-v85.js ./spotify-playback-v85-local.js -Force
          if (!(Test-Path 'spotify-playback-v85-local.js')) { throw 'Local Spotify playback runtime missing' }
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check main-v184.js
          node --check main-v200.js
          node --check main-v203.js
          node --check main-v205.js
          node --check main-v206.js
          node --check main-v207.js
          node --check main-v208.js
          node --check main-v209.js
          node --check main-v210.js
          node --check main-v211.js
          node --check preload.js
          node --check runtime-v167.js
          node --check runtime-v168.js
          node --check runtime-v169.js
          node --check runtime-v170.js
          node --check runtime-v171.js
          node --check runtime-v172.js
          node --check runtime-v175.js
          node --check runtime-v184.js
          node --check runtime-v185.js
          node --check runtime-v195.js
          node --check runtime-v196.js
          node --check runtime-v200.js
          node --check runtime-v203.js
          node --check runtime-v205.js
          node --check runtime-v206.js
          node --check runtime-v207.js
          node --check runtime-v208.js
          node --check runtime-v210.js
          node --check runtime-v211.js
          node --check spotify-playback-v85-local.js
          node --check ../deck-replace-confirm-v158.js
          node --check ../inline-youtube.js
          node --check ../inline-youtube-core-v48.js
      - name: Verify v1.5.11 single-owner deck and Side View markers
        shell: pwsh
        run: |
          $m = Get-Content 'main-v211.js' -Raw
          foreach ($x in @(
            "require('./main-v210.js')",
            "file==='runtime-v206.js'",
            'window.__afdUnified211?.loadDeck',
            'window.__afdUnified211?.loadLocal',
            'window.__afdUnified211?.loadSpotify',
            'window.__afdUnified211?.loadYouTube',
            'AFDSpotifyState?.pause',
            "action:'pause'",
            "file==='runtime-v208.js'",
            'if(window.__afd211Active)return',
            "file==='runtime-v210.js'",
            '__afd210DisabledBy211',
            "runtime-v211.js"
          )) { if (-not $m.Contains($x)) { throw "main-v211 marker missing: $x" } }
          $r = Get-Content 'runtime-v211.js' -Raw
          foreach ($x in @(
            'window.__afd211Active=true',
            "P='afdSavedPlaylists211'",
            'async function clearSpotify',
            'function clearYouTube',
            'function clearLocal',
            'async function clearOthers',
            'function loadDeck',
            'function loadLocal',
            'function loadSpotify',
            'function loadYouTube',
            'window.__afdUnified211=',
            'async function saveSide',
            "id='afd211side'",
            "id='afd211playlist'",
            "w.addEventListener('dblclick'",
            'C()?.playIndex?.(+r.dataset.i,{mix:true})',
            'C()?.startAuto?.()',
            'C()?.startNext?.()',
            'C()?.stopAuto?.()',
            'C()?.moveQueue?.',
            'C()?.removeQueue?.',
            '.sideview>#afd208side{display:none!important}'
          )) { if (-not $r.Contains($x)) { throw "runtime-v211 marker missing: $x" } }
          if ($r.Contains('paintSpotifyClock')) { throw 'runtime-v211 must not create a competing Spotify clock' }
          $c = Get-Content 'runtime-v206.js' -Raw
          foreach ($x in @('async function loadAny(k,it){','async function loadLocal(k,it){','async function loadSpotify(k,it){','async function loadYouTube(k,it){',"status('MIX • '+from+' → '+k+' הושלם')")) { if (-not $c.Contains($x)) { throw "runtime-v206 patch target missing: $x" } }
          $u = Get-Content 'runtime-v208.js' -Raw
          if (-not $u.Contains('function side(force=false){')) { throw 'runtime-v208 side patch target missing' }
          $sp = Get-Content 'spotify-playback-v85-local.js' -Raw
          if (-not $sp.Contains('function paintTime(deck)')) { throw 'Spotify native clock owner missing' }
          $yt = Get-Content '../inline-youtube-core-v48.js' -Raw
          if (-not $yt.Contains('window.AFDYouTubeState={isPlaying:deck=>')) { throw 'YouTube deck state API missing' }
          $pkg = Get-Content 'package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.11') { throw 'package version is not 1.5.11' }
          if ($pkg.main -ne 'main-v211.js') { throw 'package main is not main-v211.js' }
          foreach ($f in @('main-v211.js','runtime-v211.js','main-v210.js','runtime-v184.js','runtime-v185.js','runtime-v206.js','runtime-v207.js','runtime-v208.js','spotify-playback-v85-local.js')) { if (!(Test-Path $f)) { throw "$f missing" } }
          Write-Host 'AFD v1.5.11 single-owner deck loading, Side View, playlists and post-fade stop markers OK'
      - run: npm install
      - name: Verify audio engines
        shell: pwsh
        run: |
          if (!(Test-Path 'node_modules/signalsmith-stretch/SignalsmithStretch.js')) { throw 'Signalsmith Stretch runtime missing' }
          if (!(Test-Path 'node_modules/ffmpeg-static/ffmpeg.exe')) { throw 'FFmpeg binary missing' }
          if (!(Test-Path 'node_modules/music-tempo')) { throw 'music-tempo Beatroot runtime missing' }
          node -e "const m=require('music-tempo');const MT=m.default||m;if(typeof MT!=='function')throw Error('music-tempo export invalid');console.log('music-tempo Beatroot OK')"
      - run: npm run dist
      - name: Verify packaged v1.5.11 files
        shell: pwsh
        run: |
          $asar = 'dist/win-unpacked/resources/app.asar'
          if (!(Test-Path $asar)) { throw 'app.asar missing from packaged app' }
          $list = & npx --no-install asar list $asar
          if ($LASTEXITCODE -ne 0) { throw 'Unable to list app.asar' }
          foreach ($needle in @('main-v211.js','runtime-v211.js','main-v210.js','runtime-v184.js','runtime-v185.js','runtime-v206.js','runtime-v207.js','runtime-v208.js','spotify-playback-v85-local.js','preload.js')) {
            if (-not (($list -join "`n").Contains($needle))) { throw "Packaged app missing $needle" }
          }
          if (!(Test-Path 'dist/AFD-DJ-Windows-Setup-1.5.11-x64.exe')) { throw 'v1.5.11 installer missing' }
          Write-Host 'Packaged AFD v1.5.11 contains single-owner deck source switching, independent Side View, manual playlists, Auto Mix and HQ KEY support'
      - uses: actions/upload-artifact@v4
        with:
          name: AFD-DJ-Windows
          path: |
            afd-dj/windows/dist/*.exe
          if-no-files-found: error
