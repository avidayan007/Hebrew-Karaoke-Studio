name: Build AFD DJ Windows
on:
  workflow_dispatch:
  push:
    branches: [afd-dj-mobile]
    paths:
      - 'afd-dj/**'
      - '.github/workflows/afd-dj-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: afd-dj/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: afd-dj/windows/package.json
      - name: Prepare local Spotify playback runtime
        shell: pwsh
        run: |
          Copy-Item ../spotify-playback-v85.js ./spotify-playback-v85-local.js -Force
          if (!(Test-Path 'spotify-playback-v85-local.js')) { throw 'Local Spotify playback runtime missing' }
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check main-v184.js
          node --check main-v200.js
          node --check main-v203.js
          node --check main-v205.js
          node --check main-v206.js
          node --check main-v207.js
          node --check main-v208.js
          node --check preload.js
          node --check runtime-v167.js
          node --check runtime-v168.js
          node --check runtime-v169.js
          node --check runtime-v170.js
          node --check runtime-v171.js
          node --check runtime-v172.js
          node --check runtime-v175.js
          node --check runtime-v184.js
          node --check runtime-v185.js
          node --check runtime-v195.js
          node --check runtime-v196.js
          node --check runtime-v200.js
          node --check runtime-v203.js
          node --check runtime-v205.js
          node --check runtime-v206.js
          node --check runtime-v207.js
          node --check runtime-v208.js
          node --check spotify-playback-v85-local.js
          node --check ../deck-replace-confirm-v158.js
          node --check ../inline-youtube.js
          node --check ../inline-youtube-core-v48.js
          node --check ../layout-mix-final-v138.js
          node --check ../automix-order-v159.js
      - name: Verify v1.5.8 unified controller markers
        shell: pwsh
        run: |
          $m208 = Get-Content 'main-v208.js' -Raw
          foreach ($m in @(
            "RUNTIME_UNIFIED_JS=readRuntime('runtime-v208.js')",
            'workstation.html?v=208',
            'AFD DJ 1.5.8 UNIFIED'
          )) { if (-not $m208.Contains($m)) { throw "main-v208 marker missing: $m" } }
          $r208 = Get-Content 'runtime-v208.js' -Raw
          foreach ($m in @(
            'window.__afd208',
            "const P0='afdSavedPlaylistFiles177'",
            "P1='afdSavedPlaylists208'",
            "H2='afdPlaybackHistory208v1'",
            "id='afd208content'",
            "id='afd208side'",
            "id='afd208online'",
            '▶ START AUTO',
            '💾 SAVE',
            'window.AFDOpenYT',
            '__afdSpotify196?.open',
            'C()?.startAuto',
            'C()?.startNext',
            'C()?.loadAny',
            'data-sp-side',
            'application/x-afd208-side'
          )) { if (-not $r208.Contains($m)) { throw "runtime-v208 marker missing: $m" } }
          if ($r208.Contains('paintSpotifyClock')) { throw 'runtime-v208 must not write the Spotify clock' }
          $r207 = Get-Content 'runtime-v207.js' -Raw
          if (-not $r207.Contains("const VERSION='__AFD_VERSION__'")) { throw 'dynamic version runtime missing' }
          $r206 = Get-Content 'runtime-v206.js' -Raw
          foreach ($m in @(
            "h.dataset.afdOwner='206'",
            'afdDeckKey206A',
            'afdDeckKey206B',
            '__afdWin184?.changeTone'
          )) { if (-not $r206.Contains($m)) { throw "runtime-v206 marker missing: $m" } }
          if ($r206.Contains('paintSpotifyClock')) { throw 'runtime-v206 must not write the Spotify clock' }
          $r196 = Get-Content 'runtime-v196.js' -Raw
          if (-not $r196.Contains('client_id:CID()')) { throw 'Spotify login must use saved Client ID' }
          if (-not $r196.Contains('getItems:()=>items.slice()')) { throw 'Spotify result bridge missing' }
          $yt = Get-Content '../inline-youtube-core-v48.js' -Raw
          if (-not $yt.Contains('window.AFDOpenYT=searchNow')) { throw 'YouTube search bridge missing' }
          $sp = Get-Content 'spotify-playback-v85-local.js' -Raw
          if (-not $sp.Contains('function paintTime(deck)')) { throw 'Spotify playback clock owner missing' }
          $pkg = Get-Content 'package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.8') { throw 'package version is not 1.5.8' }
          if ($pkg.main -ne 'main-v208.js') { throw 'package main is not main-v208.js' }
          foreach ($f in @('main-v208.js','runtime-v169.js','runtime-v170.js','runtime-v172.js','runtime-v184.js','runtime-v185.js','runtime-v195.js','runtime-v196.js','runtime-v200.js','runtime-v203.js','runtime-v206.js','runtime-v207.js','runtime-v208.js','spotify-playback-v85-local.js')) { if (!(Test-Path $f)) { throw "$f missing" } }
          Write-Host 'AFD v1.5.8 unified online, playlist, history and Side View markers OK'
      - run: npm install
      - name: Verify audio engines
        shell: pwsh
        run: |
          if (!(Test-Path 'node_modules/signalsmith-stretch/SignalsmithStretch.js')) { throw 'Signalsmith Stretch runtime missing' }
          if (!(Test-Path 'node_modules/ffmpeg-static/ffmpeg.exe')) { throw 'FFmpeg binary missing' }
          if (!(Test-Path 'node_modules/music-tempo')) { throw 'music-tempo Beatroot runtime missing' }
          node -e "const m=require('music-tempo');const MT=m.default||m;if(typeof MT!=='function')throw Error('music-tempo export invalid');console.log('music-tempo Beatroot OK')"
      - run: npm run dist
      - name: Verify packaged v1.5.8 files
        shell: pwsh
        run: |
          $asar = 'dist/win-unpacked/resources/app.asar'
          if (!(Test-Path $asar)) { throw 'app.asar missing from packaged app' }
          $list = & npx --no-install asar list $asar
          if ($LASTEXITCODE -ne 0) { throw 'Unable to list app.asar' }
          foreach ($needle in @('main-v208.js','runtime-v169.js','runtime-v170.js','runtime-v172.js','runtime-v184.js','runtime-v185.js','runtime-v195.js','runtime-v196.js','runtime-v200.js','runtime-v203.js','runtime-v206.js','runtime-v207.js','runtime-v208.js','spotify-playback-v85-local.js','preload.js')) {
            if (-not (($list -join "`n").Contains($needle))) { throw "Packaged app missing $needle" }
          }
          if (!(Test-Path 'dist/AFD-DJ-Windows-Setup-1.5.8-x64.exe')) { throw 'v1.5.8 installer missing' }
          Write-Host 'Packaged AFD v1.5.8 contains unified Online menu, playlists, daily history, Side View controls, local drag recovery and deck key controls'
      - uses: actions/upload-artifact@v4
        with:
          name: AFD-DJ-Windows
          path: |
            afd-dj/windows/dist/*.exe
          if-no-files-found: error
