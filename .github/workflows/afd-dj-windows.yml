name: Build AFD DJ Windows
on:
  workflow_dispatch:
  push:
    branches: [afd-dj-mobile]
    paths:
      - 'afd-dj/**'
      - '.github/workflows/afd-dj-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: afd-dj/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: afd-dj/windows/package.json
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check main-v184.js
          node --check main-v200.js
          node --check preload.js
          node --check runtime-v175.js
          node --check runtime-v184.js
          node --check runtime-v177.js
          node --check runtime-v185.js
          node --check runtime-v194.js
          node --check runtime-v195.js
          node --check runtime-v196.js
          node --check runtime-v200.js
          node --check ../spotify-playback-v85.js
          node --check ../deck-replace-confirm-v158.js
          node --check ../inline-youtube.js
          node --check ../inline-youtube-core-v48.js
          node --check ../layout-mix-final-v138.js
      - name: Verify v200 patch markers
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('main-v184.js','utf8');for(const x of [\"RUNTIME_EJECT_JS=readRuntime('runtime-v175.js');\",\"RUNTIME_LOAD_JS,RUNTIME_EJECT_JS])await w.webContents.executeJavaScript(js,true)\",\"w.loadURL('https://afd-dj.vercel.app/workstation.html?v=186&t='+Date.now());\",\"await session.defaultSession.clearCache().catch(()=>{});\"])if(!s.includes(x))throw Error('v200 patch marker missing: '+x);console.log('v200 patch markers OK')"
          if (!(Test-Path 'runtime-v194.js')) { throw 'runtime-v194 missing' }
          if (!(Test-Path 'runtime-v195.js')) { throw 'runtime-v195 missing' }
          if (!(Test-Path 'runtime-v196.js')) { throw 'runtime-v196 missing' }
          if (!(Test-Path 'runtime-v200.js')) { throw 'runtime-v200 missing' }
      - run: npm install
      - name: Verify audio engines
        shell: pwsh
        run: |
          if (!(Test-Path 'node_modules/signalsmith-stretch/SignalsmithStretch.js')) { throw 'Signalsmith Stretch runtime missing' }
          if (!(Test-Path 'node_modules/ffmpeg-static/ffmpeg.exe')) { throw 'FFmpeg binary missing' }
          if (!(Test-Path 'node_modules/music-tempo')) { throw 'music-tempo Beatroot runtime missing' }
          node -e "const m=require('music-tempo');const MT=m.default||m;if(typeof MT!=='function')throw Error('music-tempo export invalid');console.log('music-tempo Beatroot OK')"
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: AFD-DJ-Windows
          path: |
            afd-dj/windows/dist/*.exe
          if-no-files-found: error