name: Build AFD DJ Windows
on:
  workflow_dispatch:
  push:
    branches: [afd-dj-mobile]
    paths:
      - 'afd-dj/**'
      - '.github/workflows/afd-dj-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: afd-dj/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: afd-dj/windows/package.json
      - name: Prepare local Spotify playback runtime
        shell: pwsh
        run: |
          Copy-Item ../spotify-playback-v85.js ./spotify-playback-v85-local.js -Force
          if (!(Test-Path 'spotify-playback-v85-local.js')) { throw 'Local Spotify playback runtime missing' }
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          foreach ($f in @(
            'main-v184.js','main-v200.js','main-v203.js','main-v205.js','main-v206.js','main-v207.js','main-v208.js','main-v209.js','main-v210.js','main-v211.js','main-v212.js','main-v213.js','main-v214.js','main-v215.js','main-v216.js','main-v217.js','main-v218.js','main-v219.js',
            'preload.js','runtime-v167.js','runtime-v168.js','runtime-v169.js','runtime-v170.js','runtime-v171.js','runtime-v172.js','runtime-v175.js','runtime-v184.js','runtime-v185.js','runtime-v195.js','runtime-v196.js','runtime-v200.js','runtime-v203.js','runtime-v205.js','runtime-v206.js','runtime-v207.js','runtime-v208.js','runtime-v210.js','runtime-v211.js','runtime-v212.js','runtime-v213.js','runtime-v214.js','runtime-v215.js','runtime-v216.js','runtime-v217.js','runtime-v218.js','spotify-playback-v85-local.js','../deck-replace-confirm-v158.js','../inline-youtube.js','../inline-youtube-core-v48.js'
          )) { node --check $f; if ($LASTEXITCODE -ne 0) { throw "Syntax failed: $f" } }
      - name: Verify v1.5.19 YouTube Side double-click Play Mix
        shell: pwsh
        run: |
          $m = Get-Content 'main-v219.js' -Raw
          foreach ($x in @(
            "require('./main-v218.js')",
            "file==='runtime-v215.js'",
            'Reliable YouTube Side View Play/Mix',
            'const end=performance.now()+10000',
            'while(performance.now()<end)',
            "window.AFDYouTubeState?.isPlaying?.(k),650",
            "status('YOUTUBE PLAY • DECK '+k+' • התחיל')",
            "w.setTitle('AFD DJ '+VERSION)"
          )) { if (-not $m.Contains($x)) { throw "main-v219 marker missing: $x" } }

          $r212 = Get-Content 'runtime-v212.js' -Raw
          if (-not $r212.Contains("C()?.playIndex?.(+r.dataset.i,{mix:true})")) { throw 'Side View double-click is not routed to playIndex mix:true' }
          $r206 = Get-Content 'runtime-v206.js' -Raw
          if (-not $r206.Contains('if(it.afdYouTubeItem||it.youtubeItem)return loadYouTube')) { throw 'Auto Mix YouTube load path missing' }
          $r215 = Get-Content 'runtime-v215.js' -Raw
          if (-not $r215.Contains("if(own==='youtube')")) { throw 'YouTube transport owner branch missing' }
          if (-not $r215.Contains("window.AFDYouTubeState?.isPlaying?.(k),6500")) { throw 'v219 YouTube retry patch target missing' }
          $yt = Get-Content '../inline-youtube-core-v48.js' -Raw
          if (-not $yt.Contains('window.AFDYouTubeState=')) { throw 'YouTube player state API missing' }

          $pkg = Get-Content 'package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.19') { throw 'package version is not 1.5.19' }
          if ($pkg.main -ne 'main-v219.js') { throw 'package main is not main-v219.js' }
          foreach ($f in @('main-v219.js','main-v218.js','runtime-v218.js','main-v217.js','runtime-v217.js','main-v215.js','runtime-v215.js','runtime-v212.js','runtime-v206.js','spotify-playback-v85-local.js')) {
            if (!(Test-Path $f)) { throw "$f missing" }
          }
          Write-Host 'AFD v1.5.19 Side View double-click keeps playIndex mix flow and retries YouTube Play until the embedded player is ready'
      - run: npm install
      - name: Verify audio engines
        shell: pwsh
        run: |
          if (!(Test-Path 'node_modules/signalsmith-stretch/SignalsmithStretch.js')) { throw 'Signalsmith Stretch runtime missing' }
          if (!(Test-Path 'node_modules/ffmpeg-static/ffmpeg.exe')) { throw 'FFmpeg binary missing' }
          if (!(Test-Path 'node_modules/music-tempo')) { throw 'music-tempo Beatroot runtime missing' }
          node -e "const m=require('music-tempo');const MT=m.default||m;if(typeof MT!=='function')throw Error('music-tempo export invalid');console.log('music-tempo Beatroot OK')"
      - run: npm run dist
      - name: Verify packaged v1.5.19 files
        shell: pwsh
        run: |
          $asar = 'dist/win-unpacked/resources/app.asar'
          if (!(Test-Path $asar)) { throw 'app.asar missing from packaged app' }
          $list = & npx --no-install asar list $asar
          if ($LASTEXITCODE -ne 0) { throw 'Unable to list app.asar' }
          foreach ($needle in @('main-v219.js','main-v218.js','runtime-v218.js','runtime-v215.js','runtime-v212.js','runtime-v206.js','spotify-playback-v85-local.js','preload.js')) {
            if (-not (($list -join "`n").Contains($needle))) { throw "Packaged app missing $needle" }
          }
          if (!(Test-Path 'dist/AFD-DJ-Windows-Setup-1.5.19-x64.exe')) { throw 'v1.5.19 installer missing' }
          Write-Host 'Packaged AFD v1.5.19 contains reliable YouTube Side View double-click Play/Mix retry'
      - uses: actions/upload-artifact@v4
        with:
          name: AFD-DJ-Windows
          path: |
            afd-dj/windows/dist/*.exe
          if-no-files-found: error
