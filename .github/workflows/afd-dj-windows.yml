name: Build AFD DJ Windows
on:
  workflow_dispatch:
  push:
    branches: [afd-dj-mobile]
    paths:
      - 'afd-dj/**'
      - '.github/workflows/afd-dj-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: afd-dj/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: afd-dj/windows/package.json
      - name: Prepare local Spotify playback runtime
        shell: pwsh
        run: |
          Copy-Item ../spotify-playback-v85.js ./spotify-playback-v85-local.js -Force
          if (!(Test-Path 'spotify-playback-v85-local.js')) { throw 'Local Spotify playback runtime missing' }
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          foreach ($f in @(
            'main-v184.js','main-v200.js','main-v203.js','main-v205.js','main-v206.js','main-v207.js','main-v208.js','main-v209.js','main-v210.js','main-v211.js','main-v212.js','main-v213.js','main-v214.js','main-v215.js','main-v216.js',
            'preload.js','runtime-v167.js','runtime-v168.js','runtime-v169.js','runtime-v170.js','runtime-v171.js','runtime-v172.js','runtime-v175.js','runtime-v184.js','runtime-v185.js','runtime-v195.js','runtime-v196.js','runtime-v200.js','runtime-v203.js','runtime-v205.js','runtime-v206.js','runtime-v207.js','runtime-v208.js','runtime-v210.js','runtime-v211.js','runtime-v212.js','runtime-v213.js','runtime-v214.js','runtime-v215.js','runtime-v216.js','spotify-playback-v85-local.js','../deck-replace-confirm-v158.js','../inline-youtube.js','../inline-youtube-core-v48.js'
          )) { node --check $f; if ($LASTEXITCODE -ne 0) { throw "Syntax failed: $f" } }
      - name: Verify v1.5.16 online browse and drag markers
        shell: pwsh
        run: |
          $m = Get-Content 'main-v216.js' -Raw
          foreach ($x in @(
            "require('./main-v215.js')",
            "file==='runtime-v196.js'",
            "u.searchParams.set('limit','30')",
            "file==='inline-youtube-core-v48.js'",
            "maxResults:'50'",
            "runtime-v216.js",
            "w.setTitle('AFD DJ '+VERSION)"
          )) { if (-not $m.Contains($x)) { throw "main-v216 marker missing: $x" } }

          $r = Get-Content 'runtime-v216.js' -Raw
          foreach ($x in @(
            'window.__afd216Active=true',
            "afdYTView216",
            'function ensureYTTools',
            'GRID',
            'LIST',
            "application/x-afd216-online-json",
            "text/plain",
            "AFD216:",
            'function unpack',
            'function bindInner',
            "#afd212side,#afd208side,#afdQueue170,.sideview",
            'function addSide',
            "window.__afdUnified215?.loadDeck",
            "#afdSP196 [data-d],#afdYTInlineResults [data-d]{display:none!important}",
            'minmax(112px,1fr)',
            'width:82px!important',
            'minmax(132px,1fr)',
            'height:76px!important'
          )) { if (-not $r.Contains($x)) { throw "runtime-v216 marker missing: $x" } }
          if ($r.Contains('paintSpotifyClock')) { throw 'runtime-v216 must not reintroduce Spotify clock ownership' }

          $sp = Get-Content 'runtime-v196.js' -Raw
          if (-not $sp.Contains("u.searchParams.set('type','track');")) { throw 'Spotify search patch target missing' }
          if (-not $sp.Contains('sp196pager')) { throw 'Spotify pager missing' }
          $yt = Get-Content '../inline-youtube-core-v48.js' -Raw
          if (-not $yt.Contains("maxResults:'25'")) { throw 'YouTube result-count patch target missing' }
          if (-not $yt.Contains('window.AFDYouTubeState=')) { throw 'YouTube state API missing' }
          $r215 = Get-Content 'runtime-v215.js' -Raw
          if (-not $r215.Contains('data-side215')) { throw 'Online Side View action missing from v215' }
          if (-not $r215.Contains('window.__afdUnified215=api')) { throw 'v215 unified loader missing' }

          $pkg = Get-Content 'package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.16') { throw 'package version is not 1.5.16' }
          if ($pkg.main -ne 'main-v216.js') { throw 'package main is not main-v216.js' }
          foreach ($f in @('main-v216.js','runtime-v216.js','main-v215.js','runtime-v215.js','main-v212.js','runtime-v212.js','runtime-v196.js','runtime-v206.js','spotify-playback-v85-local.js')) {
            if (!(Test-Path $f)) { throw "$f missing" }
          }
          Write-Host 'AFD v1.5.16 Spotify 30/page, YouTube 50/grid/list, no A/B result buttons and robust cross-frame Side View drag markers OK'
      - run: npm install
      - name: Verify audio engines
        shell: pwsh
        run: |
          if (!(Test-Path 'node_modules/signalsmith-stretch/SignalsmithStretch.js')) { throw 'Signalsmith Stretch runtime missing' }
          if (!(Test-Path 'node_modules/ffmpeg-static/ffmpeg.exe')) { throw 'FFmpeg binary missing' }
          if (!(Test-Path 'node_modules/music-tempo')) { throw 'music-tempo Beatroot runtime missing' }
          node -e "const m=require('music-tempo');const MT=m.default||m;if(typeof MT!=='function')throw Error('music-tempo export invalid');console.log('music-tempo Beatroot OK')"
      - run: npm run dist
      - name: Verify packaged v1.5.16 files
        shell: pwsh
        run: |
          $asar = 'dist/win-unpacked/resources/app.asar'
          if (!(Test-Path $asar)) { throw 'app.asar missing from packaged app' }
          $list = & npx --no-install asar list $asar
          if ($LASTEXITCODE -ne 0) { throw 'Unable to list app.asar' }
          foreach ($needle in @('main-v216.js','runtime-v216.js','main-v215.js','runtime-v215.js','runtime-v196.js','runtime-v206.js','spotify-playback-v85-local.js','preload.js')) {
            if (-not (($list -join "`n").Contains($needle))) { throw "Packaged app missing $needle" }
          }
          if (!(Test-Path 'dist/AFD-DJ-Windows-Setup-1.5.16-x64.exe')) { throw 'v1.5.16 installer missing' }
          Write-Host 'Packaged AFD v1.5.16 contains expanded Spotify paging, full YouTube grid/list and robust Online-to-Side drag'
      - uses: actions/upload-artifact@v4
        with:
          name: AFD-DJ-Windows
          path: |
            afd-dj/windows/dist/*.exe
          if-no-files-found: error
