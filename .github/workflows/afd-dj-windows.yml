name: Build AFD DJ Windows
on:
  workflow_dispatch:
  push:
    branches: [afd-dj-mobile]
    paths:
      - 'afd-dj/**'
      - '.github/workflows/afd-dj-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: afd-dj/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: afd-dj/windows/package.json
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check main-v184.js
          node --check preload.js
          node --check runtime-v175.js
          node --check runtime-v184.js
          node --check runtime-v177.js
          node --check runtime-v185.js
          node --check ../spotify-playback-v84.js
          node --check ../deck-replace-confirm-v158.js
          node --check ../inline-youtube.js
          node --check ../inline-youtube-core-v48.js
          node --check ../layout-mix-final-v138.js
      - run: npm install
      - name: Verify Signalsmith Stretch
        shell: pwsh
        run: |
          if (!(Test-Path 'node_modules/signalsmith-stretch/SignalsmithStretch.js')) { throw 'Signalsmith Stretch runtime missing' }
          if (!(Test-Path 'node_modules/ffmpeg-static/ffmpeg.exe')) { throw 'FFmpeg binary missing' }
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: AFD-DJ-Windows
          path: |
            afd-dj/windows/dist/*.exe
          if-no-files-found: error
