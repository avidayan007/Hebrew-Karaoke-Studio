name: Build AFD DJ Windows
on:
  workflow_dispatch:
  push:
    branches: [afd-dj-mobile]
    paths:
      - 'afd-dj/**'
      - '.github/workflows/afd-dj-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: afd-dj/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: afd-dj/windows/package.json
      - name: Prepare local Spotify playback runtime
        shell: pwsh
        run: |
          Copy-Item ../spotify-playback-v85.js ./spotify-playback-v85-local.js -Force
          if (!(Test-Path 'spotify-playback-v85-local.js')) { throw 'Local Spotify playback runtime missing' }
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check main-v184.js
          node --check main-v200.js
          node --check main-v203.js
          node --check main-v205.js
          node --check main-v206.js
          node --check main-v207.js
          node --check main-v208.js
          node --check main-v209.js
          node --check main-v210.js
          node --check main-v211.js
          node --check main-v212.js
          node --check main-v213.js
          node --check main-v214.js
          node --check preload.js
          node --check runtime-v167.js
          node --check runtime-v168.js
          node --check runtime-v169.js
          node --check runtime-v170.js
          node --check runtime-v171.js
          node --check runtime-v172.js
          node --check runtime-v175.js
          node --check runtime-v184.js
          node --check runtime-v185.js
          node --check runtime-v195.js
          node --check runtime-v196.js
          node --check runtime-v200.js
          node --check runtime-v203.js
          node --check runtime-v205.js
          node --check runtime-v206.js
          node --check runtime-v207.js
          node --check runtime-v208.js
          node --check runtime-v210.js
          node --check runtime-v211.js
          node --check runtime-v212.js
          node --check runtime-v213.js
          node --check runtime-v214.js
          node --check spotify-playback-v85-local.js
          node --check ../deck-replace-confirm-v158.js
          node --check ../inline-youtube.js
          node --check ../inline-youtube-core-v48.js
      - name: Verify v1.5.14 playlist replace YouTube drag Save and transport UI markers
        shell: pwsh
        run: |
          $m = Get-Content 'main-v214.js' -Raw
          foreach ($x in @(
            "require('./main-v213.js')",
            "file==='runtime-v212.js'",
            'window.__afd214?.saveSide',
            'window.__afdUnified214?.loadDeck',
            'window.__afdUnified214?.loadYouTube',
            "file==='runtime-v213.js'",
            "ipcMain.removeHandler('afd-playlist-save')",
            "ipcMain.handle('afd-playlist-save',save214)",
            'version:4',
            "runtime-v214.js",
            "w.setTitle('AFD DJ '+VERSION)"
          )) { if (-not $m.Contains($x)) { throw "main-v214 marker missing: $x" } }

          $r = Get-Content 'runtime-v214.js' -Raw
          foreach ($x in @(
            'window.__afd214Active=true',
            'async function hardClear',
            'AFDWindowsLoadState?.cancel?.(k)',
            'async function replaceDeck',
            'async function replaceYouTube',
            'async function replaceLocal',
            "#afdYTInlineResults .afdYTListRow[data-i]",
            'application/x-afd214-youtube',
            "w.addEventListener('drop'",
            'async function saveSide',
            'window.afdDesktopMedia?.savePlaylist',
            "key='afdSavedPlaylists212'",
            'height:54px!important',
            'margin-top:6px!important',
            'window.__afdUnified214=api',
            'window.__afdUnified213=api'
          )) { if (-not $r.Contains($x)) { throw "runtime-v214 marker missing: $x" } }
          if ($r.Contains('paintSpotifyClock')) { throw 'runtime-v214 must not reintroduce legacy Spotify clock' }

          $r212 = Get-Content 'runtime-v212.js' -Raw
          foreach ($x in @(
            "else if(x==='save')saveSide();",
            'if(b)loadDeck(b.dataset.d,x);',
            'if(x)loadDeck(freeDeck(),x)',
            "if(deck)loadDeck(deck.classList.contains('deckA')?'A':'B',dragItem);",
            'loadDeck(b.dataset.d,spQueueItem(it));',
            'loadDeck(b.dataset.d,ytQueueItem(it));'
          )) { if (-not $r212.Contains($x)) { throw "runtime-v212 v214 patch target missing: $x" } }

          $r213 = Get-Content 'runtime-v213.js' -Raw
          foreach ($x in @('loadYouTube(y.dataset.d,it)','loadSpotify(s.dataset.d,it)')) { if (-not $r213.Contains($x)) { throw "runtime-v213 v214 patch target missing: $x" } }

          $pkg = Get-Content 'package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.14') { throw 'package version is not 1.5.14' }
          if ($pkg.main -ne 'main-v214.js') { throw 'package main is not main-v214.js' }
          foreach ($f in @('main-v214.js','runtime-v214.js','main-v213.js','runtime-v213.js','main-v212.js','runtime-v212.js','runtime-v184.js','runtime-v185.js','runtime-v206.js','spotify-playback-v85-local.js')) {
            if (!(Test-Path $f)) { throw "$f missing" }
          }
          Write-Host 'AFD v1.5.14 Playlist occupied-deck replace, YouTube drag, Save and transport button sizing markers OK'
      - run: npm install
      - name: Verify audio engines
        shell: pwsh
        run: |
          if (!(Test-Path 'node_modules/signalsmith-stretch/SignalsmithStretch.js')) { throw 'Signalsmith Stretch runtime missing' }
          if (!(Test-Path 'node_modules/ffmpeg-static/ffmpeg.exe')) { throw 'FFmpeg binary missing' }
          if (!(Test-Path 'node_modules/music-tempo')) { throw 'music-tempo Beatroot runtime missing' }
          node -e "const m=require('music-tempo');const MT=m.default||m;if(typeof MT!=='function')throw Error('music-tempo export invalid');console.log('music-tempo Beatroot OK')"
      - run: npm run dist
      - name: Verify packaged v1.5.14 files
        shell: pwsh
        run: |
          $asar = 'dist/win-unpacked/resources/app.asar'
          if (!(Test-Path $asar)) { throw 'app.asar missing from packaged app' }
          $list = & npx --no-install asar list $asar
          if ($LASTEXITCODE -ne 0) { throw 'Unable to list app.asar' }
          foreach ($needle in @('main-v214.js','runtime-v214.js','main-v213.js','runtime-v213.js','main-v212.js','runtime-v212.js','runtime-v184.js','runtime-v185.js','runtime-v206.js','spotify-playback-v85-local.js','preload.js')) {
            if (-not (($list -join "`n").Contains($needle))) { throw "Packaged app missing $needle" }
          }
          if (!(Test-Path 'dist/AFD-DJ-Windows-Setup-1.5.14-x64.exe')) { throw 'v1.5.14 installer missing' }
          Write-Host 'Packaged AFD v1.5.14 contains reliable YouTube drag, occupied Deck replacement, Playlist Save repair and larger transport controls'
      - uses: actions/upload-artifact@v4
        with:
          name: AFD-DJ-Windows
          path: |
            afd-dj/windows/dist/*.exe
          if-no-files-found: error
