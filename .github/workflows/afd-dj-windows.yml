name: Build AFD DJ Windows
on:
  workflow_dispatch:
  push:
    branches: [afd-dj-mobile]
    paths:
      - 'afd-dj/**'
      - '.github/workflows/afd-dj-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: afd-dj/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: afd-dj/windows/package.json
      - name: Prepare local Spotify playback runtime
        shell: pwsh
        run: |
          Copy-Item ../spotify-playback-v85.js ./spotify-playback-v85-local.js -Force
          if (!(Test-Path 'spotify-playback-v85-local.js')) { throw 'Local Spotify playback runtime missing' }
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check main-v184.js
          node --check main-v200.js
          node --check main-v203.js
          node --check main-v205.js
          node --check main-v206.js
          node --check main-v207.js
          node --check main-v208.js
          node --check main-v209.js
          node --check main-v210.js
          node --check main-v211.js
          node --check main-v212.js
          node --check main-v213.js
          node --check preload.js
          node --check runtime-v167.js
          node --check runtime-v168.js
          node --check runtime-v169.js
          node --check runtime-v170.js
          node --check runtime-v171.js
          node --check runtime-v172.js
          node --check runtime-v175.js
          node --check runtime-v184.js
          node --check runtime-v185.js
          node --check runtime-v195.js
          node --check runtime-v196.js
          node --check runtime-v200.js
          node --check runtime-v203.js
          node --check runtime-v205.js
          node --check runtime-v206.js
          node --check runtime-v207.js
          node --check runtime-v208.js
          node --check runtime-v210.js
          node --check runtime-v211.js
          node --check runtime-v212.js
          node --check runtime-v213.js
          node --check spotify-playback-v85-local.js
          node --check ../deck-replace-confirm-v158.js
          node --check ../inline-youtube.js
          node --check ../inline-youtube-core-v48.js
      - name: Verify v1.5.13 YouTube BPM pitch KEY jump and Save markers
        shell: pwsh
        run: |
          $m = Get-Content 'main-v213.js' -Raw
          foreach ($x in @(
            "require('./main-v212.js')",
            "file==='runtime-v212.js'",
            "window.__afd213?.saveSide",
            "file==='runtime-v184.js'",
            'window.__afdUnified213?.getOwner',
            "file==='inline-youtube-core-v48.js'",
            'window.__afd213Active?null:captureOther(deck)',
            "ipcMain.removeHandler('afd-playlist-save')",
            "ipcMain.handle('afd-playlist-save',save213)",
            'version:3',
            "runtime-v213.js",
            "w.setTitle('AFD DJ '+VERSION)"
          )) { if (-not $m.Contains($x)) { throw "main-v213 marker missing: $x" } }

          $r = Get-Content 'runtime-v213.js' -Raw
          foreach ($x in @(
            'window.__afd213Active=true',
            'async function doYouTube',
            'async function clearSpotify',
            'function clearYouTube',
            'function clearLocal',
            'function loadDeck',
            'function loadSpotify',
            'function loadYouTube',
            'function loadLocal',
            "#afdYTInlineResults [data-d]",
            "#afdSP196 [data-d]",
            'function scheduleBpm',
            'analyzeBpmPath',
            'analyzeBpm',
            "e.id='bpm'+k",
            'function setPitchUI',
            'v.preservesPitch=true',
            'v.webkitPreservesPitch=true',
            'function keyChange',
            'window.__afdWin184',
            'api.setTone',
            'async function saveSide',
            "bridge?.savePlaylistV213||bridge?.savePlaylist",
            'window.__afdUnified213=api',
            'window.__afdUnified212=api',
            'window.__afdUnified211=api'
          )) { if (-not $r.Contains($x)) { throw "runtime-v213 marker missing: $x" } }
          if ($r.Contains('paintSpotifyClock')) { throw 'runtime-v213 must not reintroduce legacy Spotify clock' }

          $r212 = Get-Content 'runtime-v212.js' -Raw
          if (-not $r212.Contains("else if(x==='save')saveSide();")) { throw 'runtime-v212 Save delegation target changed' }
          $r184 = Get-Content 'runtime-v184.js' -Raw
          if (-not $r184.Contains("function online(k){return!!(doc?.getElementById('ytDeck'+k)||doc?.getElementById('afdSP105Deck'+k))}")) { throw 'runtime-v184 online target changed' }
          $yt = Get-Content '../inline-youtube-core-v48.js' -Raw
          if (-not $yt.Contains('const other=captureOther(deck);clearYT(deck);')) { throw 'YouTube other-deck restore target changed' }
          if (-not $yt.Contains('window.AFDYouTubeState={isPlaying:deck=>')) { throw 'YouTube direct state API target missing' }
          $sp = Get-Content 'spotify-playback-v85-local.js' -Raw
          if (-not $sp.Contains('function paintTime(deck)')) { throw 'Spotify clock source missing' }
          $pre = Get-Content 'preload.js' -Raw
          if (-not $pre.Contains('analyzeBpmPath:meta=>analyzePath')) { throw 'BPM preload bridge missing' }
          if (-not $pre.Contains("savePlaylist:payload=>ipcRenderer.invoke('afd-playlist-save',payload)")) { throw 'Playlist preload bridge missing' }

          $pkg = Get-Content 'package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.13') { throw 'package version is not 1.5.13' }
          if ($pkg.main -ne 'main-v213.js') { throw 'package main is not main-v213.js' }
          foreach ($f in @('main-v213.js','runtime-v213.js','main-v212.js','runtime-v212.js','main-v210.js','runtime-v184.js','runtime-v185.js','runtime-v196.js','runtime-v206.js','spotify-playback-v85-local.js')) {
            if (!(Test-Path $f)) { throw "$f missing" }
          }
          Write-Host 'AFD v1.5.13 YouTube source replacement, dynamic BPM, precise pitch, HQ KEY, no-other-deck restore and Save markers OK'
      - run: npm install
      - name: Verify audio engines
        shell: pwsh
        run: |
          if (!(Test-Path 'node_modules/signalsmith-stretch/SignalsmithStretch.js')) { throw 'Signalsmith Stretch runtime missing' }
          if (!(Test-Path 'node_modules/ffmpeg-static/ffmpeg.exe')) { throw 'FFmpeg binary missing' }
          if (!(Test-Path 'node_modules/music-tempo')) { throw 'music-tempo Beatroot runtime missing' }
          node -e "const m=require('music-tempo');const MT=m.default||m;if(typeof MT!=='function')throw Error('music-tempo export invalid');console.log('music-tempo Beatroot OK')"
      - run: npm run dist
      - name: Verify packaged v1.5.13 files
        shell: pwsh
        run: |
          $asar = 'dist/win-unpacked/resources/app.asar'
          if (!(Test-Path $asar)) { throw 'app.asar missing from packaged app' }
          $list = & npx --no-install asar list $asar
          if ($LASTEXITCODE -ne 0) { throw 'Unable to list app.asar' }
          foreach ($needle in @('main-v213.js','runtime-v213.js','main-v212.js','runtime-v212.js','main-v210.js','runtime-v184.js','runtime-v185.js','runtime-v196.js','runtime-v206.js','spotify-playback-v85-local.js','preload.js')) {
            if (-not (($list -join "`n").Contains($needle))) { throw "Packaged app missing $needle" }
          }
          if (!(Test-Path 'dist/AFD-DJ-Windows-Setup-1.5.13-x64.exe')) { throw 'v1.5.13 installer missing' }
          Write-Host 'Packaged AFD v1.5.13 contains YouTube deck replacement repair, BPM/pitch/key controls, Save dialog repair and no-other-deck restore loading'
      - uses: actions/upload-artifact@v4
        with:
          name: AFD-DJ-Windows
          path: |
            afd-dj/windows/dist/*.exe
          if-no-files-found: error
