name: Build AFD DJ Windows
on:
  workflow_dispatch:
  push:
    branches: [afd-dj-mobile]
    paths:
      - 'afd-dj/**'
      - '.github/workflows/afd-dj-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: afd-dj/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: afd-dj/windows/package.json
      - name: Prepare local Spotify playback runtime
        shell: pwsh
        run: |
          Copy-Item ../spotify-playback-v85.js ./spotify-playback-v85-local.js -Force
          if (!(Test-Path 'spotify-playback-v85-local.js')) { throw 'Local Spotify playback runtime missing' }
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check main-v184.js
          node --check main-v200.js
          node --check main-v203.js
          node --check main-v205.js
          node --check main-v206.js
          node --check main-v207.js
          node --check main-v208.js
          node --check main-v209.js
          node --check main-v210.js
          node --check preload.js
          node --check runtime-v167.js
          node --check runtime-v168.js
          node --check runtime-v169.js
          node --check runtime-v170.js
          node --check runtime-v171.js
          node --check runtime-v172.js
          node --check runtime-v175.js
          node --check runtime-v184.js
          node --check runtime-v185.js
          node --check runtime-v195.js
          node --check runtime-v196.js
          node --check runtime-v200.js
          node --check runtime-v203.js
          node --check runtime-v205.js
          node --check runtime-v206.js
          node --check runtime-v207.js
          node --check runtime-v208.js
          node --check runtime-v210.js
          node --check spotify-playback-v85-local.js
          node --check ../deck-replace-confirm-v158.js
          node --check ../inline-youtube.js
          node --check ../inline-youtube-core-v48.js
          node --check ../layout-mix-final-v138.js
          node --check ../automix-order-v159.js
      - name: Verify v1.5.10 source switch playlist Side View KEY and CPU fixes
        shell: pwsh
        run: |
          $m210 = Get-Content 'main-v210.js' -Raw
          foreach ($m in @(
            "require('./main-v209.js')",
            "file==='spotify-playback-v85-local.js'",
            'Spotify safe source clear',
            'KEY metadata race',
            'core queue mutation API',
            "setInterval(refresh,1000)",
            'PRIORITY_BELOW_NORMAL',
            "a[i+1]='2'",
            "ipcMain.removeHandler('afd-playlist-save')",
            'version:2',
            "runtime-v210.js",
            "w.setTitle('AFD DJ '+VERSION)"
          )) { if (-not $m210.Contains($m)) { throw "main-v210 marker missing: $m" } }
          $r210 = Get-Content 'runtime-v210.js' -Raw
          foreach ($m in @(
            'window.__afd210',
            "P2='afdSavedPlaylists210'",
            'async function saveManual',
            'async function savedItems',
            'function prepareSpotify',
            'function prepareYouTube',
            'function paintClock',
            'function youtubeApi',
            '/\\.wmp$/i',
            'window.__afdWin184?.setTone',
            '#afd208side .srow [data-load]',
            '#afd208side .srow [data-play]',
            "w.addEventListener('dblclick'",
            'C()?.playIndex?.(i,{mix})',
            'C()?.moveQueue?.',
            'C()?.removeQueue?.'
          )) { if (-not $r210.Contains($m)) { throw "runtime-v210 marker missing: $m" } }
          if ($r210.Contains('paintSpotifyClock')) { throw 'runtime-v210 must not implement a competing Spotify clock' }
          $sp = Get-Content 'spotify-playback-v85-local.js' -Raw
          if (-not $sp.Contains("function clearDeck(deck){loaded[deck]=null")) { throw 'Spotify clear patch target changed' }
          if (-not $sp.Contains('function paintTime(deck)')) { throw 'Spotify native clock owner missing' }
          $k = Get-Content 'runtime-v184.js' -Raw
          if (-not $k.Contains("v.addEventListener('loadedmetadata',()=>resetDeckProcess(k))")) { throw 'KEY metadata patch target changed' }
          if (-not $k.Contains('function changeTone(k,d){setTone(k,key[k]+d)}')) { throw 'KEY changeTone patch target changed' }
          $c = Get-Content 'runtime-v206.js' -Raw
          if (-not $c.Contains('window.__afdCore206={refresh,addQueue,renderQueue')) { throw 'Core API patch target changed' }
          if (-not $c.Contains('setInterval(()=>{refresh();autoTick()},420)')) { throw 'Core interval patch target changed' }
          $u = Get-Content 'runtime-v208.js' -Raw
          if (-not $u.Contains("setInterval(()=>{refresh();tick()},350)")) { throw 'Unified interval patch target changed' }
          $pkg = Get-Content 'package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.10') { throw 'package version is not 1.5.10' }
          if ($pkg.main -ne 'main-v210.js') { throw 'package main is not main-v210.js' }
          foreach ($f in @('main-v210.js','runtime-v210.js','main-v209.js','runtime-v169.js','runtime-v170.js','runtime-v172.js','runtime-v184.js','runtime-v185.js','runtime-v195.js','runtime-v196.js','runtime-v200.js','runtime-v203.js','runtime-v206.js','runtime-v207.js','runtime-v208.js','spotify-playback-v85-local.js')) { if (!(Test-Path $f)) { throw "$f missing" } }
          Write-Host 'AFD v1.5.10 deck source switching, manual playlists, Side View double-click mix, KEY and CPU markers OK'
      - run: npm install
      - name: Verify audio engines
        shell: pwsh
        run: |
          if (!(Test-Path 'node_modules/signalsmith-stretch/SignalsmithStretch.js')) { throw 'Signalsmith Stretch runtime missing' }
          if (!(Test-Path 'node_modules/ffmpeg-static/ffmpeg.exe')) { throw 'FFmpeg binary missing' }
          if (!(Test-Path 'node_modules/music-tempo')) { throw 'music-tempo Beatroot runtime missing' }
          node -e "const m=require('music-tempo');const MT=m.default||m;if(typeof MT!=='function')throw Error('music-tempo export invalid');console.log('music-tempo Beatroot OK')"
      - run: npm run dist
      - name: Verify packaged v1.5.10 files
        shell: pwsh
        run: |
          $asar = 'dist/win-unpacked/resources/app.asar'
          if (!(Test-Path $asar)) { throw 'app.asar missing from packaged app' }
          $list = & npx --no-install asar list $asar
          if ($LASTEXITCODE -ne 0) { throw 'Unable to list app.asar' }
          foreach ($needle in @('main-v210.js','runtime-v210.js','main-v209.js','runtime-v169.js','runtime-v170.js','runtime-v172.js','runtime-v184.js','runtime-v185.js','runtime-v195.js','runtime-v196.js','runtime-v200.js','runtime-v203.js','runtime-v206.js','runtime-v207.js','runtime-v208.js','spotify-playback-v85-local.js','preload.js')) {
            if (-not (($list -join "`n").Contains($needle))) { throw "Packaged app missing $needle" }
          }
          if (!(Test-Path 'dist/AFD-DJ-Windows-Setup-1.5.10-x64.exe')) { throw 'v1.5.10 installer missing' }
          Write-Host 'Packaged AFD v1.5.10 contains source-switch deck repair, online clocks, manual playlist Save, Side View double-click mix, WMP/WMV bridge, HQ KEY repair and lower-priority FFmpeg'
      - uses: actions/upload-artifact@v4
        with:
          name: AFD-DJ-Windows
          path: |
            afd-dj/windows/dist/*.exe
          if-no-files-found: error
