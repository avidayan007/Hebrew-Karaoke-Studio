name: Build AFD DJ Windows
on:
  workflow_dispatch:
  push:
    branches: [afd-dj-mobile]
    paths:
      - 'afd-dj/**'
      - '.github/workflows/afd-dj-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: afd-dj/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: afd-dj/windows/package.json
      - name: Prepare local Spotify playback runtime
        shell: pwsh
        run: |
          Copy-Item ../spotify-playback-v85.js ./spotify-playback-v85-local.js -Force
          if (!(Test-Path 'spotify-playback-v85-local.js')) { throw 'Local Spotify playback runtime missing' }
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          foreach ($f in @(
            'main-v184.js','main-v200.js','main-v203.js','main-v205.js','main-v206.js','main-v207.js','main-v208.js','main-v209.js','main-v210.js','main-v211.js','main-v212.js','main-v213.js','main-v214.js','main-v215.js','main-v216.js','main-v217.js',
            'preload.js','runtime-v167.js','runtime-v168.js','runtime-v169.js','runtime-v170.js','runtime-v171.js','runtime-v172.js','runtime-v175.js','runtime-v184.js','runtime-v185.js','runtime-v195.js','runtime-v196.js','runtime-v200.js','runtime-v203.js','runtime-v205.js','runtime-v206.js','runtime-v207.js','runtime-v208.js','runtime-v210.js','runtime-v211.js','runtime-v212.js','runtime-v213.js','runtime-v214.js','runtime-v215.js','runtime-v216.js','runtime-v217.js','spotify-playback-v85-local.js','../deck-replace-confirm-v158.js','../inline-youtube.js','../inline-youtube-core-v48.js'
          )) { node --check $f; if ($LASTEXITCODE -ne 0) { throw "Syntax failed: $f" } }
      - name: Verify v1.5.17 YouTube Side View and Spotify SIDE-only markers
        shell: pwsh
        run: |
          $m = Get-Content 'main-v217.js' -Raw
          foreach ($x in @(
            "require('./main-v216.js')",
            "file==='runtime-v196.js'",
            'data-side217="spotify"',
            "file==='inline-youtube-core-v48.js'",
            'data-side217="youtube"',
            'getItems:()=>lastItems.slice()',
            'isLoaded:deck=>!!yt[deck]',
            'runtime-v217.js',
            "w.setTitle('AFD DJ '+VERSION)"
          )) { if (-not $m.Contains($x)) { throw "main-v217 marker missing: $x" } }

          $r = Get-Content 'runtime-v217.js' -Raw
          foreach ($x in @(
            'window.__afd217Active=true',
            'function rowData',
            'window.AFDYouTubeState?.getItem?.(n)',
            'function addSide',
            'core.addQueue(x)',
            'function normalizeButtons',
            "row.querySelectorAll('[data-d]').forEach(b=>b.remove())",
            "b.textContent='SIDE +'",
            'application/x-afd217-online-json',
            'AFD217:',
            'function bindInner',
            '#afd212side,#afd208side,#afdQueue170,.sideview',
            "window.__afdUnified215?.loadDeck"
          )) { if (-not $r.Contains($x)) { throw "runtime-v217 marker missing: $x" } }
          if ($r.Contains('paintSpotifyClock')) { throw 'runtime-v217 must not own Spotify clock' }

          $sp = Get-Content 'runtime-v196.js' -Raw
          if (-not $sp.Contains('<div class="sp196acts"><button data-d="A">LOAD A</button><button data-d="B">LOAD B</button></div>')) { throw 'Spotify card A/B patch target missing' }
          if (-not $sp.Contains('<button data-d="A">A</button><button data-d="B">B</button></div>')) { throw 'Spotify list A/B patch target missing' }
          $yt = Get-Content '../inline-youtube-core-v48.js' -Raw
          if (-not $yt.Contains('grid-template-columns:58px 1fr 48px 48px')) { throw 'YouTube A/B grid patch target missing' }
          if (-not $yt.Contains('</div><button data-d="A">A</button><button data-d="B">B</button></div>')) { throw 'YouTube A/B button patch target missing' }
          if (-not $yt.Contains('window.AFDYouTubeState={isPlaying:deck=>!!yt[deck]?.playing,clear:clearYT,load,applyCross,getTime:')) { throw 'YouTube state API patch target missing' }

          $pkg = Get-Content 'package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.17') { throw 'package version is not 1.5.17' }
          if ($pkg.main -ne 'main-v217.js') { throw 'package main is not main-v217.js' }
          foreach ($f in @('main-v217.js','runtime-v217.js','main-v216.js','runtime-v216.js','main-v215.js','runtime-v215.js','runtime-v196.js','runtime-v206.js','spotify-playback-v85-local.js')) {
            if (!(Test-Path $f)) { throw "$f missing" }
          }
          Write-Host 'AFD v1.5.17 YouTube exposes result objects to SIDE, cross-frame drag is serialized, and Spotify result buttons are SIDE-only'
      - run: npm install
      - name: Verify audio engines
        shell: pwsh
        run: |
          if (!(Test-Path 'node_modules/signalsmith-stretch/SignalsmithStretch.js')) { throw 'Signalsmith Stretch runtime missing' }
          if (!(Test-Path 'node_modules/ffmpeg-static/ffmpeg.exe')) { throw 'FFmpeg binary missing' }
          if (!(Test-Path 'node_modules/music-tempo')) { throw 'music-tempo Beatroot runtime missing' }
          node -e "const m=require('music-tempo');const MT=m.default||m;if(typeof MT!=='function')throw Error('music-tempo export invalid');console.log('music-tempo Beatroot OK')"
      - run: npm run dist
      - name: Verify packaged v1.5.17 files
        shell: pwsh
        run: |
          $asar = 'dist/win-unpacked/resources/app.asar'
          if (!(Test-Path $asar)) { throw 'app.asar missing from packaged app' }
          $list = & npx --no-install asar list $asar
          if ($LASTEXITCODE -ne 0) { throw 'Unable to list app.asar' }
          foreach ($needle in @('main-v217.js','runtime-v217.js','main-v216.js','runtime-v216.js','main-v215.js','runtime-v215.js','runtime-v196.js','runtime-v206.js','spotify-playback-v85-local.js','preload.js')) {
            if (-not (($list -join "`n").Contains($needle))) { throw "Packaged app missing $needle" }
          }
          if (!(Test-Path 'dist/AFD-DJ-Windows-Setup-1.5.17-x64.exe')) { throw 'v1.5.17 installer missing' }
          Write-Host 'Packaged AFD v1.5.17 contains working YouTube SIDE +/drag bridge and Spotify SIDE-only search controls'
      - uses: actions/upload-artifact@v4
        with:
          name: AFD-DJ-Windows
          path: |
            afd-dj/windows/dist/*.exe
          if-no-files-found: error
