name: Renderer Self Test
on:
  push:
    branches: [main]
    paths:
      - 'renderer-selftest.html'
      - 'index.html'
      - 'patch-v30.js'
      - 'patch-v146.js'
      - 'patch-v147.js'
      - 'patch-v148.js'
      - 'patch-v149.js'
      - 'patch-v150.js'
      - 'patch-v151.js'
      - 'patch-v152.js'
      - 'patch-v153.js'
      - 'version.json'
      - 'sw.js'
      - 'vendor/ffmpeg/**'
      - '.github/workflows/renderer-selftest.yml'
  workflow_dispatch:
jobs:
  webkit-render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify v1.153 real iPhone renderer wiring
        run: |
          node --check patch-v30.js
          node --check patch-v152.js
          node --check patch-v153.js
          node --check sw.js
          node - <<'NODE'
          const fs=require('fs');
          const loader=fs.readFileSync('patch-v30.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const p=fs.readFileSync('patch-v153.js','utf8');
          const index=fs.readFileSync('index.html','utf8');
          const version=JSON.parse(fs.readFileSync('version.json','utf8'));
          const selftest=fs.readFileSync('renderer-selftest.html','utf8');
          if(!loader.includes('__hksLoaderVersion=153')||!loader.includes('151,152,153')||!loader.includes('__hksStartupMs153'))throw Error('v153 loader wiring missing');
          if(version.version!==153)throw Error('version.json is not 153');
          if(!sw.includes("CACHE='hks-v153'")||!sw.includes("patch-v153.js?v=153"))throw Error('v153 service worker missing');
          if(!index.includes('aspect-ratio:16/9')||!index.includes('patch-v30.js?v=153')||!index.includes('Web v1.153 — טוען'))throw Error('v153 app shell missing');
          for(const marker of ['__hksMobilePreviewParity153','makeOverlayBlob153','buildSlides153','linesPerScreen()','__hksLastMobileOverlay153','מרנדר MP4 בדיוק לפי התצוגה החיה'])if(!p.includes(marker))throw Error('v153 mobile parity marker missing: '+marker);
          if(!selftest.includes('register-service-worker-v153')||!selftest.includes('render-mp4-720p-aac320')||!selftest.includes('render-wmv-720p-pcm-s16le-48k-stereo'))throw Error('v153 renderer self-test wiring missing');
          console.log('v1.153 wiring OK');
          NODE
      - name: Install Playwright WebKit
        run: |
          npm init -y
          npm i playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve app
        run: |
          python3 -m http.server 8080 >/tmp/server.log 2>&1 &
          sleep 2
      - name: Verify actual iPhone Canvas overlay matches live preview proportions
        run: |
          node <<'NODE'
          const { webkit } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const page=await browser.newPage({viewport:{width:430,height:932},userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1'});
            page.on('pageerror',e=>console.error('PAGEERROR:',e.message));
            await page.goto('http://127.0.0.1:8080/index.html?hksUpdate=152&_=123',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelector('.version')?.textContent==='Web v1.153'&&window.__hksRenderMobile153&&window.__hksPreviewParity152Api,null,{timeout:30000});
            const result=await page.evaluate(async()=>{
              const preview=document.getElementById('preview'),ly=document.getElementById('lyricsPreview'),bl=preview.querySelector('.brandL'),br=preview.querySelector('.brandR');
              document.getElementById('lyricsText').value='שורה אחת\nשורה שתיים\nשורה שלוש\nשורה ארבע';
              document.querySelector('#hksLinesPerScreen99 button[data-lines="4"]')?.click();
              prepare();words.forEach((w,i)=>w.time=.5+i*.35);current=words.length;try{renderWords();updateSyncPreview()}catch(_){}
              ly.style.setProperty('font-size','30px','important');bl.style.setProperty('font-size','17px','important');br.style.setProperty('font-size','17px','important');
              const ti=document.getElementById('hksSongTitleText');if(ti)ti.style.setProperty('font-size','28px','important');
              const titleInput=document.getElementById('hksSongTitleInput');if(titleInput){titleInput.value='שיר בדיקה';titleInput.dispatchEvent(new Event('input',{bubbles:true}));titleInput.dispatchEvent(new Event('change',{bubbles:true}))}
              await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
              const api=window.__hksRenderMobile153,s=api.capture();
              const slides=api.buildSlides(8),lyricsSlide=slides.find(x=>x.kind==='lyrics');
              const blob=await api.makeOverlayBlob(lyricsSlide,{width:1280,height:720,fps:30});
              const bm=await createImageBitmap(blob),actual=window.__hksLastMobileOverlay153;
              return{version:document.querySelector('.version')?.textContent,ratio:preview.getBoundingClientRect().width/preview.getBoundingClientRect().height,linesPerScreen:api.linesPerScreen,slideLines:lyricsSlide?.lines?.length||0,blobW:bm.width,blobH:bm.height,snapshot:s,actual};
            });
            console.log('MOBILE_CANVAS_PARITY',JSON.stringify(result));
            const near=(a,b,t=1.5)=>Math.abs(Number(a)-Number(b))<=t;
            if(result.version!=='Web v1.153'||Math.abs(result.ratio-16/9)>.025)throw new Error('preview is not 16:9 '+JSON.stringify(result));
            if(result.linesPerScreen!==4||result.slideLines!==4)throw new Error('mobile export does not follow selected 4-line layout '+JSON.stringify(result));
            if(result.blobW!==1280||result.blobH!==720)throw new Error('overlay resolution mismatch '+JSON.stringify(result));
            const s=result.snapshot,a=result.actual;
            if(!near(a.content.fontPx,s.lyrics.fontH*720))throw new Error('actual Canvas lyric font does not match live preview ratio '+JSON.stringify(result));
            if(!near(a.brands.left.fontPx,s.brandL.fontH*720)||!near(a.brands.right.fontPx,s.brandR.fontH*720))throw new Error('actual Canvas top-brand font does not match live preview ratio '+JSON.stringify(result));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Run MP4 AAC plus WMV PCM handoff render in WebKit
        run: |
          node <<'NODE'
          const { webkit } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const page=await browser.newPage();
            page.on('console',m=>console.log('BROWSER:',m.text()));page.on('pageerror',e=>console.error('PAGEERROR:',e.message));
            await page.goto('http://127.0.0.1:8080/renderer-selftest.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__RESULT__?.done===true,null,{timeout:180000});
            const result=await page.evaluate(()=>window.__RESULT__);console.log('RESULT',JSON.stringify(result));await browser.close();
            if(!result.ok||result.sw!=='hks-v153'||!result.patchCached||result.ffmpegCachedByApp||!result.handoffPreserved||result.mp4<1000||result.wmv<1000)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE