name: Renderer Self Test
on:
  push:
    branches: [main]
    paths:
      - 'renderer-selftest.html'
      - 'index.html'
      - 'patch-v30.js'
      - 'patch-v131.js'
      - 'patch-v146.js'
      - 'patch-v147.js'
      - 'patch-v148.js'
      - 'patch-v149.js'
      - 'version.json'
      - 'sw.js'
      - 'vendor/ffmpeg/**'
      - '.github/workflows/renderer-selftest.yml'
  workflow_dispatch:
jobs:
  webkit-render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify v1.149 waveform wiring
        run: |
          node --check patch-v30.js
          node --check patch-v131.js
          node --check patch-v146.js
          node --check patch-v147.js
          node --check patch-v148.js
          node --check patch-v149.js
          node --check sw.js
          node --check vendor/ffmpeg/ffmpeg/worker-classic.js
          node - <<'NODE'
          const fs=require('fs');
          const loader=fs.readFileSync('patch-v30.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const index=fs.readFileSync('index.html','utf8');
          const p149=fs.readFileSync('patch-v149.js','utf8');
          const version=JSON.parse(fs.readFileSync('version.json','utf8'));
          const selftest=fs.readFileSync('renderer-selftest.html','utf8');
          if(!loader.includes('__hksLoaderVersion=149')||!loader.includes('146,147,148,149')||!loader.includes('__hksStartupMs149'))throw Error('v149 loader wiring missing');
          if(version.version!==149)throw Error('version.json is not 149');
          if(!index.includes('patch-v30.js?v=149')||!index.includes('Web v1.149 — טוען'))throw Error('v149 app shell wiring missing');
          if(!sw.includes("CACHE='hks-v149'")||!sw.includes("patch-v149.js?v=149"))throw Error('v149 service worker missing');
          for(const marker of ['__hksWaveFollow149','requestAnimationFrame(frame)','audio.addEventListener(\'pause\',stopFollow)','audio.addEventListener(\'seeked\'','around 42%'])if(!p149.includes(marker))throw Error('v149 waveform marker missing: '+marker);
          if(!selftest.includes('register-service-worker-v149')||!selftest.includes('render-mp4-720p-aac320')||!selftest.includes('render-wmv-720p-pcm-s16le-48k-stereo'))throw Error('v149 renderer self-test wiring missing');
          console.log('v1.149 wiring OK');
          NODE
      - name: Install Playwright WebKit
        run: |
          npm init -y
          npm i playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve app
        run: |
          python3 -m http.server 8080 >/tmp/server.log 2>&1 &
          sleep 2
      - name: Verify live waveform follows playback position
        run: |
          node <<'NODE'
          const { webkit } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const page=await browser.newPage({viewport:{width:430,height:932},userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1'});
            page.on('pageerror',e=>console.error('PAGEERROR:',e.message));
            await page.goto('http://127.0.0.1:8080/index.html?hksUpdate=148&_=123',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelector('.version')?.textContent==='Web v1.149'&&window.__hksWaveFollow149===true&&window.__hksWaveFollow149Api,null,{timeout:20000});
            const result=await page.evaluate(()=>{
              const audio=document.getElementById('audio');
              Object.defineProperty(audio,'duration',{value:100,configurable:true});
              Object.defineProperty(audio,'currentTime',{value:50,writable:true,configurable:true});
              const calls=[];
              window.__hksWaveView125={zoom:10,pan:0,view(){return{start:0,end:10,span:10}},set(z,p){this.zoom=z;this.pan=p;calls.push({z,p})}};
              window.__hksWaveFollow149Api.update();
              const afterUpdate=calls[calls.length-1]||null;
              window.__hksWaveFollow149Api.stop();
              const afterStop=calls[calls.length-1]||null;
              return{version:document.querySelector('.version')?.textContent,calls,afterUpdate,afterStop,active:window.__hksWaveFollow149Api.active};
            });
            console.log('WAVEFOLLOW',JSON.stringify(result));
            if(result.version!=='Web v1.149'||!result.afterUpdate||result.afterUpdate.z!==10||!(result.afterUpdate.p>0.45&&result.afterUpdate.p<0.56)||result.active!==false||result.calls.length<2)throw new Error('waveform follow failed '+JSON.stringify(result));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Run MP4 AAC plus WMV PCM handoff render in WebKit
        run: |
          node <<'NODE'
          const { webkit } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const page=await browser.newPage();
            page.on('console',m=>console.log('BROWSER:',m.text()));page.on('pageerror',e=>console.error('PAGEERROR:',e.message));
            await page.goto('http://127.0.0.1:8080/renderer-selftest.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__RESULT__?.done===true,null,{timeout:180000});
            const result=await page.evaluate(()=>window.__RESULT__);console.log('RESULT',JSON.stringify(result));await browser.close();
            if(!result.ok||result.sw!=='hks-v149'||!result.patchCached||result.ffmpegCachedByApp||!result.handoffPreserved||result.mp4<1000||result.wmv<1000)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE