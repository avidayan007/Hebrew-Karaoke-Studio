name: Renderer Self Test
on:
  push:
    branches: [main]
    paths:
      - 'renderer-selftest.html'
      - 'index.html'
      - 'patch-v30.js'
      - 'patch-v146.js'
      - 'patch-v147.js'
      - 'patch-v148.js'
      - 'patch-v149.js'
      - 'patch-v150.js'
      - 'patch-v151.js'
      - 'patch-v152.js'
      - 'patch-v153.js'
      - 'patch-v154.js'
      - 'version.json'
      - 'sw.js'
      - 'vendor/ffmpeg/**'
      - '.github/workflows/renderer-selftest.yml'
  workflow_dispatch:
jobs:
  webkit-render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify v1.154 custom fullscreen wiring
        run: |
          node --check patch-v30.js
          node --check patch-v153.js
          node --check patch-v154.js
          node --check sw.js
          node - <<'NODE'
          const fs=require('fs');
          const loader=fs.readFileSync('patch-v30.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const p=fs.readFileSync('patch-v154.js','utf8');
          const index=fs.readFileSync('index.html','utf8');
          const version=JSON.parse(fs.readFileSync('version.json','utf8'));
          const selftest=fs.readFileSync('renderer-selftest.html','utf8');
          if(!loader.includes('__hksLoaderVersion=154')||!loader.includes('152,153,154')||!loader.includes('__hksStartupMs154'))throw Error('v154 loader wiring missing');
          if(version.version!==154)throw Error('version.json is not 154');
          if(!sw.includes("CACHE='hks-v154'")||!sw.includes("patch-v154.js?v=154"))throw Error('v154 service worker missing');
          if(!index.includes('patch-v30.js?v=154')||!index.includes('Web v1.154 — טוען'))throw Error('v154 app shell missing');
          for(const marker of ['__hksFullscreenExportParity154','hksPhoneFullscreen','captureActualFullscreen','injectFullscreenMetrics','centerX:.5,centerY:.5','__hksFullscreenExportSnapshot154'])if(!p.includes(marker))throw Error('v154 fullscreen marker missing: '+marker);
          if(!selftest.includes('register-service-worker-v154')||!selftest.includes('render-mp4-720p-aac320')||!selftest.includes('render-wmv-720p-pcm-s16le-48k-stereo'))throw Error('v154 renderer self-test wiring missing');
          console.log('v1.154 wiring OK');
          NODE
      - name: Install Playwright WebKit
        run: |
          npm init -y
          npm i playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve app
        run: |
          python3 -m http.server 8080 >/tmp/server.log 2>&1 &
          sleep 2
      - name: Verify actual hksPhoneFullscreen drives iPhone Canvas export
        run: |
          node <<'NODE'
          const { webkit } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const page=await browser.newPage({viewport:{width:932,height:430},userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1'});
            page.on('pageerror',e=>console.error('PAGEERROR:',e.message));
            await page.goto('http://127.0.0.1:8080/index.html?hksUpdate=153&_=123',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelector('.version')?.textContent==='Web v1.154'&&window.__hksRenderMobile153&&window.__hksFullscreenExport154,null,{timeout:30000});
            const result=await page.evaluate(async()=>{
              const preview=document.getElementById('preview'),ly=document.getElementById('lyricsPreview'),bl=preview.querySelector('.brandL'),br=preview.querySelector('.brandR');
              document.getElementById('lyricsText').value='שורה אחת\nשורה שתיים\nשורה שלוש\nשורה ארבע';
              document.querySelector('#hksLinesPerScreen99 button[data-lines="4"]')?.click();
              prepare();words.forEach((w,i)=>w.time=1+i*.35);current=words.length;try{renderWords();updateSyncPreview()}catch(_){}
              ly.style.setProperty('font-size','52px','important');bl.style.setProperty('font-size','24px','important');br.style.setProperty('font-size','24px','important');
              const titleInput=document.getElementById('hksSongTitleInput');if(titleInput){titleInput.value='שיר בדיקה';titleInput.dispatchEvent(new Event('input',{bubbles:true}))}
              if(window.__hksSongTitleState)window.__hksSongTitleState.size=80;
              const ti=document.getElementById('hksSongTitleText');if(ti)ti.style.setProperty('font-size','80px','important');

              // Activate the exact custom fullscreen class used by v1.34 on iPhone.
              preview.classList.add('hksPhoneFullscreen');document.body.classList.add('hksPreviewFullscreenOpen');
              await new Promise(r=>setTimeout(r,240));
              const full=window.__hksFullscreenExport154.capture();
              const fullRect=preview.getBoundingClientRect();

              // Leave fullscreen and go to Export. v1.154 must keep the measured fullscreen snapshot.
              preview.classList.remove('hksPhoneFullscreen');document.body.classList.remove('hksPreviewFullscreenOpen');
              document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='export'));
              document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.page==='export'));
              window.__hksFullscreenExport154.inject();
              const injected=window.__hksFullscreenExportSnapshot154;
              const api=window.__hksRenderMobile153;
              const snap=api.capture();
              const slides=api.buildSlides(8),lyricsSlide=slides.find(x=>x.kind==='lyrics'),titleSlide=slides.find(x=>x.kind==='title');
              const lyricBlob=await api.makeOverlayBlob(lyricsSlide,{width:1280,height:720,fps:30});
              const lyricBitmap=await createImageBitmap(lyricBlob),lyricActual=JSON.parse(JSON.stringify(window.__hksLastMobileOverlay153));
              let titleActual=null;
              if(titleSlide){await api.makeOverlayBlob(titleSlide,{width:1280,height:720,fps:30});titleActual=JSON.parse(JSON.stringify(window.__hksLastMobileOverlay153));}
              return{version:document.querySelector('.version')?.textContent,fullW:fullRect.width,fullH:fullRect.height,full,injected,snap,blobW:lyricBitmap.width,blobH:lyricBitmap.height,lyricActual,titleActual};
            });
            console.log('FULLSCREEN_EXPORT_PARITY',JSON.stringify(result));
            const near=(a,b,t=1.6)=>Math.abs(Number(a)-Number(b))<=t;
            if(result.version!=='Web v1.154')throw new Error('wrong version '+JSON.stringify(result));
            if(Math.abs(result.fullW-932)>3||Math.abs(result.fullH-430)>3)throw new Error('custom fullscreen did not fill iPhone viewport '+JSON.stringify(result));
            if(result.full.source!=='actual-hksPhoneFullscreen')throw new Error('actual custom fullscreen was not captured '+JSON.stringify(result));
            if(result.blobW!==1280||result.blobH!==720)throw new Error('overlay resolution mismatch '+JSON.stringify(result));
            if(!near(result.injected.lyrics.fontH,52/430,.002)||!near(result.injected.brandL.fontH,24/430,.002)||!near(result.injected.title.fontH,80/430,.002))throw new Error('fullscreen font ratios were not injected '+JSON.stringify(result));
            if(!near(result.lyricActual.content.fontPx,(52/430)*720,2.0))throw new Error('Canvas lyric font does not use fullscreen ratio '+JSON.stringify(result));
            if(!near(result.lyricActual.brands.left.fontPx,(24/430)*720,2.0)||!near(result.lyricActual.brands.right.fontPx,(24/430)*720,2.0))throw new Error('Canvas brand font does not use fullscreen ratio '+JSON.stringify(result));
            if(result.titleActual&&(!near(result.titleActual.content.centerX,640,2)||!near(result.titleActual.content.centerY,360,2)||!near(result.titleActual.content.fontPx,(80/430)*720,2.0)))throw new Error('song title is not centered/sized from fullscreen '+JSON.stringify(result));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Run MP4 AAC plus WMV PCM handoff render in WebKit
        run: |
          node <<'NODE'
          const { webkit } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const page=await browser.newPage();
            page.on('console',m=>console.log('BROWSER:',m.text()));page.on('pageerror',e=>console.error('PAGEERROR:',e.message));
            await page.goto('http://127.0.0.1:8080/renderer-selftest.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__RESULT__?.done===true,null,{timeout:180000});
            const result=await page.evaluate(()=>window.__RESULT__);console.log('RESULT',JSON.stringify(result));await browser.close();
            if(!result.ok||result.sw!=='hks-v154'||!result.patchCached||result.ffmpegCachedByApp||!result.handoffPreserved||result.mp4<1000||result.wmv<1000)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE