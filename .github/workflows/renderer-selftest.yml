name: Renderer Self Test
on:
  push:
    branches: [main]
    paths:
      - 'renderer-selftest.html'
      - 'index.html'
      - 'patch-v30.js'
      - 'patch-v131.js'
      - 'patch-v146.js'
      - 'patch-v147.js'
      - 'patch-v148.js'
      - 'patch-v149.js'
      - 'patch-v150.js'
      - 'patch-v151.js'
      - 'version.json'
      - 'sw.js'
      - 'vendor/ffmpeg/**'
      - '.github/workflows/renderer-selftest.yml'
  workflow_dispatch:
jobs:
  webkit-render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify v1.151 compact history wiring
        run: |
          node --check patch-v30.js
          node --check patch-v150.js
          node --check patch-v151.js
          node --check sw.js
          node - <<'NODE'
          const fs=require('fs');
          const loader=fs.readFileSync('patch-v30.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const p151=fs.readFileSync('patch-v151.js','utf8');
          const version=JSON.parse(fs.readFileSync('version.json','utf8'));
          const selftest=fs.readFileSync('renderer-selftest.html','utf8');
          if(!loader.includes('__hksLoaderVersion=151')||!loader.includes('149,150,151')||!loader.includes('__hksStartupMs151'))throw Error('v151 loader wiring missing');
          if(version.version!==151)throw Error('version.json is not 151');
          if(!sw.includes("CACHE='hks-v151'")||!sw.includes("patch-v151.js?v=151"))throw Error('v151 service worker missing');
          for(const marker of ['__hksCompactHistory151','hksTopActions151','hksUndo151','hksRedo151','44px','hksHistoryRow150'])if(!p151.includes(marker))throw Error('v151 compact history marker missing: '+marker);
          if(!selftest.includes('register-service-worker-v151')||!selftest.includes('render-mp4-720p-aac320')||!selftest.includes('render-wmv-720p-pcm-s16le-48k-stereo'))throw Error('v151 renderer self-test wiring missing');
          console.log('v1.151 wiring OK');
          NODE
      - name: Install Playwright WebKit
        run: |
          npm init -y
          npm i playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve app
        run: |
          python3 -m http.server 8080 >/tmp/server.log 2>&1 &
          sleep 2
      - name: Verify compact Undo Redo beside Refresh Update
        run: |
          node <<'NODE'
          const { webkit } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const page=await browser.newPage({viewport:{width:430,height:932},userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1'});
            page.on('pageerror',e=>console.error('PAGEERROR:',e.message));
            await page.goto('http://127.0.0.1:8080/index.html?hksUpdate=151&_=123',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelector('.version')?.textContent==='Web v1.151'&&window.__hksSyncHistory150Api&&window.__hksCompactHistory151Api,null,{timeout:25000});
            const result=await page.evaluate(()=>{
              document.getElementById('lyricsText').value='אחד שני שלוש';prepare();
              const hist=window.__hksSyncHistory150Api,ui=window.__hksCompactHistory151Api;hist.clear();
              words[0].time=1;current=1;hist.scan();
              words[1].time=2;current=2;hist.scan();ui.paint();
              const undo=document.getElementById('hksUndo151'),redo=document.getElementById('hksRedo151'),refresh=document.getElementById('hksRefresh105');
              const ur=undo.getBoundingClientRect(),rr=redo.getBoundingClientRect();
              const sameWrap=!!refresh&&refresh.parentElement?.id==='hksTopActions151'&&undo.parentElement===refresh.parentElement&&redo.parentElement===refresh.parentElement;
              ui.undo();const afterUndo=words.map(w=>w.time);ui.redo();const afterRedo=words.map(w=>w.time);
              return{version:document.querySelector('.version')?.textContent,largeRow:!!document.getElementById('hksHistoryRow150'),counter:!!document.getElementById('hksHistoryCount150'),sameWrap,uw:ur.width,uh:ur.height,rw:rr.width,rh:rr.height,afterUndo,afterRedo};
            });
            console.log('COMPACT',JSON.stringify(result));
            if(result.version!=='Web v1.151'||result.largeRow||result.counter||!result.sameWrap)throw new Error('compact placement failed '+JSON.stringify(result));
            if(result.uw>48||result.rw>48||result.uh>40||result.rh>40)throw new Error('history buttons are not compact '+JSON.stringify(result));
            if(JSON.stringify(result.afterUndo)!==JSON.stringify([1,null,null])||JSON.stringify(result.afterRedo)!==JSON.stringify([1,2,null]))throw new Error('compact undo redo behavior failed '+JSON.stringify(result));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Run MP4 AAC plus WMV PCM handoff render in WebKit
        run: |
          node <<'NODE'
          const { webkit } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const page=await browser.newPage();
            page.on('console',m=>console.log('BROWSER:',m.text()));page.on('pageerror',e=>console.error('PAGEERROR:',e.message));
            await page.goto('http://127.0.0.1:8080/renderer-selftest.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__RESULT__?.done===true,null,{timeout:180000});
            const result=await page.evaluate(()=>window.__RESULT__);console.log('RESULT',JSON.stringify(result));await browser.close();
            if(!result.ok||result.sw!=='hks-v151'||!result.patchCached||result.ffmpegCachedByApp||!result.handoffPreserved||result.mp4<1000||result.wmv<1000)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE