name: Renderer Self Test
on:
  push:
    branches: [main]
    paths:
      - 'renderer-selftest.html'
      - 'index.html'
      - 'patch-v30.js'
      - 'patch-v146.js'
      - 'patch-v147.js'
      - 'patch-v148.js'
      - 'patch-v149.js'
      - 'patch-v150.js'
      - 'patch-v151.js'
      - 'patch-v152.js'
      - 'patch-v153.js'
      - 'patch-v154.js'
      - 'patch-v155.js'
      - 'version.json'
      - 'sw.js'
      - 'vendor/ffmpeg/**'
      - '.github/workflows/renderer-selftest.yml'
  workflow_dispatch:
jobs:
  webkit-render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify v1.155 export preview wiring
        run: |
          node --check patch-v30.js
          node --check patch-v153.js
          node --check patch-v154.js
          node --check patch-v155.js
          node --check sw.js
          node - <<'NODE'
          const fs=require('fs');
          const loader=fs.readFileSync('patch-v30.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const p=fs.readFileSync('patch-v155.js','utf8');
          const index=fs.readFileSync('index.html','utf8');
          const version=JSON.parse(fs.readFileSync('version.json','utf8'));
          const selftest=fs.readFileSync('renderer-selftest.html','utf8');
          if(!loader.includes('__hksLoaderVersion=155')||!loader.includes('153,154,155')||!loader.includes('__hksStartupMs155'))throw Error('v155 loader wiring missing');
          if(version.version!==155)throw Error('version.json is not 155');
          if(!sw.includes("CACHE='hks-v155'")||!sw.includes("patch-v155.js?v=155"))throw Error('v155 service worker missing');
          if(!index.includes('patch-v30.js?v=155')||!index.includes('Web v1.155 — טוען'))throw Error('v155 app shell missing');
          for(const marker of ['__hksExportComposerParity155','hksRenderStage155','__hksExportComposerMetrics155','makeOverlayBlob','מה שאתה רואה כאן = מה שיוצא בקובץ','fontH:state.lyricsPx/720','fontH:state.titlePx/720'])if(!p.includes(marker))throw Error('v155 export preview marker missing: '+marker);
          if(!selftest.includes('register-service-worker-v155')||!selftest.includes('render-mp4-720p-aac320')||!selftest.includes('render-wmv-720p-pcm-s16le-48k-stereo'))throw Error('v155 renderer self-test wiring missing');
          console.log('v1.155 wiring OK');
          NODE
      - name: Install Playwright WebKit
        run: |
          npm init -y
          npm i playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve app
        run: |
          python3 -m http.server 8080 >/tmp/server.log 2>&1 &
          sleep 2
      - name: Verify Export Preview exactly drives the real iPhone Canvas renderer
        run: |
          node <<'NODE'
          const { webkit } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const page=await browser.newPage({viewport:{width:430,height:932},userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1'});
            page.on('pageerror',e=>console.error('PAGEERROR:',e.message));
            await page.goto('http://127.0.0.1:8080/index.html?hksUpdate=154&_=155',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelector('.version')?.textContent==='Web v1.155'&&window.__hksRenderMobile153&&window.__hksExportComposer155,null,{timeout:30000});
            const result=await page.evaluate(async()=>{
              document.getElementById('lyricsText').value='שורה אחת\nשורה שתיים\nשורה שלוש\nשורה ארבע';
              document.querySelector('#hksLinesPerScreen99 button[data-lines="4"]')?.click();
              prepare();words.forEach((w,i)=>w.time=1+i*.3);current=words.length;try{renderWords();updateSyncPreview()}catch(_){}
              const titleInput=document.getElementById('hksSongTitleInput');if(titleInput){titleInput.value='שיר בדיקה';titleInput.dispatchEvent(new Event('input',{bubbles:true}))}
              document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='export'));
              document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.page==='export'));
              await new Promise(r=>setTimeout(r,150));
              const api=window.__hksExportComposer155;
              api.set('brandPx',34);api.set('titlePx',126);api.set('lyricsY',61);api.set('titleY',46);
              const lyricInput=document.getElementById('hksLyricsRenderPx155');lyricInput.value='110';lyricInput.dispatchEvent(new Event('input',{bubbles:true}));
              await new Promise(r=>setTimeout(r,180));
              await api.showLyrics();
              const lyricActual=api.lastActual,metrics=api.metrics,stage=document.getElementById('hksRenderStage155').getBoundingClientRect();
              const overlay=document.getElementById('hksRenderOverlay155');
              await api.showTitle();
              const titleActual=api.lastActual;
              api.inject();
              return {version:document.querySelector('.version')?.textContent,stageW:stage.width,stageH:stage.height,overlayReady:!!overlay.src,metrics,injected:window.__hksPreviewMetrics152,lyricActual,titleActual,state:api.state};
            });
            console.log('EXPORT_PREVIEW_PARITY',JSON.stringify(result));
            const near=(a,b,t=1.5)=>Math.abs(Number(a)-Number(b))<=t;
            if(result.version!=='Web v1.155')throw new Error('wrong version '+JSON.stringify(result));
            if(Math.abs(result.stageW/result.stageH-16/9)>.025||!result.overlayReady)throw new Error('export preview stage is not a real 16:9 renderer preview '+JSON.stringify(result));
            if(!near(result.metrics.lyrics.fontH,110/720,.0002)||!near(result.metrics.brandL.fontH,34/720,.0002)||!near(result.metrics.title.fontH,126/720,.0002))throw new Error('composer metrics do not match entered 720p sizes '+JSON.stringify(result));
            if(!near(result.metrics.lyrics.centerY,.61,.002)||!near(result.metrics.title.centerY,.46,.002))throw new Error('composer vertical positions do not match controls '+JSON.stringify(result));
            if(!near(result.lyricActual.content.fontPx,110,1.2))throw new Error('real Canvas lyric font did not follow Export Preview input '+JSON.stringify(result));
            if(!near(result.lyricActual.brands.left.fontPx,34,1.2)||!near(result.lyricActual.brands.right.fontPx,34,1.2))throw new Error('real Canvas top labels did not follow Export Preview input '+JSON.stringify(result));
            if(!near(result.lyricActual.content.centerY,.61*720,1.5))throw new Error('real Canvas lyric position did not follow Export Preview '+JSON.stringify(result));
            if(!near(result.titleActual.content.fontPx,126,1.2)||!near(result.titleActual.content.centerX,640,1.5)||!near(result.titleActual.content.centerY,.46*720,1.5))throw new Error('real Canvas song title did not follow Export Preview '+JSON.stringify(result));
            if(!near(result.injected.lyrics.fontH,result.metrics.lyrics.fontH,.00001)||!near(result.injected.title.centerY,result.metrics.title.centerY,.00001))throw new Error('render click metrics are not the Export Preview metrics '+JSON.stringify(result));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Run MP4 AAC plus WMV PCM handoff render in WebKit
        run: |
          node <<'NODE'
          const { webkit } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const page=await browser.newPage();
            page.on('console',m=>console.log('BROWSER:',m.text()));page.on('pageerror',e=>console.error('PAGEERROR:',e.message));
            await page.goto('http://127.0.0.1:8080/renderer-selftest.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__RESULT__?.done===true,null,{timeout:180000});
            const result=await page.evaluate(()=>window.__RESULT__);console.log('RESULT',JSON.stringify(result));await browser.close();
            if(!result.ok||result.sw!=='hks-v155'||!result.patchCached||result.ffmpegCachedByApp||!result.handoffPreserved||result.mp4<1000||result.wmv<1000)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE