name: Renderer Self Test
on:
  push:
    branches: [main]
    paths:
      - 'renderer-selftest.html'
      - 'patch-v28.js'
      - 'patch-v30.js'
      - 'patch-v84.js'
      - 'patch-v131.js'
      - 'patch-v132.js'
      - 'patch-v133.js'
      - 'patch-v134.js'
      - 'patch-v135.js'
      - 'patch-v136.js'
      - 'patch-v137.js'
      - 'sw.js'
      - 'vendor/ffmpeg/**'
      - '.github/workflows/renderer-selftest.yml'
  workflow_dispatch:
jobs:
  webkit-render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify v1.137 JavaScript and wiring
        run: |
          node --check patch-v28.js
          node --check patch-v30.js
          node --check patch-v84.js
          node --check patch-v131.js
          node --check patch-v132.js
          node --check patch-v133.js
          node --check patch-v134.js
          node --check patch-v135.js
          node --check patch-v136.js
          node --check patch-v137.js
          node --check sw.js
          node --check vendor/ffmpeg/ffmpeg/worker-classic.js
          node - <<'NODE'
          const fs=require('fs');
          const loader=fs.readFileSync('patch-v30.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const p135=fs.readFileSync('patch-v135.js','utf8');
          const p136=fs.readFileSync('patch-v136.js','utf8');
          const p137=fs.readFileSync('patch-v137.js','utf8');
          const selftest=fs.readFileSync('renderer-selftest.html','utf8');
          if(!loader.includes('135,136,137')||!loader.includes('?v=137'))throw Error('v137 loader wiring missing');
          if(!sw.includes("CACHE='hks-v137'")||!sw.includes(',135,136,137]')||!sw.includes('patch-v${n}.js?v=137'))throw Error('v137 service-worker wiring missing');
          if(!sw.includes("p.includes('/vendor/ffmpeg/')")||!sw.includes('HKS_SW_VERSION'))throw Error('v137 FFmpeg service-worker bypass missing');
          for(const marker of ['safe720','zerolatency','__hksLastFFmpegError135'])if(!p135.includes(marker))throw Error('v135 stable renderer marker missing: '+marker);
          for(const marker of ['storedMp4','source136.mp4',"videoK=mode==='safe720'?'4M'",'__hksRender136'])if(!p136.includes(marker))throw Error('v136 WMV marker missing: '+marker);
          for(const marker of ['hks-v137','LOAD_TIMEOUT=180*1000','__hksFFmpegLoading137','__hksExportEstimate137'])if(!p137.includes(marker))throw Error('v137 marker missing: '+marker);
          if(!selftest.includes('register-service-worker-v137')||!selftest.includes('render-mp4-720p-zerolatency')||!selftest.includes('render-wmv-from-mp4-720p')||!selftest.includes('ffmpegCachedByApp'))throw Error('v137 self-test flow missing');
          console.log('v1.137 wiring OK');
          NODE
      - name: Install Playwright WebKit
        run: |
          npm init -y
          npm i playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve app
        run: |
          python3 -m http.server 8080 >/tmp/server.log 2>&1 &
          sleep 2
      - name: Run actual MP4 and WMV render in WebKit with service worker
        run: |
          node <<'NODE'
          const { webkit } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const page=await browser.newPage();
            page.on('console',m=>console.log('BROWSER:',m.text()));
            page.on('pageerror',e=>console.error('PAGEERROR:',e.message));
            await page.goto('http://127.0.0.1:8080/renderer-selftest.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__RESULT__?.done===true,null,{timeout:180000});
            const result=await page.evaluate(()=>window.__RESULT__);
            console.log('RESULT',JSON.stringify(result));
            await browser.close();
            if(!result.ok || result.sw!=='hks-v137' || result.ffmpegCachedByApp || result.mp4 < 1000 || result.wmv < 1000) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
