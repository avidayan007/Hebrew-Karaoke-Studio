name: Renderer Self Test
on:
  push:
    branches: [main]
    paths:
      - 'renderer-selftest.html'
      - 'index.html'
      - 'patch-v30.js'
      - 'patch-v136.js'
      - 'patch-v137.js'
      - 'patch-v138.js'
      - 'patch-v139.js'
      - 'patch-v140.js'
      - 'patch-v141.js'
      - 'patch-v142.js'
      - 'patch-v143.js'
      - 'sw.js'
      - 'vendor/ffmpeg/**'
      - '.github/workflows/renderer-selftest.yml'
  workflow_dispatch:
jobs:
  webkit-render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify v1.143 JavaScript and wiring
        run: |
          node --check patch-v30.js
          node --check patch-v136.js
          node --check patch-v137.js
          node --check patch-v138.js
          node --check patch-v139.js
          node --check patch-v140.js
          node --check patch-v141.js
          node --check patch-v142.js
          node --check patch-v143.js
          node --check sw.js
          node --check vendor/ffmpeg/ffmpeg/worker-classic.js
          node - <<'NODE'
          const fs=require('fs');
          const loader=fs.readFileSync('patch-v30.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const index=fs.readFileSync('index.html','utf8');
          const p138=fs.readFileSync('patch-v138.js','utf8');
          const p140=fs.readFileSync('patch-v140.js','utf8');
          const p143=fs.readFileSync('patch-v143.js','utf8');
          const selftest=fs.readFileSync('renderer-selftest.html','utf8');
          if(!loader.includes('__hksLoaderVersion=143')||!loader.includes('141,142,143')||!loader.includes('patches.slice(6)')||loader.includes('await Promise.all(Array.from({length:6},warmer))'))throw Error('v143 non-blocking loader wiring missing');
          if(!loader.includes('__hksStartupMs143'))throw Error('startup timing marker missing');
          if(!index.includes('patch-v30.js?v=143')||!index.includes('Web v1.143 — טוען'))throw Error('app shell still points to stale loader');
          if(!sw.includes("CACHE='hks-v143'")||!sw.includes("patch-v143.js?v=143")||!sw.includes("patch-v138.js?v=143"))throw Error('v143 service-worker wiring missing');
          if(!p138.includes('currentVersion')||!p138.includes('currentSW')||p138.includes("CURRENT=140")||p138.includes("SW='hks-v140'"))throw Error('stale hard-update target still present');
          for(const marker of ['AAC 320 kbps','PCM לא דחוס','pcm_s16le'])if(!p140.includes(marker))throw Error('v140 audio marker missing: '+marker);
          if(!p143.includes('Web v1.143')||!p143.includes("hksUpdate")||!p143.includes("btn.disabled=false"))throw Error('v143 startup cleanup missing');
          if(!selftest.includes('register-service-worker-v143')||!selftest.includes('render-mp4-720p-aac320')||!selftest.includes('render-wmv-720p-pcm-s16le-48k-stereo'))throw Error('v143 renderer self-test flow missing');
          console.log('v1.143 wiring OK');
          NODE
      - name: Install Playwright WebKit
        run: |
          npm init -y
          npm i playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve app
        run: |
          python3 -m http.server 8080 >/tmp/server.log 2>&1 &
          sleep 2
      - name: Verify full app startup finishes without update loop
        run: |
          node <<'NODE'
          const { webkit } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const page=await browser.newPage({userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1'});
            page.on('pageerror',e=>console.error('PAGEERROR:',e.message));
            const t=Date.now();
            await page.goto('http://127.0.0.1:8080/index.html?hksUpdate=142&_=123',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelector('.version')?.textContent==='Web v1.143' && Number(window.__hksStartupMs143)>0,null,{timeout:15000});
            const state=await page.evaluate(()=>({version:document.querySelector('.version')?.textContent,status:document.querySelector('#status')?.textContent,startup:window.__hksStartupMs143,search:location.search,updating:[...document.querySelectorAll('button')].some(b=>b.disabled&&/מעדכן לגרסה/.test(b.textContent||'')),bg:getComputedStyle(document.body).backgroundColor}));
            console.log('STARTUP',JSON.stringify(state),'wall',Date.now()-t);
            await browser.close();
            if(state.version!=='Web v1.143'||state.updating||/מנקה cache ישן/.test(state.status||'')||/hksUpdate/.test(state.search)||state.startup>15000)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Run MP4 AAC + WMV PCM render in WebKit
        run: |
          node <<'NODE'
          const { webkit } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const page=await browser.newPage();
            page.on('console',m=>console.log('BROWSER:',m.text()));
            page.on('pageerror',e=>console.error('PAGEERROR:',e.message));
            await page.goto('http://127.0.0.1:8080/renderer-selftest.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__RESULT__?.done===true,null,{timeout:180000});
            const result=await page.evaluate(()=>window.__RESULT__);
            console.log('RESULT',JSON.stringify(result));
            await browser.close();
            if(!result.ok || result.sw!=='hks-v143' || !result.patchCached || result.ffmpegCachedByApp || result.mp4 < 1000 || result.wmv < 1000) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE