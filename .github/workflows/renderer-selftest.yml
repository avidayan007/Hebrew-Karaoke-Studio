name: Renderer Self Test
on:
  push:
    branches: [main]
    paths:
      - 'renderer-selftest.html'
      - 'patch-v30.js'
      - 'patch-v136.js'
      - 'patch-v137.js'
      - 'patch-v138.js'
      - 'patch-v139.js'
      - 'patch-v140.js'
      - 'patch-v141.js'
      - 'patch-v142.js'
      - 'patch-v143.js'
      - 'patch-v144.js'
      - 'version.json'
      - 'sw.js'
      - 'vendor/ffmpeg/**'
      - '.github/workflows/renderer-selftest.yml'
  workflow_dispatch:
jobs:
  webkit-render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify v1.144 JavaScript and wiring
        run: |
          node --check patch-v30.js
          node --check patch-v138.js
          node --check patch-v140.js
          node --check patch-v144.js
          node --check sw.js
          node --check vendor/ffmpeg/ffmpeg/worker-classic.js
          node - <<'NODE'
          const fs=require('fs');
          const loader=fs.readFileSync('patch-v30.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const p138=fs.readFileSync('patch-v138.js','utf8');
          const p140=fs.readFileSync('patch-v140.js','utf8');
          const p144=fs.readFileSync('patch-v144.js','utf8');
          const version=JSON.parse(fs.readFileSync('version.json','utf8'));
          const selftest=fs.readFileSync('renderer-selftest.html','utf8');
          if(!loader.includes('__hksLoaderVersion=144')||!loader.includes('142,143,144')||!loader.includes('__hksStartupMs144'))throw Error('v144 loader missing');
          if(version.version!==144)throw Error('version.json is not 144');
          if(!sw.includes("CACHE='hks-v144'")||!sw.includes('version.json')||!sw.includes("cache:'no-store'"))throw Error('v144 service worker missing');
          if(!p138.includes('latestVersion')||!p138.includes('version.json')||!p138.includes('אתה כבר בגרסה האחרונה')||p138.includes('caches.delete'))throw Error('smart update no-op logic missing');
          if(!p144.includes('Web v1.144')||!p144.includes('מנגנון העדכון החכם'))throw Error('v144 finalizer missing');
          for(const marker of ['AAC 320 kbps','PCM לא דחוס','pcm_s16le'])if(!p140.includes(marker))throw Error('audio marker missing: '+marker);
          if(!selftest.includes('register-service-worker-v144')||!selftest.includes('render-mp4-720p-aac320')||!selftest.includes('render-wmv-720p-pcm-s16le-48k-stereo'))throw Error('v144 selftest missing');
          console.log('v1.144 wiring OK');
          NODE
      - name: Install Playwright WebKit
        run: |
          npm init -y
          npm i playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve app
        run: |
          python3 -m http.server 8080 >/tmp/server.log 2>&1 &
          sleep 2
      - name: Verify full app startup and update no-op
        run: |
          node <<'NODE'
          const { webkit } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const page=await browser.newPage({userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1'});
            page.on('pageerror',e=>console.error('PAGEERROR:',e.message));
            await page.goto('http://127.0.0.1:8080/index.html?hksUpdate=143&_=123',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelector('.version')?.textContent==='Web v1.144' && Number(window.__hksStartupMs144)>0,null,{timeout:15000});
            const before=page.url();
            const btn=page.getByRole('button',{name:/רענן עדכון/});
            await btn.waitFor({timeout:5000});
            await btn.click();
            await page.waitForFunction(()=>/אתה כבר בגרסה האחרונה.*v1\.144/.test(document.querySelector('#status')?.textContent||''),null,{timeout:5000});
            await page.waitForTimeout(600);
            const state=await page.evaluate(()=>({version:document.querySelector('.version')?.textContent,status:document.querySelector('#status')?.textContent,startup:window.__hksStartupMs144,search:location.search,updating:[...document.querySelectorAll('button')].some(b=>b.disabled&&/מעדכן|בודק עדכון/.test(b.textContent||''))}));
            console.log('STARTUP/UPDATE',JSON.stringify(state));
            if(state.version!=='Web v1.144'||state.updating||/hksUpdate/.test(state.search)||page.url()!==before.replace(/\?.*$/,'')){
              // The loader removes the update query, so compare base URL only.
              const base=x=>x.replace(/\?.*$/,''); if(base(page.url())!==base(before))process.exit(1);
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Run MP4 AAC + WMV PCM render in WebKit
        run: |
          node <<'NODE'
          const { webkit } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const page=await browser.newPage();
            page.on('console',m=>console.log('BROWSER:',m.text()));
            page.on('pageerror',e=>console.error('PAGEERROR:',e.message));
            await page.goto('http://127.0.0.1:8080/renderer-selftest.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__RESULT__?.done===true,null,{timeout:180000});
            const result=await page.evaluate(()=>window.__RESULT__);
            console.log('RESULT',JSON.stringify(result));
            await browser.close();
            if(!result.ok || result.sw!=='hks-v144' || !result.patchCached || result.ffmpegCachedByApp || result.mp4 < 1000 || result.wmv < 1000) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
