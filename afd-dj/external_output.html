<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFD DJ External Video</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#stage{position:relative;width:100%;height:100%;background:#000}.yt{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;transition:opacity .12s linear}.msg{position:absolute;inset:0;display:grid;place-items:center;color:#777;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}</style></head><body><div id="stage"><div id="msg" class="msg">AFD DJ — External Video</div></div><script>const stage=document.getElementById('stage'),msg=document.getElementById('msg');const players={A:null,B:null};let mix=.5;const bc=new BroadcastChannel('afd-dj-video');function add(deck,id){players[deck]?.remove();const f=document.createElement('iframe');f.className='yt';f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;f.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?autoplay=1&playsinline=1&rel=0&controls=0&mute=1';stage.appendChild(f);players[deck]=f;msg.style.display='none';apply()}function apply(){if(players.A)players.A.style.opacity=String(1-mix);if(players.B)players.B.style.opacity=String(mix)}function handle(d){if(!d)return;if(d.type==='youtube-load'&&d.videoId)add(d.deck||'A',d.videoId);if(d.type==='mix'){mix=Math.max(0,Math.min(1,+d.value||0));apply()}if(d.type==='youtube'&&d.videoId)add('A',d.videoId)}bc.onmessage=e=>handle(e.data);window.addEventListener('message',e=>{if(e.origin===location.origin)handle(e.data)});</script></body></html>
