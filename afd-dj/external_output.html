<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFD DJ External Video</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#stage{width:100%;height:100%;display:grid;place-items:center;background:#000}iframe{width:100%;height:100%;border:0;background:#000}.msg{color:#888;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}</style></head><body><div id="stage"><div class="msg">AFD DJ — External Video</div></div><script>const stage=document.getElementById('stage');const bc=new BroadcastChannel('afd-dj-video');function show(d){if(!d||d.type!=='youtube'||!d.videoId)return;stage.innerHTML='';const f=document.createElement('iframe');f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;f.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(d.videoId)+'?autoplay=1&playsinline=1&rel=0';stage.appendChild(f)}bc.onmessage=e=>show(e.data);window.addEventListener('message',e=>{if(e.origin===location.origin)show(e.data)});</script></body></html>
