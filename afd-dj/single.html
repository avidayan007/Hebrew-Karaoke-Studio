ckground:#17351e}.vu i.on{background:#4af26f}.dock{margin-top:8px;border:1px solid #555e69;border-radius:7px;background:#080b10;padding:8px}.toolbar{display:flex;gap:6px;direction:ltr;flex-wrap:wrap}.toolbar button,.toolbar a,.toolbar input,.ytBar button,.ytBar input{height:34px;border:1px solid #58616d;border-radius:5px;background:#11161d;color:#fff;padding:0 10px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.toolbar input{flex:1;min-width:160px}.gold{border-color:#9a7b38!important;background:#5b4315!important;color:#ffe7a1!important}.purple{background:#3b215a!important;border-color:#865fc1!important}.blue{background:#123f5a!important;border-color:#2d8dbd!important}.library{height:180px;margin-top:7px;border:1px solid #323943;background:#05070a;overflow:auto}.row{display:grid;grid-template-columns:32px 1fr 70px 70px;gap:6px;padding:6px;border-bottom:1px solid #20262e;direction:ltr;font-size:10px}.row button{height:27px;background:#151b22;color:#fff;border:1px solid #525b66}.ytWorkspace{display:none;margin-top:8px;height:270px;border:1px solid #7755a7;border-radius:7px;background:linear-gradient(#141922,#05070a);padding:8px}.ytWorkspace:target,.ytWorkspace.on{display:grid;grid-template-rows:auto auto 1fr;gap:7px}.ytBar{display:grid;grid-template-columns:1fr 58px 1fr 58px 1fr 58px 32px;gap:5px;direction:ltr}.ytResults{overflow:auto;border:1px solid #303741;background:#030507}.ytResult{display:grid;grid-template-columns:82px 1fr 44px 44px;gap:6px;align-items:center;padding:5px;border-bottom:1px solid #20262d;direction:ltr}.ytResult img{width:82px;height:46px;object-fit:cover}.ytResult small{display:block;color:#929daa}.close{height:34px;border:1px solid #555;border-radius:5px;color:#fff;text-decoration:none;display:grid;place-items:center}@media(max-width:900px){.app{padding:4px}.console{grid-template-columns:1fr 1.05fr 1fr;gap:4px}.screen{height:180px}.masterScreen{height:225px}.pads{gap:2px}.transport button{height:40px}.jog{wid ine></video><div id="postB" class="poster">B</div></div><div class="pads" id="padsB"></div><div class="transport"><button class="cue" data-act="cue" data-d="B">CUE</button><button class="play" data-act="play" data-d="B">PLAY</button><button class="sync" data-act="sync" data-d="B">SYNC</button></div><div class="controls"><div><input id="seekB" type="range" min="0" max="1000" value="0"><input id="pitchB" type="range" min="-16" max="16" step=".1" value="0"></div><div class="jog" data-jog="B"></div></div></section></div><section class="dock"><div class="toolbar"><button id="addFiles">＋ הוסף קבצים</button><input id="libSearch" placeholder="חיפוש בספרייה"><a class="gold" href="#yt">🌐 YOUTUBE</a><a href="./external_output.html" target="_blank">EXTERNAL VIDEO</a></div><div id="library" class="library"><div style="padding:20px;text-align:center;color:#8793a0">הוסף קבצים או פתח YouTube.</div></div><div id="yt" class="ytWorkspace"><div class="ytBar"><input id="ytA" placeholder="YouTube ל‑A"><button id="goA" class="purple">חפש A</button><input id="ytB" placeholder="YouTube ל‑B"><button id="goB" class="blue">חפש B</button><input id="ytUrl" placeholder="URL"><button id="goUrl">טען</button><a href="#" class="close">×</a></div><div id="ytStatus" class="status">בחר יעד A או B.</div><div id="ytResults" class="ytResults"><div style="padding:20px;text-align:center;color:#8793a0">תוצאות YouTube יופיעו כאן.</div></div></div></section></div><script>const $=id=>document.getElementById(id),state={A:null,B:null},cues={A:Array(8).fill(null),B:Array(8).fill(null)},yt={A:null,B:null};let target='A',items=[];window.addEventListener('error',e=>{$('status').textContent='ERROR: '+e.message});function setStatus(t){$('status').textContent=t}function makePads(d){for(let i=0;i<8;i++){let b=document.createElement('button');b.className='pad';b.textContent=i+1;b.onclick=()=>hot(d,i,b);$('pads'+d).appendChild(b)}}makePads('A');makePads('B');function makeVu(id){for(let i=0;i<12;i++)$(id).appendChild(document.createElement('i'))}makeVu('vuA');makeVu('vuB');function cleanYT(d){let f=$('ytDeck'+d);if(f)f.remove();yt[d]=null}function loadLocal(d,f){cleanYT(d);if(state[d]?.url)URL.revokeObjectURL(state[d].url);let url=URL.createObjectURL(f),v=$('vid'+d),m=$('master'+d);v.src=url;m.src=url;state[d]={file:f,url,v,m};$('title'+d).textContent=f.name;let isv=f.type.startsWith('video/');v.style.display=isv?'block':'none';m.style.display=isv?'block':'none';$('post'+d).style.display=isv?'none':'grid';addRow(f);mix();setStatus('Loaded '+d+': '+f.name)}function addRow(f){let r=document.createElement('div');r.className='row';r.innerHTML='<span>•</span><b>'+f.name.replace(/[<>]/g,'')+'</b><button>LOAD A</button><button>LOAD B</button>';let bs=r.querySelectorAll('button');bs[0].onclick=()=>loadLocal('A',f);bs[1].onclick=()=>loadLocal('B',f);$('library').appendChild(r)}function ingest(fs){let a=[...fs].filter(f=>f.type.startsWith('audio/')||f.type.startsWith('video/'));if(!a.length)return;if($('library').children.length===1&&$('library').firstElementChild.style.textAlign)$('library').innerHTML='';a.forEach(addRow);if(a[0])loadLocal('A',a[0]);if(a[1])loadLocal('B',a[1])}$('loadFiles').onclick=()=>$('fileInput').click();$('addFiles').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>ingest(e.target.files);function playLocal(d,b){let s=state[d];if(!s){$('fileInput').click();return}if(s.v.paused){s.v.play().catch(()=>{});s.m.play().catch(()=>{});b.classList.add('on')}else{s.v.pause();s.m.pause();b.classList.remove('on')}}function ytCmd(d,fn,args=[]){let f=$('ytDeck'+d);try{f?.contentWindow?.postMessage(JSON.stringify({event:'command',func:fn,args}),'*')}catch(e){}}function play(d,b){if(yt[d]){yt[d].playing=!yt[d].playing;ytCmd(d,yt[d].playing?'playVideo':'pauseVideo');b.classList.toggle('on',yt[d].playing);return}playLocal(d,b)}function cue(d){if(yt[d]){ytCmd(d,'pauseVideo');ytCmd(d,'seekTo',[0,true]);yt[d].playing=false;return}let s=state[d];if(!s)return;s.v.pause();s.m.pause();s.v.currentTime=0;s.m.currentTime=0}function sync(d){let o=d==='A'?'B':'A';if(state[d]&&state[o]){state[d].v.playbackRate=state[o].v.playbackRate;state[d].m.playbackRate=state[o].v.playbackRate;$('pitch'+d).value=(state[o].v.playbackRate-1)*100}}document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{let d=b.dataset.d,a=b.dataset.act;if(a==='play')play(d,b);if(a==='cue')cue(d);if(a==='sync')sync(d)}));['A','B'].forEach(d=>{$('pitch'+d).oninput=e=>{if(state[d]){let r=1+e.target.value/100;state[d].v.playbackRate=r;state[d].m.playbackRate=r}};$('seek'+d).oninput=e=>{let s=state[d];if(s?.v.duration){s.v.currentTime=s.v.duration*e.target.value/1000;s.m.currentTime=s.v.currentTime}};document.querySelector('[data-jog="'+d+'"]').onclick=()=>{let s=state[d];if(s){s.v.currentTime=Math.max(0,s.v.currentTime-1);s.m.currentTime=s.v.currentTime}}});function hot(d,i,b){let s=state[d];if(!s)return;if(cues[d][i]==null){cues[d][i]=s.v.currentTime;b.classList.add('on')}else{s.v.currentTime=cues[d][i];s.m.currentTime=cues[d][i]}}function mix(){let x=+$('cross').value/100,gA=+$('gainA').value/100,gB=+$('gainB').value/100;if(state.A)state.A.v.volume=Math.cos(x*Math.PI/2)*gA;if(state.B)state.B.v.volume=Math.sin(x*Math.PI/2)*gB;ytCmd('A','setVolume',[Math.round(Math.cos(x*Math.PI/2)*100*gA)]);ytCmd('B','setVolume',[Math.round(Math.sin(x*Math.PI/2)*100*gB)]);$('masterA').style.opacity=1-x;$('masterB').style.opacity=x}['cross','gainA','gainB'].forEach(id=>$(id).oninput=mix);setInterval(()=>{['A','B'].forEach(d=>{let on=(state[d]&&!state[d].v.paused)||(yt[d]&&yt[d].playing);[...$('vu'+d).children].forEach((x,i)=>x.classList.toggle('on',on&&i<3+Math.floor(Math.random()*9)))})},150);function key(){return localStorage.getItem('afdYT')||''}async function searchYT(d){target=d;let q=$(d==='A'?'ytA':'ytB').value.trim(),k=key();if(!q)return $('ytStatus').textContent='כתוב מה לחפש';if(!k)return $('ytStatus').textContent='חסר YouTube API Key ב‑SETTINGS של הגרסה הקודמת';$('ytStatus').textContent='מחפש...';try{let r=await fetch('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=15&q='+encodeURIComponent(q)+'&key='+encodeURIComponent(k)),j=await r.json();if(!r.ok)throw Error(j?.error?.message||'YouTube error');items=(j.items||[]).map(x=>({id:x.id.videoId,title:x.snippet.title,channel:x.snippet.channelTitle,thumb:x.snippet.thumbnails?.medium?.url||''}));renderYT()}catch(e){$('ytStatus').textContent=e.message}}function safe(s){return String(s||'').replace(/[&<>"']/g,'')}function renderYT(){$('ytResults').innerHTML=items.map((x,i)=>'<div class="ytResult" data-i="'+i+'"><img src="'+safe(x.thumb)+'"><div><b>'+safe(x.title)+'</b><small>'+safe(x.channel)+'</small></div><button class="purple" data-d="A">A</button><button class="blue" data-d="B">B</button></div>').join('')||'<div style="padding:20px">לא נמצאו תוצאות</div>';document.querySelectorAll('.ytResult').forEach(r=>r.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>loadYT(b.dataset.d,items[+r.dataset.i])))}$('goA').onclick=()=>searchYT('A');$('goB').onclick=()=>searchYT('B');function parseId(v){try{let u=new URL(v);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1).split('/')[0];if(u.searchParams.get('v'))return u.searchParams.get('v');let m=u.pathname.match(/\/(?:shorts|embed|live)\/([^/?]+)/);return m?.[1]||''}catch(e){return /^[\w-]{11}$/.test(v)?v:''}}$('goUrl').onclick=()=>{let id=parseId($('ytUrl').value);if(!id)return $('ytStatus').textContent='URL לא תקין';loadYT(target,{id,title:'YouTube'})};function loadYT(d,x){if(state[d]){state[d].v.pause();state[d].m.pause()}let screen=$('vid'+d).parentElement;cleanYT(d);let f=document.createElement('iframe');f.id='ytDeck'+d;f.allow='autoplay; encrypted-media; picture-in-picture';f.src='https://www.youtube-nocookie.com/embed/'+x.id+'?autoplay=1&playsinline=1&controls=1&enablejsapi=1&origin='+encodeURIComponent(location.origin);screen.appendChild(f);$('vid'+d).style.display='none';$('post'+d).style.display='none';$('title'+d).textContent=x.title;yt[d]={id:x.id,title:x.title,playing:true};location.hash='';setTimeout(mix,800);setStatus('YouTube loaded to Deck '+d)}setStatus('ENGINE READY • SINGLE PAGE');</script></body></html>
