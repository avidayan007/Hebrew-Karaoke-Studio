<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#000"><title>AFD DJ 1.2 PHOTO SKIN</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{display:grid;place-items:center}#stage{position:relative;width:min(100vw,200vh);aspect-ratio:2/1;background:#000 url('./reference-skin.jpg?v=12') center/100% 100% no-repeat;overflow:hidden;box-shadow:0 0 60px #000}.hot{position:absolute;z-index:20;border:0;background:transparent;padding:0;cursor:pointer;touch-action:manipulation}.hot:active{background:#ffffff10;box-shadow:inset 0 0 20px #ffffff24}video{position:absolute;object-fit:cover;background:#000;z-index:8;display:none}#videoA{left:19.40%;top:10.42%;width:15.56%;height:17.84%}#videoM1,#videoM2{left:39.32%;top:4.95%;width:20.44%;height:24.09%}#videoB{left:63.99%;top:10.42%;width:16.67%;height:17.84%}#videoM1{z-index:9}#videoM2{z-index:10}#pick{display:none}#toast{position:absolute;left:50%;top:2.2%;transform:translateX(-50%);z-index:50;padding:7px 14px;border:1px solid #565c67;border-radius:4px;background:linear-gradient(#191c21,#060709);color:#eef2f7;font-size:11px;font-weight:800;box-shadow:0 4px 14px #000;opacity:0;transition:.18s;pointer-events:none}#toast.show{opacity:1}#fileZone{left:24%;top:54.2%;width:34.5%;height:31%}#playA{left:19.33%;top:37.15%;width:3.25%;height:4.55%}#cueA{left:16.10%;top:37.15%;width:3.15%;height:4.55%}#syncA{left:22.55%;top:37.15%;width:3.20%;height:4.55%}#playB{left:66.45%;top:37.15%;width:3.20%;height:4.55%}#cueB{left:63.22%;top:37.15%;width:3.15%;height:4.55%}#syncB{left:69.68%;top:37.15%;width:3.15%;height:4.55%}#jogA{left:25.88%;top:35.42%;width:6.2%;height:12.1%;border-radius:50%}#jogB{left:69.78%;top:35.42%;width:6.2%;height:12.1%;border-radius:50%}#cross{position:absolute;left:40.85%;top:30.3%;width:16.1%;height:2.2%;opacity:.001;z-index:30}#seekA{position:absolute;left:16.2%;top:49.4%;width:20.1%;height:1.7%;opacity:.001;z-index:30}#seekB{position:absolute;left:61.1%;top:49.4%;width:20.2%;height:1.7%;opacity:.001;z-index:30}@media(max-aspect-ratio:2/1){#stage{width:100vw}}@media(min-aspect-ratio:2/1){#stage{height:100vh;width:auto}}</style></head><body><div id="stage"><div id="toast">AFD DJ</div><video id="videoA" playsinline muted></video><video id="videoB" playsinline muted></video><video id="videoM1" playsinline muted></video><video id="videoM2" playsinline muted></video><input id="pick" type="file" accept="audio/*,video/*" multiple><button class="hot" id="fileZone" aria-label="Add local files"></button><button class="hot" id="playA"></button><button class="hot" id="cueA"></button><button class="hot" id="syncA"></button><button class="hot" id="playB"></button><button class="hot" id="cueB"></button><button class="hot" id="syncB"></button><button class="hot" id="jogA"></button><button class="hot" id="jogB"></button><input id="cross" type="range" min="0" max="100" value="50"><input id="seekA" type="range" min="0" max="1000" value="0"><input id="seekB" type="range" min="0" max="1000" value="0"></div><script>const $=id=>document.getElementById(id),pick=$('pick'),toast=$('toast'),va=$('videoA'),vb=$('videoB'),vm1=$('videoM1'),vm2=$('videoM2'),state={A:null,B:null};function msg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>toast.classList.remove('show'),1100)}$('fileZone').onclick=()=>pick.click();pick.onchange=()=>{const f=[...pick.files];if(!f.length)return;if(f[0])load('A',f[0]);if(f[1])load('B',f[1]);msg(f.length>1?'Loaded Deck A + B':'Loaded Deck A')};function load(d,f){const u=URL.createObjectURL(f),v=d==='A'?va:vb,m=d==='A'?vm1:vm2;state[d]={f,u,v,m};v.src=u;m.src=u;const isv=f.type.startsWith('video/');v.style.display=isv?'block':'none';m.style.display=isv?'block':'none';syncMaster()}function play(d){const s=state[d];if(!s){pick.click();return}if(s.v.paused){s.v.play().catch(()=>{});s.m.play().catch(()=>{});msg('Deck '+d+' PLAY')}else{s.v.pause();s.m.pause();msg('Deck '+d+' PAUSE')}}function cue(d){const s=state[d];if(!s)return;s.v.pause();s.m.pause();s.v.currentTime=0;s.m.currentTime=0;msg('Deck '+d+' CUE')}function syncMaster(){const x=+$('cross').value/100;vm1.style.opacity=1-x;vm2.style.opacity=x}$('playA').onclick=()=>play('A');$('playB').onclick=()=>play('B');$('cueA').onclick=()=>cue('A');$('cueB').onclick=()=>cue('B');$('syncA').onclick=()=>msg('Deck A SYNC');$('syncB').onclick=()=>msg('Deck B SYNC');$('jogA').onclick=()=>msg('Deck A JOG');$('jogB').onclick=()=>msg('Deck B JOG');$('cross').oninput=syncMaster;$('seekA').oninput=e=>{const s=state.A;if(s&&s.v.duration)s.v.currentTime=s.v.duration*(e.target.value/1000)};$('seekB').oninput=e=>{const s=state.B;if(s&&s.v.duration)s.v.currentTime=s.v.duration*(e.target.value/1000)};[va,vb].forEach((v,i)=>v.ontimeupdate=()=>{const m=i?vm2:vm1;if(Math.abs((m.currentTime||0)-(v.currentTime||0))>.35)try{m.currentTime=v.currentTime}catch(e){}});syncMaster();</script></body></html>
