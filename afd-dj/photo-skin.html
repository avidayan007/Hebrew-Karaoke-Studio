ss="rng vertical" id="pitchA" type="range" min="-16" max="16" value="0" step=".1"><input class="rng vertical" id="pitchB" type="range" min="-16" max="16" value="0" step=".1"><input class="rng vertical" id="gainA" type="range" min="0" max="100" value="100"><input class="rng vertical" id="gainB" type="range" min="0" max="100" value="100"><div id="pads"></div></div><script>const $=id=>document.getElementById(id),pick=$('pick'),toast=$('toast'),va=$('videoA'),vb=$('videoB'),vm1=$('videoM1'),vm2=$('videoM2'),state={A:null,B:null},cues={A:Array(8).fill(null),B:Array(8).fill(null)};function msg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>toast.classList.remove('show'),1000)}$('fileZone').onclick=()=>pick.click();pick.onchange=()=>{const f=[...pick.files];if(!f.length)return;if(f[0])load('A',f[0]);if(f[1])load('B',f[1]);msg(f.length>1?'Deck A + B loaded':'Deck A loaded')};function load(d,f){const u=URL.createObjectURL(f),v=d==='A'?va:vb,m=d==='A'?vm1:vm2;state[d]={f,u,v,m};v.src=u;m.src=u;const isv=f.type.startsWith('video/');v.style.display=isv?'block':'none';m.style.display=isv?'block':'none';v.volume=d==='A'?+$('gainA').value/100:+$('gainB').value/100;syncMaster()}function play(d){const s=state[d];if(!s){pick.click();return}if(s.v.paused){s.v.play().catch(()=>{});s.m.play().catch(()=>{});$('play'+d).classList.add('on');msg('Deck '+d+' PLAY')}else{s.v.pause();s.m.pause();$('play'+d).classList.remove('on');msg('Deck '+d+' PAUSE')}}function cue(d){const s=state[d];if(!s)return;s.v.pause();s.m.pause();s.v.currentTime=0;s.m.currentTime=0;$('play'+d).classList.remove('on');msg('Deck '+d+' CUE')}function syncMaster(){const x=+$('cross').value/100;vm1.style.opacity=1-x;vm2.style.opacity=x;va.volume=(1-x)*(+$('gainA').value/100);vb.volume=x*(+$('gainB').value/100)}function rate(d){const s=state[d];if(!s)return;const p=+$('pitch'+d).value;s.v.playbackRate=1+p/100;s.m.playbackRate=s.v.playbackRate;msg('Deck '+d+' Pitch '+(p>=0?'+':'')+p.toFixed(1)+'%')}function sync(d){const other=d==='A'?'B':'A',a=state[d],b=state[other];if(!a||!b){msg('Load both decks for SYNC');return}a.v.playbackRate=b.v.playbackRate;a.m.playbackRate=b.v.playbackRate;$('pitch'+d).value=(b.v.playbackRate-1)*100;msg('Deck '+d+' SYNC')}['A','B'].forEach(d=>{$('play'+d).onclick=()=>play(d);$('cue'+d).onclick=()=>cue(d);$('sync'+d).onclick=()=>sync(d);$('jog'+d).onclick=()=>{const s=state[d];if(s)s.v.currentTime=Math.max(0,s.v.currentTime-1);msg('Deck '+d+' JOG -1s')};$('pitch'+d).oninput=()=>rate(d);$('gain'+d).oninput=syncMaster});$('cross').oninput=syncMaster;$('seekA').oninput=e=>{const s=state.A;if(s&&s.v.duration)s.v.currentTime=s.v.duration*(e.target.value/1000)};$('seekB').oninput=e=>{const s=state.B;if(s&&s.v.duration)s.v.currentTime=s.v.duration*(e.target.value/1000)};[va,vb].forEach((v,i)=>v.ontimeupdate=()=>{const d=i?'B':'A',m=i?vm2:vm1,seek=$('seek'+d);if(v.duration)seek.value=v.currentTime/v.duration*1000;if(Math.abs((m.currentTime||0)-(v.currentTime||0))>.3)try{m.currentTime=v.currentTime}catch(e){}});const pc=$('pads');['A','B'].forEach(d=>{for(let i=0;i<8;i++){const b=document.createElement('button');b.className='hot pad p'+d.toLowerCase()+(i+1);b.onclick=()=>{const s=state[d];if(!s)return;if(cues[d][i]==null){cues[d][i]=s.v.currentTime;b.classList.add('on');msg('Hot Cue '+(i+1)+' saved')}else{s.v.currentTime=cues[d][i];s.m.currentTime=cues[d][i];msg('Hot Cue '+(i+1))}};b.ondblclick=()=>{cues[d][i]=null;b.classList.remove('on');msg('Hot Cue '+(i+1)+' cleared')};pc.appendChild(b)}});syncMaster();</script></body></html>
