<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050609"><title>AFD DJ YouTube</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050609;color:#eef2f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:8px;padding:10px;background:radial-gradient(circle at 50% -20%,#2d263d,#0b0e13 45%,#030405)}.top{display:flex;gap:7px;align-items:center;direction:ltr}.top b{font-size:14px;color:#d4b1ff;white-space:nowrap}.top input{flex:1;min-width:0;height:38px;border:1px solid #4a5360;border-radius:6px;background:#080a0e;color:white;padding:0 11px}.top button,.item button{height:38px;border:1px solid #7d5bb4;border-radius:6px;background:linear-gradient(#68449a,#2d1a48 62%,#130b20);color:#fff;font-weight:800}.close{border-color:#626b77!important;background:linear-gradient(#454d57,#1b2026 62%,#090b0e)!important}.grid{min-height:0;display:grid;grid-template-columns:minmax(310px,.95fr) minmax(420px,1.55fr);gap:9px;direction:ltr}.results{min-height:0;overflow:auto;border:1px solid #3d4550;border-radius:7px;background:#080b0f}.msg{padding:18px;text-align:center;color:#8e99a6;font-size:12px}.item{display:grid;grid-template-columns:110px 1fr 72px;gap:8px;padding:8px;border-bottom:1px solid #20262e;align-items:center;direction:ltr}.item:hover{background:#111722}.thumb{width:110px;height:62px;object-fit:cover;border-radius:4px;background:#111}.meta{min-width:0}.meta b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta small{display:block;margin-top:5px;color:#8d98a5;font-size:9px}.playerWrap{min-height:0;display:flex;flex-direction:column;border:1px solid #59616d;border-radius:7px;background:linear-gradient(#151a21,#07090d);overflow:hidden}.playerHead{height:38px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid #333b45;direction:ltr}.playerHead b{font-size:11px}.playerHead span{margin-left:auto;font-size:9px;color:#a8b1bc}.player{flex:1;min-height:300px;background:#000;display:grid;place-items:center}.player iframe{width:100%;height:100%;min-height:300px;border:0}.empty{color:#6f7a87;font-size:13px;text-align:center;padding:20px}.hint{padding:8px 10px;border-top:1px solid #333b45;color:#929daa;font-size:9px;line-height:1.45}@media(max-width:760px){.app{padding:6px}.top{flex-wrap:wrap}.top b{width:100%}.top input{min-width:180px}.grid{grid-template-columns:1fr;grid-template-rows:44% 56%}.item{grid-template-columns:84px 1fr 66px}.thumb{width:84px;height:48px}.player iframe,.player{min-height:240px}}</style></head><body><div class="app"><div class="top"><b>AFD DJ • YOUTUBE</b><input id="q" placeholder="חפש שיר, אמן או קליפ ב‑YouTube"><button id="search">חיפוש</button><button id="close" class="close">סגור</button></div><div class="grid"><section id="results" class="results"><div class="msg">כתוב חיפוש ולחץ חיפוש. ה־API Key נשמר ב‑SETTINGS של AFD DJ.</div></section><section class="playerWrap"><div class="playerHead"><b id="now">YOUTUBE PLAYER</b><span>Official embedded player</span></div><div id="player" class="player"><div class="empty">בחר תוצאה כדי לנגן בתוך AFD DJ</div></div><div class="hint">הניגון נשאר בתוך AFD DJ דרך נגן YouTube הרשמי. הזרם לא מומר לקובץ מקומי ולא עובר דרך מנוע ה‑EQ/FX של הקבצים המקומיים.</div></section></div></div><script>const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let sessionKey='';function key(){return sessionKey||localStorage.getItem('afdYT')||''}window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data||{};if(d.type==='afd-youtube-init'){if(d.key){sessionKey=String(d.key);try{localStorage.setItem('afdYT',sessionKey)}catch(_){}}if(d.query){$('q').value=String(d.query)}if(d.autoSearch&&$('q').value.trim())searchYT()}});async function searchYT(){const q=$('q').value.trim();if(!q)return;const k=key();if(!k){$('results').innerHTML='<div class="msg">חסר YouTube API Key. חזור ל‑AFD DJ → SETTINGS → YouTube API Key ושמור.</div>';return}$('results').innerHTML='<div class="msg">מחפש ב‑YouTube...</div>';try{const u='https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=20&safeSearch=moderate&q='+encodeURIComponent(q)+'&key='+encodeURIComponent(k);const r=await fetch(u);const j=await r.json();if(!r.ok)throw new Error(j?.error?.message||'YouTube API error');const items=j.items||[];$('results').innerHTML=items.length?items.map(x=>{const id=x.id.videoId,s=x.snippet,t=s.thumbnails?.medium?.url||s.thumbnails?.default?.url||'';return '<div class="item"><img class="thumb" src="'+esc(t)+'" alt=""><div class="meta"><b>'+esc(s.title)+'</b><small>'+esc(s.channelTitle)+'</small></div><button data-id="'+esc(id)+'" data-title="'+esc(s.title)+'">▶ PLAY</button></div>'}).join(''):'<div class="msg">לא נמצאו תוצאות.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>play(b.dataset.id,b.dataset.title))}catch(e){$('results').innerHTML='<div class="msg">שגיאת YouTube: '+esc(e.message)+'</div>'}}function play(id,title){$('now').textContent=title||'YouTube';$('player').innerHTML='<iframe allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen playsinline src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?autoplay=1&playsinline=1&rel=0"></iframe>'}function closeMe(){try{parent.postMessage({type:'afd-close-youtube'},location.origin)}catch(e){}}$('search').onclick=searchYT;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')searchYT()});$('close').onclick=closeMe;try{parent.postMessage({type:'afd-youtube-ready'},location.origin)}catch(e){}</script></body></html>
