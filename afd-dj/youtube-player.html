<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050609"><title>AFD DJ YouTube</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050609;color:#eef2f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:8px;padding:10px;background:radial-gradient(circle at 50% -20%,#2d263d,#0b0e13 45%,#030405)}.top{display:flex;gap:7px;align-items:center;direction:ltr}.top b{font-size:14px;color:#d4b1ff;white-space:nowrap}.top input{flex:1;min-width:0;height:38px;border:1px solid #4a5360;border-radius:6px;background:#080a0e;color:white;padding:0 11px}.top button,.item button{height:38px;border:1px solid #7d5bb4;border-radius:6px;background:linear-gradient(#68449a,#2d1a48 62%,#130b20);color:#fff;font-weight:800}.close{border-color:#626b77!important;background:linear-gradient(#454d57,#1b2026 62%,#090b0e)!important}.grid{min-height:0;display:grid;grid-template-columns:minmax(310px,.95fr) minmax(420px,1.55fr);gap:9px;direction:ltr}.results{min-height:0;overflow:auto;border:1px solid #3d4550;border-radius:7px;background:#080b0f}.msg{padding:18px;text-align:center;color:#8e99a6;font-size:12px}.item{display:grid;grid-template-columns:110px 1fr 92px;gap:8px;padding:8px;border-bottom:1px solid #20262e;align-items:center;direction:ltr}.thumb{width:110px;height:62px;object-fit:cover;border-radius:4px;background:#111}.meta{min-width:0}.meta b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta small{display:block;margin-top:5px;color:#8d98a5;font-size:9px}.playerWrap{min-height:0;display:flex;flex-direction:column;border:1px solid #59616d;border-radius:7px;background:linear-gradient(#151a21,#07090d);overflow:hidden}.playerHead{height:38px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid #333b45;direction:ltr}.playerHead b{font-size:11px}.playerHead span{margin-left:auto;font-size:9px;color:#a8b1bc}.player{flex:1;min-height:300px;background:#000;display:grid;place-items:center}.player iframe{width:100%;height:100%;min-height:300px;border:0}.empty{color:#6f7a87;font-size:13px;text-align:center;padding:20px}.hint{padding:8px 10px;border-top:1px solid #333b45;color:#929daa;font-size:9px}@media(max-width:760px){.app{padding:6px}.top{flex-wrap:wrap}.top b{width:100%}.grid{grid-template-columns:1fr;grid-template-rows:44% 56%}.item{grid-template-columns:84px 1fr 86px}.thumb{width:84px;height:48px}.player iframe,.player{min-height:240px}}</style></head><body><div class="app"><div class="top"><b>AFD DJ • YOUTUBE</b><input id="q" placeholder="חפש שיר, אמן או קליפ ב‑YouTube"><button id="search">חיפוש</button><button id="close" class="close">סגור</button></div><div class="grid"><section id="results" class="results"><div class="msg">כתוב חיפוש ולחץ חיפוש.</div></section><section class="playerWrap"><div class="playerHead"><b id="now">YOUTUBE PLAYER</b><span>Official embedded player</span></div><div id="player" class="player"><div class="empty">בחר תוצאה — היא תיטען ל‑Deck A ול‑Master Video</div></div><div class="hint">אחרי LOAD A תחזור אוטומטית למסך הראשי. הקליפ יופיע גם ב‑Deck A וגם ב‑MASTER VIDEO.</div></section></div></div><script>const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let sessionKey='';function key(){return sessionKey||localStorage.getItem('afdYT')||''}addEventListener('message',e=>{if(e.origin!==location.origin)return;let d=e.data||{};if(d.type==='afd-youtube-init'){if(d.key){sessionKey=String(d.key);try{localStorage.setItem('afdYT',sessionKey)}catch(_){}}if(d.query)$('q').value=String(d.query);if(d.autoSearch&&$('q').value.trim())searchYT()}});async function searchYT(){const q=$('q').value.trim(),k=key();if(!q)return;if(!k){$('results').innerHTML='<div class="msg">חסר YouTube API Key. חזור ל‑SETTINGS ושמור.</div>';return}$('results').innerHTML='<div class="msg">מחפש ב‑YouTube...</div>';try{let r=await fetch('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=20&safeSearch=moderate&q='+encodeURIComponent(q)+'&key='+encodeURIComponent(k)),j=await r.json();if(!r.ok)throw new Error(j?.error?.message||'YouTube API error');let a=j.items||[];$('results').innerHTML=a.length?a.map(x=>{let id=x.id.videoId,s=x.snippet,t=s.thumbnails?.medium?.url||s.thumbnails?.default?.url||'';return '<div class="item"><img class="thumb" src="'+esc(t)+'"><div class="meta"><b>'+esc(s.title)+'</b><small>'+esc(s.channelTitle)+'</small></div><button data-id="'+esc(id)+'" data-title="'+esc(s.title)+'">LOAD A ▶</button></div>'}).join(''):'<div class="msg">לא נמצאו תוצאות.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>play(b.dataset.id,b.dataset.title))}catch(e){$('results').innerHTML='<div class="msg">שגיאת YouTube: '+esc(e.message)+'</div>'}}function embedSrc(id,mute,controls){return 'https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?autoplay=1&playsinline=1&rel=0&enablejsapi=1&controls='+(controls?1:0)+(mute?'&mute=1':'')}function installOnMain(id,title){try{const p=parent,cf=p.document.getElementById('console'),d=cf&&cf.contentDocument;if(!d)return false;const v=d.getElementById('vidA'),ms=d.getElementById('masterA');if(!v||!ms)return false;const ds=v.parentElement,master=ms.parentElement;['afdYoutubeDeckA','afdYoutubeMaster'].forEach(x=>{const old=d.getElementById(x);if(old)old.remove()});function frame(fid,src,pass){const f=d.createElement('iframe');f.id=fid;f.src=src;f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;f.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;z-index:50';if(!pass)f.style.pointerEvents='none';return f}ds.style.position='relative';master.style.position='relative';ds.appendChild(frame('afdYoutubeDeckA',embedSrc(id,false,true),true));master.appendChild(frame('afdYoutubeMaster',embedSrc(id,true,false),false));const t=d.getElementById('titleA');if(t)t.textContent=title||'YouTube';const post=d.getElementById('postA');if(post)post.style.display='none';const logo=d.getElementById('masterLogo');if(logo)logo.style.display='none';const time=d.getElementById('timeA');if(time)time.textContent='YOUTUBE';const rem=d.getElementById('remainA');if(rem)rem.textContent='▶ LIVE';try{const bc=new BroadcastChannel('afd-dj-video');bc.postMessage({type:'youtube',videoId:id,title:title||'YouTube'});setTimeout(()=>bc.close(),300)}catch(e){}const o=p.document.getElementById('afdYTOverlay'),sf=p.document.getElementById('afdYTFrame');if(o)o.classList.remove('on');setTimeout(()=>{if(sf)sf.src='about:blank'},150);return true}catch(e){return false}}function play(id,title){$('now').textContent=title||'YouTube';$('player').innerHTML='<iframe allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen playsinline src="'+embedSrc(id,false,true)+'"></iframe>';if(!installOnMain(id,title)){parent.postMessage({type:'afd-youtube-load',videoId:id,title:title||'YouTube',deck:'A'},location.origin)}}function closeMe(){parent.postMessage({type:'afd-close-youtube'},location.origin)}$('search').onclick=searchYT;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')searchYT()});$('close').onclick=closeMe;parent.postMessage({type:'afd-youtube-ready'},location.origin);</script></body></html>
