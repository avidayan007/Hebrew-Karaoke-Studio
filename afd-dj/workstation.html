<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes,maximum-scale=5"><meta name="theme-color" content="#020304"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="AFD DJ"><title>AFD DJ Workstation v30</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#020304;color:#eef2f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow-x:hidden}.wrap{width:100%;background:#020304}.consoleFrame{width:100%;height:720px;border:0;display:block}.dock{width:100%;border-top:1px solid #68717d;background:linear-gradient(#171c23,#080b10 45%,#030507);padding:8px}.toolbar,.tabs,.tools{display:flex;gap:6px;align-items:center;direction:ltr;flex-wrap:wrap}.toolbar button,.tabBtn,.tools button{height:34px;border:1px solid #626b77;border-radius:5px;background:linear-gradient(#3d454f,#171b21 58%,#090b0e);color:#fff;font-size:10px;font-weight:800;padding:0 12px}.primary{border-color:#8d5ed0!important;background:linear-gradient(#6d46a0,#2c1947 62%,#12091e)!important}.gold{border-color:#9a7b38!important;background:linear-gradient(#8b6b25,#3d2c0c 65%,#171006)!important;color:#ffe7a1!important}.search{flex:1;min-width:180px;height:34px;border:1px solid #414954;border-radius:5px;background:#05070a;color:#fff;padding:0 10px}.tabs{margin-top:8px}.tabBtn.active{border-color:#8f5cff;background:linear-gradient(#754db0,#321d51)}.view{margin-top:7px;height:250px;border:1px solid #3e4650;border-radius:5px;overflow:hidden;background:#05070a}.localGrid{height:100%;display:grid;grid-template-columns:210px 1fr;direction:ltr}.folders{border-right:1px solid #303741;padding:8px;overflow:auto;font-size:10px}.folder{padding:7px;border-radius:4px;margin-bottom:3px;background:#0b0e13}.folder.active{background:#342052;color:#eadcff}.tracks{overflow:auto}.head,.row{display:grid;grid-template-columns:34px minmax(230px,1fr) 110px 65px 68px 68px 44px;gap:5px;align-items:center;direction:ltr}.head{background:#1a2028;color:#8e99a6;font-size:8px;padding:6px 8px}.row{padding:6px 8px;border-bottom:1px solid #1d2229;font-size:9px}.row button{height:25px;background:#171c22;color:#fff}.empty{height:100%;display:grid;place-items:center;color:#7e8996}.onlineView,.automixView,.settingsView{height:100%;display:none;padding:10px;gap:10px;direction:ltr}.onlineView{grid-template-columns:repeat(3,1fr)}.card{border:1px solid #4c5560;border-radius:7px;background:#0b0e13;padding:12px;display:flex;flex-direction:column;gap:8px}.card input,.card button,.settingsView input{height:34px;border:1px solid #414a55;border-radius:4px;background:#090c10;color:#fff;padding:0 9px}.tools{margin-top:7px;padding-top:7px;border-top:1px solid #303741}.status{margin-left:auto;font-size:9px;color:#9ba6b2}.hidden{display:none!important}.automixView{grid-template-columns:1fr 1fr}.settingsView{grid-template-columns:repeat(3,1fr)}@media(max-width:900px){.consoleFrame{height:690px}.onlineView,.settingsView,.automixView{grid-template-columns:1fr;overflow:auto}}</style></head><body><div class="wrap"><iframe id="console" class="consoleFrame" src="./ultra.html?v=30" allow="autoplay; fullscreen"></iframe><section class="dock"><div class="toolbar"><button id="folderBtn" class="primary">📁 פתח תיקייה</button><button id="filesBtn">＋ הוסף קבצים</button><button id="favBtn">★ מועדפים</button><button id="playlistBtn">＋ PLAYLIST</button><input id="search" class="search" placeholder="חיפוש בשירים / וידאו..."><button id="onlineTop" class="gold">🌐 ONLINE MUSIC</button></div><input id="folderInput" type="file" webkitdirectory directory multiple accept="audio/*,video/*" class="hidden"><input id="filesInput" type="file" multiple accept="audio/*,video/*" class="hidden"><div class="tabs"><button class="tabBtn active" data-view="local">LOCAL LIBRARY</button><button class="tabBtn" data-view="automix">AUTOMIX</button><button class="tabBtn" data-view="online">ONLINE MUSIC</button><button class="tabBtn" data-view="settings">SETTINGS</button></div><div class="view"><div id="local" class="localGrid"><aside class="folders"><b>תיקיות</b><div class="folder active" data-filter="all">כל המדיה</div><div class="folder" data-filter="favorites">★ מועדפים</div><div id="folderList"></div></aside><main class="tracks"><div class="head"><span>#</span><span>שם</span><span>תיקייה</span><span>סוג</span><span>A</span><span>B</span><span>★</span></div><div id="rows"><div class="empty">פתח תיקייה או הוסף קבצים.</div></div></main></div><div id="automix" class="automixView"><div class="card"><h3>AUTOMIX QUEUE</h3><div id="queue"></div></div><div class="card"><h3>Automix</h3><label>Fade seconds <input id="fade" type="number" value="6"></label><button id="autoStart">▶ START</button><button id="autoStop">■ STOP</button></div></div><div id="online" class="onlineView"><article class="card"><h3>YouTube</h3><input id="ytSearch" placeholder="חפש ב‑YouTube"><button id="ytBtn" type="button">פתח משטח חיפוש YouTube</button><small>החיפוש נפתח בתוך AFD DJ למטה.</small></article><article class="card"><h3>Spotify</h3><input id="spSearch"><button id="spBtn">Spotify</button></article><article class="card"><h3>Apple Music</h3><input id="amSearch"><button id="amBtn">Apple Music</button></article></div><div id="settings" class="settingsView"><div class="card"><label>YouTube API Key</label><input id="ytKey"><button id="saveSettings">שמור</button></div><div class="card"><label>Spotify Client ID</label><input id="spId"><button id="saveSettings2">שמור</button></div><div class="card"><label>Apple Music Developer Token</label><input id="amToken"><button id="saveSettings3">שמור</button></div></div></div><div class="tools"><button id="loopA">LOOP 8 A</button><button id="loopB">LOOP 8 B</button><button id="syncA">SYNC A→B</button><button id="syncB">SYNC B→A</button><button id="external">▣ EXTERNAL VIDEO</button><button id="clearBtn">נקה ספרייה</button><span id="status" class="status">AFD DJ READY</span></div></section></div><script>const $=id=>document.getElementById(id),views=['local','automix','online','settings'];let library=[],queue=[];const cw=()=>$('console').contentWindow;function viewsShow(v){views.forEach(x=>$(x).style.display=x===v?'grid':'none');document.querySelectorAll('.tabBtn').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}document.querySelectorAll('.tabBtn').forEach(b=>b.onclick=()=>viewsShow(b.dataset.view));$('onlineTop').onclick=()=>viewsShow('online');function esc(s){return String(s||'').replace(/[<>&"]/g,'')}function ingest(fs){[...fs].forEach(f=>{if(f.type.startsWith('audio/')||f.type.startsWith('video/'))library.push(f)});render()}function render(){let q=$('search').value.toLowerCase(),a=library.filter(f=>!q||f.name.toLowerCase().includes(q));$('rows').innerHTML=a.length?a.map((f,i)=>'<div class="row"><span>'+i+'</span><b>'+esc(f.name)+'</b><span>Files</span><span>MEDIA</span><button data-a="'+i+'">LOAD A</button><button data-b="'+i+'">LOAD B</button><span>★</span></div>').join(''):'<div class="empty">אין פריטים להצגה.</div>';document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>loadDeck('A',a[+b.dataset.a]));document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>loadDeck('B',a[+b.dataset.b]))}function loadDeck(d,f){try{cw().load(d,f)}catch(e){}}$('folderBtn').onclick=()=>$('folderInput').click();$('filesBtn').onclick=()=>$('filesInput').click();$('folderInput').onchange=e=>ingest(e.target.files);$('filesInput').onchange=e=>ingest(e.target.files);$('search').oninput=render;$('clearBtn').onclick=()=>{library=[];render()};function save(){localStorage.setItem('afdYT',$('ytKey').value);localStorage.setItem('afdSP',$('spId').value);localStorage.setItem('afdAM',$('amToken').value);$('status').textContent='Settings saved'}['saveSettings','saveSettings2','saveSettings3'].forEach(id=>$(id).onclick=save);$('ytKey').value=localStorage.getItem('afdYT')||'';$('spId').value=localStorage.getItem('afdSP')||'';$('amToken').value=localStorage.getItem('afdAM')||'';$('ytBtn').onclick=function(e){e.preventDefault();e.stopPropagation();let p=$('afdYTWorkspace');if(p){p.classList.add('on');let a=$('afdYTA'),q=$('ytSearch');if(a&&q&&q.value)a.value=q.value;a?.focus()}else{$('status').textContent='טוען משטח YouTube...';setTimeout(()=>$('ytBtn').click(),250)}};$('spBtn').onclick=()=>window.open('https://open.spotify.com/search/'+encodeURIComponent($('spSearch').value),'_blank');$('amBtn').onclick=()=>window.open('https://music.apple.com/us/search?term='+encodeURIComponent($('amSearch').value),'_blank');$('external').onclick=()=>window.open('./external_output.html','afdExternal','width=1280,height=720');$('loopA').onclick=()=>{};$('loopB').onclick=()=>{};$('syncA').onclick=()=>{try{cw().sync('A')}catch(e){}};$('syncB').onclick=()=>{try{cw().sync('B')}catch(e){}};viewsShow('local');render();</script></body></html>
