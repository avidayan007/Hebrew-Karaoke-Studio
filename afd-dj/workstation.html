<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020304"><meta name="apple-mobile-web-app-capable" content="yes"><title>AFD DJ Workstation v32</title><style>*{box-sizing:border-box}html,body{margin:0;background:#020304;color:#eef2f6;font-family:Arial,sans-serif}.consoleFrame{width:100%;height:720px;border:0;display:block}.dock{padding:8px;background:#080b10;border-top:1px solid #59616c}.toolbar,.tabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;direction:ltr}button,input{height:34px;border:1px solid #555f6b;border-radius:5px;background:#11161d;color:#fff;padding:0 10px}.gold{border-color:#9a7b38;background:#5b4315;color:#ffe7a1}.search{flex:1;min-width:170px}.tabs{margin-top:7px}.view{height:250px;margin-top:7px;border:1px solid #343c46;background:#05070a;overflow:auto}.pane{display:none;height:100%;padding:10px}.pane.on{display:block}.local{display:block}.ytWorkspace{display:none;margin-top:8px;height:290px;border:1px solid #7755a7;border-radius:7px;background:linear-gradient(#141922,#05070a);padding:8px;direction:ltr}.ytWorkspace.on{display:grid;grid-template-rows:auto auto 1fr;gap:7px}.ytBar{display:grid;grid-template-columns:1fr 62px 1fr 62px 1fr 62px 34px;gap:5px}.ytBar input{min-width:0}.purple{background:#3b215a;border-color:#865fc1}.blue{background:#123f5a;border-color:#2d8dbd}.ytResults{overflow:auto;border:1px solid #303741;background:#030507}.ytResult{display:grid;grid-template-columns:90px 1fr 48px 48px;gap:7px;align-items:center;padding:6px;border-bottom:1px solid #222933;cursor:pointer}.ytResult img{width:90px;height:50px;object-fit:cover}.ytResult b{font-size:10px}.ytResult small{display:block;color:#929daa}.status{font-size:10px;color:#aab4c0}.settings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{border:1px solid #39424c;padding:10px;border-radius:6px;background:#0c1015}.localRows{padding:12px;color:#8793a0}@media(max-width:850px){.consoleFrame{height:690px}.ytWorkspace{height:270px}.ytBar{grid-template-columns:1fr 55px 1fr 55px}.settings{grid-template-columns:1fr}.ytResult{grid-template-columns:70px 1fr 42px 42px}.ytResult img{width:70px;height:42px}}</style></head><body><iframe id="console" class="consoleFrame" src="./ultra.html?v=32" allow="autoplay; fullscreen"></iframe><section class="dock"><div class="toolbar"><button id="folderBtn">📁 פתח תיקייה</button><button id="filesBtn">＋ הוסף קבצים</button><input id="search" class="search" placeholder="חיפוש בספרייה"><button id="onlineTop" class="gold">🌐 ONLINE MUSIC</button></div><div class="tabs"><button data-tab="local">LOCAL LIBRARY</button><button data-tab="online">ONLINE MUSIC</button><button data-tab="settings">SETTINGS</button></div><div class="view"><div id="local" class="pane on local"><div class="localRows">הספרייה המקומית</div></div><div id="online" class="pane"><div class="card"><b>YouTube</b><br><br><input id="ytSearch" style="width:60%" placeholder="חפש ב‑YouTube"><button id="ytBtn" class="purple">פתח חיפוש למטה</button><div style="margin-top:8px;font-size:11px;color:#9ba6b2">החיפוש נשאר בתוך AFD DJ.</div></div></div><div id="settings" class="pane"><div class="settings"><div class="card">YouTube API Key<br><input id="ytKey" style="width:100%;margin-top:7px"><button id="save">שמור</button></div><div class="card">Spotify Client ID<br><input id="spId" style="width:100%;margin-top:7px"></div><div class="card">Apple Music Token<br><input id="amToken" style="width:100%;margin-top:7px"></div></div></div></div><div id="afdYTWorkspace" class="ytWorkspace"><div class="ytBar"><input id="afdYTA" placeholder="חיפוש YouTube ל‑A"><button id="goA" class="purple">חפש A</button><input id="afdYTB" placeholder="חיפוש YouTube ל‑B"><button id="goB" class="blue">חפש B</button><input id="afdYTUrl" placeholder="הדבק URL של YouTube"><button id="goUrl">טען URL</button><button id="closeYT">×</button></div><div id="ytStatus" class="status">בחר A או B. לחיצה כפולה על תוצאה טוענת לדק שנבחר.</div><div id="ytResults" class="ytResults"><div style="padding:25px;text-align:center;color:#8793a0">כאן יופיעו תוצאות החיפוש.</div></div></div></section><input id="folderInput" type="file" webkitdirectory multiple accept="audio/*,video/*" hidden><input id="filesInput" type="file" multiple accept="audio/*,video/*" hidden><script>const $=x=>document.getElementById(x);let target='A',items=[];function tab(n){['local','online','settings'].forEach(x=>$(x).classList.toggle('on',x===n))}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('onlineTop').onclick=()=>tab('online');$('folderBtn').onclick=()=>$('folderInput').click();$('filesBtn').onclick=()=>$('filesInput').click();$('ytKey').value=localStorage.getItem('afdYT')||'';$('spId').value=localStorage.getItem('afdSP')||'';$('amToken').value=localStorage.getItem('afdAM')||'';$('save').onclick=()=>{localStorage.setItem('afdYT',$('ytKey').value);$('ytStatus').textContent='API Key נשמר'};function openYT(){let q=$('ytSearch').value;$('afdYTWorkspace').classList.add('on');if(q&&!$('afdYTA').value)$('afdYTA').value=q;$('afdYTWorkspace').scrollIntoView({behavior:'smooth',block:'end'});setTimeout(()=>$('afdYTA').focus(),100)}$('ytBtn').onclick=openYT;$('closeYT').onclick=()=>$('afdYTWorkspace').classList.remove('on');async function searchYT(d){target=d;let q=$('afdYT'+d).value.trim(),k=localStorage.getItem('afdYT')||'';if(!q)return $('ytStatus').textContent='כתוב מה לחפש';if(!k)return $('ytStatus').textContent='חסר YouTube API Key ב‑SETTINGS';$('ytStatus').textContent='מחפש...';try{let r=await fetch('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=18&q='+encodeURIComponent(q)+'&key='+encodeURIComponent(k));let j=await r.json();if(!r.ok)throw Error(j?.error?.message||'YouTube error');items=(j.items||[]).map(x=>({id:x.id.videoId,title:x.snippet.title,channel:x.snippet.channelTitle,thumb:x.snippet.thumbnails?.medium?.url||''}));renderYT();$('ytStatus').textContent='יעד: Deck '+d+' — לחץ A/B או פעמיים על התוצאה'}catch(e){$('ytStatus').textContent=e.message}}function esc(s){return String(s||'').replace(/[&<>"']/g,'')}function renderYT(){$('ytResults').innerHTML=items.map((x,i)=>'<div class="ytResult" data-i="'+i+'"><img src="'+esc(x.thumb)+'"><div><b>'+esc(x.title)+'</b><small>'+esc(x.channel)+'</small></div><button class="purple" data-load="A">A</button><button class="blue" data-load="B">B</button></div>').join('')||'<div style="padding:20px">לא נמצאו תוצאות</div>';document.querySelectorAll('.ytResult').forEach(r=>{r.ondblclick=e=>{if(!e.target.closest('button'))loadYT(target,items[+r.dataset.i])};r.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>loadYT(b.dataset.load,items[+r.dataset.i]))})}$('goA').onclick=()=>searchYT('A');$('goB').onclick=()=>searchYT('B');$('afdYTA').onkeydown=e=>{if(e.key==='Enter')searchYT('A')};$('afdYTB').onkeydown=e=>{if(e.key==='Enter')searchYT('B')};function parseId(v){try{let u=new URL(v);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1);if(u.searchParams.get('v'))return u.searchParams.get('v');let m=u.pathname.match(/\/(?:shorts|embed|live)\/([^/?]+)/);return m?.[1]||''}catch(e){return /^[\w-]{11}$/.test(v)?v:''}}$('goUrl').onclick=()=>{let id=parseId($('afdYTUrl').value);if(!id)return $('ytStatus').textContent='URL לא תקין';loadYT(target,{id,title:'YouTube',channel:'YouTube'})};function loadYT(d,x){let doc=$('console').contentDocument;if(!doc)return;let media=doc.getElementById('vid'+d),screen=media?.parentElement;if(!screen)return $('ytStatus').textContent='Deck לא מוכן';doc.getElementById('ytDeck'+d)?.remove();let f=doc.createElement('iframe');f.id='ytDeck'+d;f.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:0;z-index:20;background:#000';f.allow='autoplay; encrypted-media; picture-in-picture';f.src='https://www.youtube-nocookie.com/embed/'+x.id+'?autoplay=1&playsinline=1&controls=1&enablejsapi=1&origin='+encodeURIComponent(location.origin);screen.appendChild(f);media.style.display='none';let post=doc.getElementById('post'+d);if(post)post.style.display='none';let title=doc.getElementById('title'+d);if(title)title.textContent=x.title;$('afdYTWorkspace').classList.remove('on');try{new BroadcastChannel('afd-dj-video').postMessage({type:'youtube-load',deck:d,videoId:x.id,title:x.title})}catch(e){}};</script></body></html>
