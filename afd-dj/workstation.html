<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes,maximum-scale=5"><meta name="theme-color" content="#020304"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="AFD DJ"><title>AFD DJ Workstation v38</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#020304;color:#eef2f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow-x:hidden}.wrap{width:100%;max-width:none;min-width:0;background:#020304;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}.consoleFrame{width:100%;height:720px;border:0;display:block}.dock{width:100%;border-top:1px solid #68717d;background:linear-gradient(#171c23,#080b10 45%,#030507);padding:8px}.toolbar,.tabs,.tools{display:flex;gap:6px;align-items:center;direction:ltr;flex-wrap:wrap}.toolbar button,.tabBtn,.tools button{height:34px;border:1px solid #626b77;border-radius:5px;background:linear-gradient(#3d454f,#171b21 58%,#090b0e);color:#fff;font-size:10px;font-weight:800;padding:0 12px;box-shadow:inset 0 1px #ffffff55,0 2px 4px #000}.primary{border-color:#8d5ed0!important;background:linear-gradient(#6d46a0,#2c1947 62%,#12091e)!important}.gold{border-color:#9a7b38!important;background:linear-gradient(#8b6b25,#3d2c0c 65%,#171006)!important;color:#ffe7a1!important}.search{flex:1;min-width:180px;height:34px;border:1px solid #414954;border-radius:5px;background:#05070a;color:#fff;padding:0 10px}.tabs{margin-top:8px}.tabBtn.active{border-color:#8f5cff;background:linear-gradient(#754db0,#321d51)}.view{margin-top:7px;height:250px;border:1px solid #3e4650;border-radius:5px;overflow:hidden;background:#05070a}.localGrid{height:100%;display:grid;grid-template-columns:210px 1fr;direction:ltr}.folders{border-right:1px solid #303741;padding:8px;overflow:auto;font-size:10px}.folder{padding:7px;border-radius:4px;margin-bottom:3px;background:#0b0e13}.folder.active{background:#342052;color:#eadcff}.tracks{overflow:auto}.head,.row{display:grid;grid-template-columns:34px minmax(230px,1fr) 110px 65px 68px 68px 44px;gap:5px;align-items:center;direction:ltr}.head{position:sticky;top:0;background:#1a2028;color:#8e99a6;font-size:8px;padding:6px 8px;z-index:2}.row{padding:6px 8px;border-bottom:1px solid #1d2229;font-size:9px}.row button{height:25px;border:1px solid #59626d;border-radius:3px;background:#171c22;color:#fff;font-size:8px;font-weight:800}.fav.on{color:#ffd85e}.empty{height:100%;display:grid;place-items:center;text-align:center;color:#7e8996;font-size:12px}.onlineView,.automixView,.settingsView{height:100%;display:none;padding:10px;gap:10px;direction:ltr}.onlineView{grid-template-columns:repeat(3,1fr)}.card{border:1px solid #4c5560;border-radius:7px;background:linear-gradient(145deg,#1b2028,#0b0e13 58%,#050609);padding:12px;display:flex;flex-direction:column;gap:8px}.card h3{margin:0}.card input,.card button,.settingsView input{height:34px;border:1px solid #414a55;border-radius:4px;background:#090c10;color:#fff;padding:0 9px}.tools{margin-top:7px;padding-top:7px;border-top:1px solid #303741}.status{margin-left:auto;font-size:9px;color:#9ba6b2}.hidden{display:none!important}.automixView{grid-template-columns:1fr 1fr}.queue{border:1px solid #333b45;border-radius:5px;padding:8px;overflow:auto}.queueItem{padding:7px;border-bottom:1px solid #222832;font-size:10px}.settingsView{grid-template-columns:repeat(3,1fr);overflow:auto}.setting{border:1px solid #333b45;border-radius:5px;padding:10px}.setting label{display:block;font-size:9px;color:#aab4c0;margin-bottom:5px}@media(max-width:900px){.consoleFrame{height:690px}.localGrid{grid-template-columns:160px 1fr}.onlineView,.settingsView,.automixView{grid-template-columns:1fr;overflow:auto}}@media(max-width:700px){.localGrid{grid-template-columns:130px 1fr}.head,.row{grid-template-columns:30px minmax(170px,1fr) 62px 62px 40px}.head span:nth-child(3),.row span:nth-child(3),.head span:nth-child(4),.row span:nth-child(4){display:none}}</style></head><body><div class="wrap"><iframe id="console" class="consoleFrame" src="./ultra.html?v=23" allow="autoplay; fullscreen"></iframe><section class="dock"><div class="toolbar"><button id="folderBtn" class="primary">📁 פתח תיקייה</button><button id="filesBtn">＋ הוסף קבצים</button><button id="favBtn">★ מועדפים</button><button id="playlistBtn">＋ PLAYLIST</button><input id="search" class="search" placeholder="חיפוש בשירים / וידאו..."><button id="onlineTop" class="gold">🌐 ONLINE MUSIC</button></div><input id="folderInput" type="file" webkitdirectory directory multiple accept="audio/*,video/*" class="hidden"><input id="filesInput" type="file" multiple accept="audio/*,video/*" class="hidden"><div class="tabs"><button class="tabBtn active" data-view="local">LOCAL LIBRARY</button><button class="tabBtn" data-view="automix">AUTOMIX</button><button class="tabBtn" data-view="online">ONLINE MUSIC</button><button class="tabBtn" data-view="settings">SETTINGS</button></div><div class="view"><div id="local" class="localGrid"><aside class="folders"><b>תיקיות</b><div class="folder active" data-filter="all">כל המדיה</div><div class="folder" data-filter="favorites">★ מועדפים</div><div id="folderList"></div></aside><main class="tracks"><div class="head"><span>#</span><span>שם</span><span>תיקייה</span><span>סוג</span><span>A</span><span>B</span><span>★</span></div><div id="rows"><div class="empty">פתח תיקייה שלמה או הוסף כמה קבצים. אחר כך טען שיר ל־Deck A/B.</div></div></main></div><div id="automix" class="automixView"><div class="queue"><b>AUTOMIX QUEUE</b><div id="queue"></div></div><div class="card"><h3>Automix</h3><p>הוסף שירים מהספרייה לתור והפעל מעבר אוטומטי.</p><label>Fade seconds <input id="fade" type="number" value="6" min="1" max="20"></label><button id="autoStart">▶ START AUTOMIX</button><button id="autoStop">■ STOP</button></div></div><div id="online" class="onlineView"><article class="card"><h3>YouTube</h3><input id="ytSearch" placeholder="חפש ב‑YouTube"><button id="ytBtn">חיפוש YouTube</button><small>נגן רשמי; לא מעבדים את הזרם כמו קובץ מקומי.</small></article><article class="card"><h3>Spotify</h3><input id="spSearch" placeholder="חפש ב‑Spotify"><button id="spBtn">התחבר / חפש Spotify</button><small>חיבור OAuth רשמי.</small></article><article class="card"><h3>Apple Music</h3><input id="amSearch" placeholder="חפש ב‑Apple Music"><button id="amBtn">התחבר / חפש Apple Music</button><small>MusicKit רשמי.</small></article></div><div id="settings" class="settingsView"><div class="setting"><label>YouTube API Key</label><input id="ytKey" placeholder="API Key"><button id="saveSettings">שמור</button></div><div class="setting"><label>Spotify Client ID</label><input id="spId" placeholder="Client ID"><button id="saveSettings2">שמור</button></div><div class="setting"><label>Apple Music Developer Token</label><input id="amToken" placeholder="Developer Token"><button id="saveSettings3">שמור</button></div></div></div><div class="tools"><button id="loopA">LOOP 8 A</button><button id="loopB">LOOP 8 B</button><button id="syncA">SYNC A→B</button><button id="syncB">SYNC B→A</button><button id="external">▣ EXTERNAL VIDEO</button><button id="clearBtn">נקה ספרייה</button><span id="status" class="status">AFD DJ READY</span></div></section></div><script>const $=id=>document.getElementById(id),views=['local','automix','online','settings'];let library=[],activeFolder='all',queue=[],autoTimer=null;const cw=()=>$('console').contentWindow;function fitConsole(){try{const d=$('console').contentDocument;if(!d||!d.head)return;let st=d.getElementById('afdResponsiveFix');if(!st){st=d.createElement('style');st.id='afdResponsiveFix';d.head.appendChild(st)}st.textContent='html,body{width:100%!important;min-width:0!important;overflow-x:hidden!important}.app{width:100%!important;min-width:0!important;max-width:none!important;margin:0!important;padding:clamp(4px,.7vw,10px)!important;transform:none!important}@media(max-width:900px){.app{width:100%!important;min-width:0!important;transform:none!important}.console{grid-template-columns:1fr 1.12fr 1fr!important;gap:5px!important}.panel{padding:5px!important}.screenRow{grid-template-columns:40px 1fr 40px!important;gap:4px!important}.lower{grid-template-columns:1fr 82px 48px!important;gap:5px!important}.jog{width:78px!important;height:78px!important}.jog:after{inset:23px!important}.masterScreen{height:260px!important}.library{grid-template-columns:145px 1fr 190px!important}}';}catch(e){}}$('console').addEventListener('load',()=>{fitConsole();try{const doc=$('console').contentDocument;doc.addEventListener('click',e=>{const b=e.target.closest?.('[data-act="play"]');if(!b)return;const d=b.dataset.d;const title=doc.getElementById('title'+d);if(title&&title.textContent.includes('Drop a track')){e.preventDefault();e.stopImmediatePropagation()}},true);const old=doc.getElementById('loadBtn');if(old)old.style.display='none'}catch(e){}});function esc(s){return String(s||'').replace(/[<>&"]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[m]))}function folderOf(f){let p=f.webkitRelativePath||'';return p.includes('/')?p.split('/').slice(0,-1).join('/'):'Files'}function ingest(files){[...files].forEach(f=>{if(!f.type.startsWith('audio/')&&!f.type.startsWith('video/'))return;if(!library.some(x=>x.f.name===f.name&&x.f.size===f.size))library.push({f,folder:folderOf(f),fav:false,type:f.type.startsWith('video/')?'VIDEO':'AUDIO'})});renderFolders();render()}function renderFolders(){let ns=[...new Set(library.map(x=>x.folder))];$('folderList').innerHTML=ns.map(n=>'<div class="folder" data-filter="'+esc(n)+'">📁 '+esc(n)+'</div>').join('');bindFolders()}function bindFolders(){document.querySelectorAll('.folder').forEach(el=>el.onclick=()=>{activeFolder=el.dataset.filter;document.querySelectorAll('.folder').forEach(x=>x.classList.toggle('active',x===el));render()})}bindFolders();function render(){let q=$('search').value.toLowerCase();let a=library.filter(x=>(activeFolder==='all'||activeFolder==='favorites'&&x.fav||x.folder===activeFolder)&&(!q||x.f.name.toLowerCase().includes(q)||x.folder.toLowerCase().includes(q)));$('rows').innerHTML=a.length?a.map((x,i)=>'<div class="row" data-i="'+library.indexOf(x)+'"><span>'+String(i+1).padStart(2,'0')+'</span><b>'+esc(x.f.name)+'</b><span>'+esc(x.folder)+'</span><span>'+x.type+'</span><button data-d="A">LOAD A</button><button data-d="B">LOAD B</button><button class="fav '+(x.fav?'on':'')+'">★</button></div>').join(''):'<div class="empty">אין פריטים להצגה.</div>';document.querySelectorAll('.row').forEach(r=>{r.querySelectorAll('[data-d]').forEach(b=>b.onclick=e=>{e.stopPropagation();loadDeck(b.dataset.d,library[+r.dataset.i].f)});r.querySelector('.fav').onclick=e=>{e.stopPropagation();library[+r.dataset.i].fav=!library[+r.dataset.i].fav;render()};r.ondblclick=()=>loadDeck('A',library[+r.dataset.i].f);r.oncontextmenu=e=>{e.preventDefault();queue.push(library[+r.dataset.i]);renderQueue()}})}function loadDeck(d,f){try{if(typeof cw().load==='function'){cw().load(d,f);$('status').textContent='Loaded '+f.name+' → Deck '+d}else $('status').textContent='Deck engine not ready'}catch(e){$('status').textContent='Load error'}}function renderQueue(){$('queue').innerHTML=queue.length?queue.map((x,i)=>'<div class="queueItem">'+(i+1)+'. '+esc(x.f.name)+'</div>').join(''):'<div class="empty">לחיצה ארוכה / קליק ימני על שיר מוסיפה אותו לתור.</div>'}$('folderBtn').onclick=()=>$('folderInput').click();$('filesBtn').onclick=()=>$('filesInput').click();$('folderInput').onchange=e=>ingest(e.target.files);$('filesInput').onchange=e=>ingest(e.target.files);$('search').oninput=render;$('favBtn').onclick=()=>{activeFolder='favorites';render()};$('playlistBtn').onclick=()=>{viewsShow('automix');$('status').textContent='בחר שירים מהספרייה בלחיצה ארוכה כדי להוסיף לתור'};$('clearBtn').onclick=()=>{library=[];queue=[];renderFolders();render();renderQueue()};function viewsShow(v){views.forEach(x=>$(x).style.display=x===v?'grid':'none');document.querySelectorAll('.tabBtn').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}document.querySelectorAll('.tabBtn').forEach(b=>b.onclick=()=>viewsShow(b.dataset.view));$('onlineTop').onclick=()=>viewsShow('online');function deckMedia(d){try{return cw().document.getElementById('vid'+d)}catch(e){return null}}function loop(d){let m=deckMedia(d);if(!m)return;let s=m.currentTime,end=s+8;let fn=()=>{if(m.currentTime>=end)m.currentTime=s};m.addEventListener('timeupdate',fn);setTimeout(()=>m.removeEventListener('timeupdate',fn),60000);$('status').textContent='8s loop Deck '+d}$('loopA').onclick=()=>loop('A');$('loopB').onclick=()=>loop('B');$('syncA').onclick=()=>{try{let w=cw();if(typeof w.sync==='function')w.sync('A')}catch(e){}};$('syncB').onclick=()=>{try{let w=cw();if(typeof w.sync==='function')w.sync('B')}catch(e){}};$('external').onclick=()=>{let w=window.open('./external_output.html','afdExternal','width=1280,height=720');$('status').textContent=w?'External video window opened':'Popup blocked'};$('autoStart').onclick=()=>{if(!queue.length)return $('status').textContent='Automix queue empty';let i=0,fade=Math.max(1,+$('fade').value||6);clearInterval(autoTimer);loadDeck('A',queue[0].f);setTimeout(()=>deckMedia('A')?.play().catch(()=>{}),300);autoTimer=setInterval(()=>{i++;if(i>=queue.length){clearInterval(autoTimer);return}let d=i%2?'B':'A';loadDeck(d,queue[i].f);setTimeout(()=>deckMedia(d)?.play().catch(()=>{}),300)},Math.max(15000,fade*1000+9000));$('status').textContent='Automix running'};$('autoStop').onclick=()=>{clearInterval(autoTimer);$('status').textContent='Automix stopped'};function save(){localStorage.setItem('afdYT',$('ytKey').value);localStorage.setItem('afdSP',$('spId').value);localStorage.setItem('afdAM',$('amToken').value);$('status').textContent='Settings saved'}['saveSettings','saveSettings2','saveSettings3'].forEach(id=>$(id).onclick=save);$('ytKey').value=localStorage.getItem('afdYT')||'';$('spId').value=localStorage.getItem('afdSP')||'';$('amToken').value=localStorage.getItem('afdAM')||'';$('ytBtn').onclick=e=>{e.preventDefault();e.stopPropagation();if(typeof window.AFDOpenYT==='function')window.AFDOpenYT()};$('spBtn').onclick=()=>window.open('https://open.spotify.com/search/'+encodeURIComponent($('spSearch').value),'_blank');$('amBtn').onclick=()=>window.open('https://music.apple.com/us/search?term='+encodeURIComponent($('amSearch').value),'_blank');renderQueue();viewsShow('local');</script><script src="./inline-youtube.js?v=38"></script></body></html>
