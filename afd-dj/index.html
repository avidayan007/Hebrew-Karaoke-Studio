<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050608"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="AFD DJ"><title>AFD DJ Mobile</title><style>*{box-sizing:border-box}body{margin:0;background:#030405;color:#eef2f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input{font:inherit}.top{height:50px;display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:linear-gradient(#11151b,#050608);border-bottom:1px solid #2a303a;position:sticky;top:0;z-index:20}.brand{font-weight:900;letter-spacing:1px;color:#b28cff}.brand small{color:#7e8a9e;font-weight:500;margin-right:8px}.add{background:linear-gradient(#8d69ff,#5232bb);color:white;border:1px solid #9c7cff;border-radius:6px;padding:8px 12px;box-shadow:inset 0 1px #ffffff55,0 3px #1d104d}.add:active,.btn:active{transform:translateY(2px)}#files{display:none}.app{display:grid;grid-template-columns:1fr 1.08fr 1fr;gap:7px;padding:7px;min-width:980px}.panel{background:linear-gradient(#11161d,#07090d);border:1px solid #2c333e;border-radius:5px;box-shadow:inset 0 1px #ffffff12,0 7px 18px #000b}.deck{padding:7px}.head{display:flex;align-items:center;justify-content:space-between;height:30px}.tag{font-weight:900}.bpm{font-size:18px}.wave{height:28px;display:flex;align-items:center;gap:1px;background:#05070a;border:1px solid #232a34;padding:3px}.wave i{flex:1;min-width:2px;border-radius:1px;background:linear-gradient(#b92cff,#247bff)}.wave i:nth-child(4n+1){height:7px}.wave i:nth-child(4n+2){height:19px}.wave i:nth-child(4n+3){height:12px}.wave i:nth-child(4n){height:23px}.screen{height:230px;position:relative;background:#010203;border:1px solid #465164;margin-top:5px;overflow:hi px}.masterhead{display:flex;justify-content:space-between;align-items:center;height:30px}.external{background:linear-gradient(#314853,#142831);color:#8eeaff;border:1px solid #3e7886;border-radius:4px;padding:6px 8px;font-size:9px}.master{height:270px;position:relative;background:#010203;border:1px solid #4a5669;overflow:hidden}.master #mA{z-index:1}.master #mB{z-index:2}.master .placeholder{color:#41d6ff}.mixline{display:grid;grid-template-columns:16px 1fr 16px;gap:5px;align-items:center;margin-top:5px;font-size:9px}.mixer{padding:8px}.meters{display:grid;grid-template-columns:1fr 1fr;gap:5px}.meter{height:55px;background:repeating-linear-gradient(to top,#32d66d 0 3px,transparent 3px 6px);border:1px solid #23302a}.automix{width:100%;margin-top:7px;background:linear-gradient(#875cff,#4d2cb5);color:white;border:1px solid #9977ff;border-radius:4px;padding:9px;font-weight:900}.library{grid-column:1/-1;min-height:320px;display:grid;grid-template-rows:42px 1fr}.libhead{display:flex;align-items:center;gap:5px;padding:5px;border-bottom:1px solid #2b323e}.tab{background:#161d27;color:#b7c0ce;border:1px solid #354052;border-radius:4px;padding:7px 10px}.tab.active{background:#5532b9;color:white}.search{margin-right:auto;min-width:300px;background:#070b11;color:white;border:1px solid #344052;border-radius:4px;padding:7px}.libbody{display:grid;grid-template-columns:170px 1fr}.folders{padding:7px;border-left:1px solid #2a313c}.folder{display:block;width:100%;text-align:right;background:transparent;border:0;color:#b1bbca;padding:8px}.folder.active{background:#4b2a9d;color:white}.rows{overflow:auto;max-height:380px}.row{display:grid;grid-template-columns:44px minmax(0,1fr) 75px 75px 55px 55px;gap:5px;align-items:center;padding:7px;border-bottom:1px solid #202733;direction:ltr}.ico{width:38px;height:32px;display:grid;place-items:center;background:linear-gradient(135deg,#5b38c7,#1b7db7);border-radius:3px;font-size:9px}.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{font-size:9px;color:#7f8b9d}.small{background:#171f2b;color:white;border:1px solid #39475d;border-radius:3px;padding:6px}.online{display:none;padding:10px}.providergrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.provider{border:1px solid #354052;background:#0b1017;padding:10px}.provider b{display:block}.provider small{color:#8592a7}.provider button{margin-top:8px;background:#202a38;color:white;border:1px solid #46566e;padding:7px;border-radius:4px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111825;border:1px solid #39475d;padding:9px 14px;border-radius:5px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:1050px){.app{transform-origin:top left}.screen{height:210px}.master{height:245px}}@media(max-width:760px){body{overflow-x:auto}.top{min-width:980px}.app{min-width:980px}}</style></head><body><div class="top"><div class="brand">AFD DJ <small>iPhone / iPad</small></div><button class="add" id="add">＋ הוסף קבצים</button><input id="files" type="file" multiple accept="audio/*,video/*,.mp3,.wav,.m4a,.aac,.mp4,.mov,.m4v,.webm"></div><main class="app"><section class="panel deck deckA"><div class="head"><span class="tag">DECK A</span><b class="bpm" id="bpmA">--</b></div><div class="wave" id="wa"></div><div class="screen"><video id="vA" playsinline muted></video><div class="placeholder" id="pA">A</div></div><div class="title" id="tA">בחר שיר או וידאו</div><div class="times"><div><b id="eA">00:00</b><small>עבר</small></div><div><b id="rA">-00:00</b><small>נותר</small></div><div><b id="dA">00:00</b><small>משך</small></div></div><input class="seek" id="sA" type="range" min="0" max="1000" value="0"><div class="transport"><button class="btn" id="cueA">CUE</button><button class="btn play" id="playA">PLAY</button><button class="btn sync" id="syncA">SYNC</button><button class="btn" id="loopA">LOOP 8</button></div><div class="cues"><span>HOT CUES</span><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button><button>7</button><button>8</button></div><div class="sliders"><label>GAIN<input id="gA" type="range" min="0" max="1.5" step=".01" value="1"></label><label>PITCH<input id="pitchA" type="range" min="-16" max="16" step=".1" value="0"></label><label>FILTER<input type="range" min="0" max="100" value="50"></label></div></section><section class="center"><div class="panel masterbox"><div class="masterhead"><b>MASTER VIDEO</b><button class="external" id="ext">↗ EXTERNAL</button></div><div class="master"><video id="mA" playsinline muted></video><video id="mB" playsinline muted></video><div class="placeholder" id="mp">AFD</div></div><div class="mixline"><span>A</span><input class="xf" id="vxf" type="range" min="-1" max="1" step=".01" value="0"><span>B</span></div></div><div class="panel mixer"><b>MIXER</b><div class="meters"><div class="meter"></div><div class="meter"></div></div><div class="mixline"><span>A</span><input class="xf" id="xf" type="range" min="-1" max="1" step=".01" value="0"><span>B</span></div><button class="automix" id="auto">AUTOMIX: OFF</button></div></section><section class="panel deck deckB"><div class="head"><span class="tag">DECK B</span><b class="bpm" id="bpmB">--</b></div><div class="wave" id="wb"></div><div class="screen"><video id="vB" playsinline muted></video><div class="placeholder" id="pB">B</div></div><div class="title" id="tB">בחר שיר או וידאו</div><div class="times"><div><b id="eB">00:00</b><small>עבר</small></div><div><b id="rB">-00:00</b><small>נותר</small></div><div><b id="dB">00:00</b><small>משך</small></div></div><input class="seek" id="sB" type="range" min="0" max="1000" value="0"><div class="transport"><button class="btn" id="cueB">CUE</button><button class="btn play" id="playB">PLAY</button><button class="btn sync" id="syncB">SYNC</button><button class="btn" id="loopB">LOOP 8</button></div><div class="cues"><span>HOT CUES</span><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button><button>7</button><button>8</button></div><div class="sliders"><label>GAIN<input id="gB" type="range" min="0" max="1.5" step=".01" value="1"></label><label>PITCH<input id="pitchB" type="range" min="-16" max="16" step=".1" value="0"></label><label>FILTER<input type="range" min="0" max="100" value="50"></label></div></section><section class="panel library"><div class="libhead"><button class="tab active" data-view="lib">ספרייה</button><button class="tab" data-view="online">ONLINE MUSIC</button><input id="search" class="search" placeholder="חיפוש בקבצים..."></div><div class="libbody"><aside class="folders"><button class="folder active">כל הקבצים</button><button class="folder">אודיו</button><button class="folder">וידאו</button><button class="folder">★ מועדפים</button><button class="folder">פלייליסטים</button></aside><div><div class="rows" id="rows"></div><div class="online" id="online"><div class="providergrid"><div class="provider"><b>▶ YouTube</b><small>Video + Music</small><button onclick="notice('YouTube יתחבר דרך API והנגן הרשמי')">CONNECT</button></div><div class="provider"><b>● Spotify</b><small>Search + official playback</small><button onclick="notice('Spotify יתחבר דרך מסך ההרשאה הרשמי')">CONNECT</button></div><div class="provider"><b>♪ Apple Music</b><small>MusicKit</small><button onclick="notice('Apple Music יתחבר דרך MusicKit')">CONNECT</button></div></div></div></div></div></section></main><div class="toast" id="toast"></div><script>const $=x=>document.getElementById(x),AC=window.AudioContext||window.webkitAudioContext,ac=new AC,master=ac.createGain();master.connect(ac.destination);let library=[],automix=false;for(const id of ['wa','wb']){for(let i=0;i<64;i++){let e=document.createElement('i');$(id).appendChild(e)}}function notice(t){let x=$('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}function fmt(s){if(!isFinite(s))return'00:00';s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')}function vid(f){return f.type.startsWith('video/')||/\.(mp4|mov|m4v|webm)$/i.test(f.name)}function mk(id){let a=document.createElement('audio'),src=ac.createMediaElementSource(a),gain=ac.createGain();src.connect(gain).connect(master);return{id,a,gain,track:null,bpm:null,loop:false,ls:0}}const A=mk('A'),B=mk('B'),D={A,B};async function bpm(file){try{let ab=await file.arrayBuffer(),b=await ac.decodeAudioData(ab),d=b.getChannelData(0),sr=b.sampleRate,hop=1024,env=[];for(let i=0;i<d.length-hop;i+=hop){let s=0;for(let j=0;j<hop;j++)s+=Math.abs(d[i+j]);env.push(s/hop)}let best=0,lag0=0,min=Math.floor(sr/hop*60/190),max=Math.floor(sr/hop*60/75);for(let lag=min;lag<=max;lag++){let c=0;for(let i=lag;i<env.length;i++)c+=env[i]*env[i-lag];if(c>best){best=c;lag0=lag}}let n=60*sr/(hop*lag0);return Math.round(n*10)/10}catch{return null}}async function add(files){await ac.resume();for(const f of files){let t={id:crypto.randomUUID?.()||Date.now()+Math.random(),file:f,name:f.name,type:vid(f)?'video':'audio',url:URL.createObjectURL(f),duration:0,bpm:null};library.push(t);let m=document.createElement(t.type==='video'?'video':'audio');m.src=t.url;m.onloadedmetadata=()=>{t.duration=m.duration;render()};bpm(f).then(x=>{t.bpm=x;render()})}render()}function render(){let q=$('search').value.toLowerCase();$('rows').innerHTML=library.filter(t=>t.name.toLowerCase().includes(q)).map(t=>`<div class="row"><div class="ico">${t.type==='video'?'VID':'AUD'}</div><div><div class="name">${t.name.replace(/[&<>]/g,'')}</div><div class="muted">${t.type.toUpperCase()}</div></div><div class="muted">${t.bpm||'...'} BPM</div><div class="muted">${fmt(t.duration)}</div><button class="small" onclick="load('A','${t.id}')">A</button><button class="small" onclick="load('B','${t.id}')">B</button></div>`).join('')||'<div class="muted" style="padding:20px">לחץ על הוסף קבצים כדי להתחיל.</div>'}window.load=async(id,k)=>{await ac.resume();let d=D[id],t=library.find(x=>x.id==k);if(!t)return;d.a.pause();d.track=t;d.bpm=t.bpm;d.a.src=t.url;d.a.load();$('t'+id).textContent=t.name;$('bpm'+id).textContent=t.bpm||'--';let v=$('v'+id),p=$('p'+id);if(t.type==='video'){v.src=t.url;v.style.display='block';p.style.display='none'}else{v.removeAttribute('src');v.style.display='none';p.style.display='grid'}syncM(d)};function syncM(d){let m=$('m'+d.id);if(d.track?.type==='video'){if(m.src!==d.track.url)m.src=d.track.url;if(Math.abs((m.currentTime||0)-d.a.currentTime)>.25)m.currentTime=d.a.currentTime;m.playbackRate=d.a.playbackRate;if(!d.a.paused)m.play().catch(()=>{});else m.pause()}else{m.pause();m.removeAttribute('src')}mixV()}function mixV(){let x=+$('vxf').value,a=Math.cos((x+1)*Math.PI/4),b=Math.sin((x+1)*Math.PI/4);$('mA').style.opacity=a;$('mB').style.opacity=b;$('mp').style.display=(A.track?.type==='video'||B.track?.type==='video')?'none':'grid'}function mix(){let x=+$('xf').value;A.gain.gain.value=(+$('gA').value)*Math.cos((x+1)*Math.PI/4);B.gain.gain.value=(+$('gB').value)*Math.sin((x+1)*Math.PI/4)}for(const id of ['A','B']){let d=D[id];$('play'+id).onclick=async()=>{await ac.resume();if(!d.track)return notice('טען שיר קודם');d.a.paused?d.a.play():d.a.pause()};$('cue'+id).onclick=()=>{d.a.pause();d.a.currentTime=0};$('s'+id).oninput=e=>{if(isFinite(d.a.duration))d.a.currentTime=+e.target.value/1000*d.a.duration};$('pitch'+id).oninput=e=>d.a.playbackRate=1+(+e.target.value/100);$('sync'+id).onclick=()=>{let o=id==='A'?B:A;if(!d.bpm||!o.bpm)return notice('צריך BPM בשני הדקים');d.a.playbackRate=Math.max(.84,Math.min(1.16,o.bpm/d.bpm));notice('Deck '+id+' סונכרן')};$('loop'+id).onclick=()=>{d.loop=!d.loop;d.ls=d.a.currentTime;$('loop'+id).textContent=d.loop?'LOOP ON':'LOOP 8'};d.a.ontimeupdate=()=>{let c=d.a.currentTime||0,du=d.a.duration||0;$('e'+id).textContent=fmt(c);$('r'+id).textContent='-'+fmt(du-c);$('d'+id).textContent=fmt(du);$('s'+id).value=du?c/du*1000:0;if(d.loop&&c>d.ls+8)d.a.currentTime=d.ls;syncM(d);if(automix&&!d._done&&du-c<10){let o=id==='A'?B:A;if(o.track){d._done=true;o.a.play().catch(()=>{});fade(id==='A'?1:-1,8)}}};d.a.onplay=()=>$('play'+id).textContent='PAUSE';d.a.onpause=()=>$('play'+id).textContent='PLAY'}function fade(to,sec){let s=+$('xf').value,i=0,n=sec*30,iv=setInterval(()=>{i++;$('xf').value=s+(to-s)*i/n;mix();$('vxf').value=$('xf').value;mixV();if(i>=n)clearInterval(iv)},33)}$('xf').oninput=()=>{$('vxf').value=$('xf').value;mix();mixV()};$('vxf').oninput=()=>{$('xf').value=$('vxf').value;mix();mixV()};$('gA').oninput=mix;$('gB').oninput=mix;$('auto').onclick=()=>{automix=!automix;$('auto').textContent='AUTOMIX: '+(automix?'ON':'OFF');A._done=B._done=false};$('add').onclick=()=>$('files').click();$('files').onchange=e=>add([...e.target.files]);$('search').oninput=render;$('ext').onclick=()=>{let w=window.open('','AFD_MASTER','width=1280,height=720');if(!w)return notice('יש לאפשר חלונות קופצים');w.document.write('<style>html,body{margin:0;background:#000;width:100%;height:100%;overflow:hidden}video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain}</style><video id="x" autoplay muted playsinline></video>');let chosen=+$('vxf').value>.1?B:A;if(chosen.track?.type==='video')w.document.getElementById('x').src=chosen.track.url};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('rows').style.display=b.dataset.view==='lib'?'block':'none';$('online').style.display=b.dataset.view==='online'?'block':'none'});mix();mixV();render()</script></body></html>
