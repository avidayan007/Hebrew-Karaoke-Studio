<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#020304"><title>AFD DJ 0.7</title><style>*{box-sizing:border-box}body{margin:0;background:#020304;color:#eee;font-family:-apple-system,Arial;overflow-x:auto}.bar{height:45px;min-width:1100px;background:linear-gradient(#1d2025,#070809);border-bottom:1px solid #555;display:flex;align-items:center;padding:5px 10px;gap:8px}.logo{font-size:22px;font-weight:900;color:#ad70ff}.spacer{flex:1}.bar button,.key{background:linear-gradient(#454b54,#16191e 45%,#07090c);border:1px solid #747b84;color:#fff;border-radius:4px;box-shadow:inset 0 1px #fff6,0 3px #000;padding:8px 13px;font-weight:800}.app{min-width:1100px;padding:5px;display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:5px}.metal{background:repeating-linear-gradient(90deg,#0c0e11 0 2px,#111419 2px 4px);border:1px solid #555b63;box-shadow:inset 0 1px #fff2,0 5px 12px #000b}.deck{padding:6px}.head{display:flex;align-items:center;gap:7px}.badge{width:34px;height:34px;display:grid;place-items:center;border:1px solid #7e47cc;color:#c18cff;font-size:20px;font-weight:900;background:linear-gradient(#292d34,#08090b);box-shadow:0 0 9px #8b4de866}.B .badge{border-color:#2585d3;color:#62baff;box-shadow:0 0 9px #2585d366}.title{flex:1;font-size:11px}.bpm{font-size:20px}.wave{height:34px;margin:5px 0;background:repeating-linear-gradient(90deg,#8c31d7 0 2px,transparent 2px 4px),linear-gradient(#0b0e12,#050607);border:1px inset #39404a;box-shadow:inset 0 0 8px #000}.B .wave{background:repeating-linear-gradient(90deg,#257dd1 0 2px,transparent 2px 4px),linear-gradient(#0b0e12,#050607)}.screen{height:205px;background:radial-gradient(circle,#253b57,#080b10 65%);border:2px solid #050607;outline:1px solid #5a626c;display:grid;place-items:center;font-size:54px;font-weight:900;color:#9 :center;font-size:10px;border-bottom:1px solid #444;padding:6px}.masterScreen{height:260px;margin-top:5px;background:radial-gradient(circle,#204e75,#0a1020 45%,#030405 78%);border:2px solid #050607;outline:1px solid #5c6470;display:grid;place-items:center;font-size:52px;font-weight:900;color:#63d7ff;box-shadow:inset 0 0 22px #000}.xf{width:100%;accent-color:#844fd1}.mixer{margin-top:6px;padding:7px;display:grid;grid-template-columns:1fr 80px 1fr;gap:8px}.channel{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;justify-items:center}.meters{display:flex;gap:4px}.meter{width:19px;height:145px;background:repeating-linear-gradient(to top,#2bd05b 0 4px,#071109 4px 7px);border:2px inset #343b43;box-shadow:0 0 5px #32e86944}.lib{grid-column:1/-1;min-height:310px;display:grid;grid-template-columns:150px 1fr 210px 185px}.folders,.side,.tools{padding:7px;border-right:1px solid #30363e}.folders b,.side b,.tools b{font-size:10px}.folders button{display:block;width:100%;text-align:left;background:transparent;color:#abb4c2;border:0;padding:7px;font-size:9px}.folders .on{background:linear-gradient(90deg,#6135b4,#251546);color:white}.browser{border-right:1px solid #30363e}.search{padding:6px;border-bottom:1px solid #30363e}.search input{width:100%;background:#070a0e;color:white;border:1px solid #3a4553;padding:7px}.rows div{display:grid;grid-template-columns:35px 1fr 100px 55px 45px 55px;gap:5px;padding:7px;border-bottom:1px solid #20252c;font-size:8px}.rows .h{background:linear-gradient(#1b1f25,#0a0c0f);color:#98a3b2}.sidepic{height:110px;margin-top:7px;background:radial-gradient(circle,#214c72,#0a0e1b 60%);display:grid;place-items:center;font-size:30px;color:#9d69ff;border:1px solid #555}.tool{margin-top:6px;border:1px solid #333b46;background:linear-gradient(#15191f,#080a0d);padding:6px}.sam{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}.sam button{height:27px;color:#fff;border:1px solid #555;background:#6930ad}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111923;border:1px solid #555;padding:10px 15px;display:none}</style></head><body><div class="bar"><div class="logo">AFD DJ <small>0.7 PRO</small></div><button>2 DECKS</button><button>VIDEO</button><button>FX</button><div class="spacer"></div><button onclick="pick.click()">＋ ADD FILES</button><input id="pick" type="file" multiple hidden accept="audio/*,video/*"></div><main class="app"><section class="metal deck A"><div class="head"><div class="badge">A</div><div class="title" id="ta">DECK A — Load Track</div><div class="bpm">128.00</div></div><div class="wave"></div><div class="screen" id="sa">A</div><div class="pads"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button><button>7</button><button>8</button></div><div class="controls"><div class="buttons"><button class="key cue">CUE</button><button class="key play">▶ PLAY</button><button class="key sync">SYNC</button></div><div class="jog"></div><div class="knobs"><div class="knob"></div><div class="knob"></div><div class="knob"></div></div></div></section><section><div class="metal master"><div class="tabs">MASTER VIDEO &nbsp; | &nbsp; SCR 2 (EXTERNAL) &nbsp; | &nbsp; TRANSITIONS</div><div class="masterScreen">AFD</div><input class="xf" type="range" min="0" max="100" value="50"></div><div class="metal mixer"><div class="channel"><div class="knob"></div><div class="knob"></div><div class="knob"></div><div class="knob"></div></div><div class="meters"><div class="meter"></div><div class="meter"></div></div><div class="channel"><div class="knob"></div><div class="knob"></div><div class="knob"></div><div class="knob"></div></div></div></section><section class="metal deck B"><div class="head"><div class="badge">B</div><div class="title" id="tb">DECK B — Load Track</div><div class="bpm">128.00</div></div><div class="wave"></div><div class="screen" id="sb">B</div><div class="pads"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button><button>7</button><button>8</button></div><div class="controls"><div class="buttons"><button class="key cue">CUE</button><button class="key play">▶ PLAY</button><button class="key sync">SYNC</button></div><div class="jog"></div><div class="knobs"><div class="knob"></div><div class="knob"></div><div class="knob"></div></div></div></section><section class="metal lib"><aside class="folders"><b>LIBRARY</b><button class="on">♫ All Music</button><button>▣ Music</button><button>▣ Videos</button><button>★ Favorites</button><br><b>PLAYLISTS</b><button>★ Main Playlist</button><button class="on">♫ Club Hits</button><button>EDM Bangers</button><button>Party Time</button></aside><div class="browser"><div class="search"><input placeholder="Search in Library..."></div><div class="rows" id="rows"><div class="h"><span>#</span><span>TITLE</span><span>ARTIST</span><span>BPM</span><span>KEY</span><span>LENGTH</span></div></div></div><aside class="side"><b>SIDEVIEW</b><div class="sidepic">AFD</div><p style="font-size:10px">Selected Track</p><p style="font-size:8px;color:#999">128 BPM • Bm</p><div class="wave"></div></aside><aside class="tools"><div class="tool"><b>AUTOMIX</b><p style="font-size:8px">Transition: 8 sec</p></div><div class="tool"><b>EFFECTS — FLANGER</b><div class="channel" style="margin-top:8px"><div class="knob"></div><div class="knob"></div><div class="knob"></div><div class="knob"></div></div></div><div class="tool"><b>SAMPLER</b><div class="sam"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button><button>7</button><button>8</button></div></div></aside></section></main><div class="toast" id="toast"></div><script>const rows=document.getElementById('rows'),pick=document.getElementById('pick');pick.onchange=e=>{[...e.target.files].forEach((f,i)=>{let r=document.createElement('div');r.innerHTML='<span>♫</span><span>'+f.name.replace(/[<>]/g,'')+'</span><span>Local Media</span><span>...</span><span>--</span><span>--:--</span>';r.onclick=()=>{document.getElementById(i%2?'tb':'ta').textContent=f.name;document.getElementById(i%2?'sb':'sa').textContent=f.type.startsWith('video')?'VIDEO':'AUDIO'};rows.appendChild(r)})};document.querySelectorAll('.key,.pads button,.sam button').forEach(b=>b.onclick=()=>{b.style.filter='brightness(1.35)';setTimeout(()=>b.style.filter='',140)});</script></body></html>
