<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes,maximum-scale=5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#020304"><title>AFD DJ Responsive</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#020304;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{overflow:auto;-webkit-overflow-scrolling:touch}.shell{width:100%;min-height:100dvh;padding:max(4px,env(safe-area-inset-top)) max(4px,env(safe-area-inset-right)) max(4px,env(safe-area-inset-bottom)) max(4px,env(safe-area-inset-left));display:flex;justify-content:center;align-items:flex-start}.stage{position:relative;width:1220px;height:980px;transform-origin:top left;flex:none}.stage iframe{border:0;width:1220px;height:980px;display:block;background:#020304}.hint{position:fixed;z-index:20;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px 12px;border:1px solid #6f5c95;border-radius:999px;background:#0b0d12e8;color:#ddd;font-size:11px;box-shadow:0 4px 18px #0009;backdrop-filter:blur(8px);display:none;white-space:nowrap}.full{position:fixed;z-index:21;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));height:32px;padding:0 10px;border-radius:6px;border:1px solid #726184;background:linear-gradient(#393146,#15121d);color:#fff;font-size:10px;font-weight:800;box-shadow:0 3px 10px #000a}@media(min-width:1100px){.full{display:none}}@media(max-width:600px) and (orientation:portrait){.hint{display:block}}@media(display-mode:standalone){.hint{bottom:max(4px,env(safe-area-inset-bottom))}}</style></head><body><button class="full" id="full">מסך מלא</button><div class="shell" id="shell"><div class="stage" id="stage"><iframe id="app" src="./ultra.html?v=16" allow="autoplay; fullscreen"></iframe></div></div><div class="hint">לתצוגה גדולה יותר סובב את האייפון לרוחב</div><script>const BASE_W=1220,BASE_H=980,stage=document.getElementById('stage'),shell=document.getElementById('shell');function fit(){const vw=document.documentElement.clientWidth, vh=window.visualViewport?visualViewport.height:innerHeight;let s=Math.min(1,(vw-8)/BASE_W);if(vw>900&&vh>650)s=Math.min(1,(vw-12)/BASE_W);stage.style.transform=`scale(${s})`;stage.style.width=BASE_W+'px';stage.style.height=BASE_H+'px';shell.style.height=(BASE_H*s+8)+'px';shell.style.minHeight=Math.max(vh,BASE_H*s+8)+'px'}addEventListener('resize',fit,{passive:true});addEventListener('orientationchange',()=>setTimeout(fit,150),{passive:true});if(window.visualViewport)visualViewport.addEventListener('resize',fit,{passive:true});fit();document.getElementById('full').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};</script></body></html>
