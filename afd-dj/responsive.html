<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes,maximum-scale=5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#020304"><title>AFD DJ Responsive v17</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#020304;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow-x:hidden}.shell{width:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:flex;justify-content:center;align-items:flex-start}.viewport{position:relative;flex:none;overflow:hidden}.stage{position:absolute;left:0;top:0;width:1220px;height:980px;transform-origin:0 0}.stage iframe{border:0;width:1220px;height:980px;display:block;background:#020304}.hint{position:fixed;z-index:20;left:50%;bottom:max(7px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px 12px;border:1px solid #6f5c95;border-radius:999px;background:#0b0d12e8;color:#eee;font-size:11px;box-shadow:0 4px 18px #0009;backdrop-filter:blur(8px);display:none;white-space:nowrap;pointer-events:none}@media(max-width:600px) and (orientation:portrait){.hint{display:block}}</style></head><body><div class="shell"><div class="viewport" id="viewport"><div class="stage" id="stage"><iframe src="./ultra.html?v=17" allow="autoplay; fullscreen"></iframe></div></div></div><div class="hint">מומלץ לסובב את האייפון לרוחב</div><script>const W=1220,H=980,stage=document.getElementById('stage'),vp=document.getElementById('viewport');function fit(){const vv=window.visualViewport;const vw=Math.max(1,Math.floor(vv?vv.width:window.innerWidth));const pad=vw<700?2:8;const available=Math.max(1,vw-pad*2);const s=Math.min(1,available/W);stage.style.transform='scale('+s+')';vp.style.width=Math.round(W*s)+'px';vp.style.height=Math.round(H*s)+'px';}fit();window.addEventListener('resize',fit,{passive:true});window.addEventListener('orientationchange',()=>setTimeout(fit,250),{passive:true});if(window.visualViewport){visualViewport.addEventListener('resize',fit,{passive:true});visualViewport.addEventListener('scroll',fit,{passive:true});}</script></body></html>
